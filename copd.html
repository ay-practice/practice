<style>
:root{--navy:#0F3D49;--ink:#1D2433;--muted:#5C6375;--line:#E2E5EC;--paper:#FFFFFF;--bg:#F4F5F8;--gold:#D9A93F;--red:#A33A3A;--accent:#1D5E6E}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FA7E0;outline-offset:2px}
header{background:linear-gradient(180deg,#0F3D49 0%,#14505F 100%);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.hin{max-width:760px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.newc{font-size:14px;color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:#B9C1D6;padding:10px 2px 11px;font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;font-weight:600;border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.search{width:100%;font-size:16px;padding:11px 12px;border:1px solid #D3D8E4;border-radius:10px;background:#fff}
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:15px;padding:7px 12px;border-radius:18px;border:1px solid #CDD3E1;background:#fff;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.chip.cat{border-color:#D3D7E2;color:var(--ink);font-weight:500}
.chip.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}
.chip.cat.on::before{background:#fff}
.chip.cat.on{color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meta{font-size:14px;color:var(--muted);margin:12px 2px 8px;display:flex;justify-content:space-between;gap:8px}

// ---------- respiratory scores (all calculated on the phone) ----------
const CALCS=[{id:"gold",name:"GOLD grade and group",c:"#1D4E5F"},{id:"bode",name:"BODE index",c:"#3E6EA8"},{id:"decaf",name:"DECAF",c:"#9E2B3A"},{id:"curb",name:"CURB-65",c:"#B5552B"},{id:"pack",name:"Pack-years",c:"#8E6C3E"},{id:"wells",name:"Wells (PE)",c:"#6D5BA8"},{id:"spesi",name:"sPESI",c:"#9E2B3A"},{id:"bmi",name:"BMI",c:"#4E8F5E"}];
const CDEF={gold:{fev1:"",ratio:"",mmrc:"0",cat:"",mod:"0",hosp:"0",eos:""},bode:{fev1:"",walk:"",mmrc:"0",ht:"",wt:""},decaf:{d:"0",eos:false,cons:false,acid:false,af:false},curb:{c:false,u:false,r:false,b:false,a:false},pack:{cig:"",yrs:""},wells:{dvt:false,alt:false,hr:false,imm:false,prev:false,haem:false,ca:false},spesi:{age:false,ca:false,cp:false,hr:false,sbp:false,sat:false},bmi:{ht:"",wt:""}};
S.calc="gold";S.cv=JSON.parse(JSON.stringify(CDEF));
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:NaN};
const f1=x=>(Math.round(x*10)/10).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1});
const R=(cls,big,lines)=>`<div class="res ${cls}"><div class="big">${big}</div>${lines.map(l=>`<p>${l}</p>`).join("")}</div>`;
const need=t=>`<div class="res"><p>${t}</p></div>`;
function inp(id,label,ph,full){return `<label${full?' class="full"':""}>${label}<input type="number" inputmode="decimal" data-cv="${id}" value="${esc(S.cv[S.calc][id])}" placeholder="${ph||""}"></label>`}
function sel(id,label,opts,full){return `<label${full?' class="full"':""}>${label}<select data-cv="${id}">${opts.map(([v,t])=>`<option value="${v}" ${String(S.cv[S.calc][id])===String(v)?"selected":""}>${t}</option>`).join("")}</select></label>`}
function ck(id,label,pts){return `<label class="ck full"><input type="checkbox" data-cv="${id}" ${S.cv[S.calc][id]?"checked":""}>${label}${pts!=null?`<span class="pts">${pts}</span>`:""}</label>`}
const MMRC=[["0","0: breathless only with strenuous exercise"],["1","1: when hurrying or walking up a slight hill"],["2","2: walks slower than others, or stops for breath on the level"],["3","3: stops for breath after about 100 m or a few minutes"],["4","4: too breathless to leave the house, or when dressing"]];
function calcForm(id){
 switch(id){
 case "gold":return `<p class="help">Spirometric grade and GOLD ABE group, with the initial treatment suggested by the GOLD report.</p><div class="fg">
  ${inp("fev1","Post-bronchodilator FEV1 (% predicted)","55")}${inp("ratio","FEV1/FVC ratio","0.62")}
  ${sel("mmrc","mMRC breathlessness",MMRC,true)}${inp("cat","CAT score (0 to 40)","optional")}${inp("eos","Blood eosinophils (cells/µL)","optional")}
  ${sel("mod","Moderate exacerbations in past year",[["0","0"],["1","1"],["2","2 or more"]])}${sel("hosp","Exacerbations needing hospital",[["0","0"],["1","1 or more"]])}</div>`;
 case "bode":return `<div class="fg">${inp("fev1","FEV1 (% predicted)","45")}${inp("walk","6-minute walk (m)","300")}${sel("mmrc","mMRC breathlessness",MMRC,true)}${inp("ht","Height (cm)","165")}${inp("wt","Weight (kg)","60")}</div>`;
 case "decaf":return `<p class="help">Predicts in-hospital death in people admitted with an exacerbation of COPD.</p><div class="fg">${sel("d","Breathlessness before admission (eMRCD)",[["0","eMRCD 1 to 4 (0)"],["1","5a: housebound, independent with washing or dressing (1)"],["2","5b: housebound, needs help with washing and dressing (2)"]],true)}
  ${ck("eos","Eosinopenia (eosinophils under 0.05 × 10⁹/L)",1)}${ck("cons","Consolidation on chest X-ray",1)}${ck("acid","Acidaemia (pH under 7.30)",1)}${ck("af","Atrial fibrillation",1)}</div>`;
 case "curb":return `<div class="fg">${ck("c","Confusion (new)",1)}${ck("u","Urea over 7 mmol/L",1)}${ck("r","Respiratory rate 30 or more",1)}${ck("b","Systolic BP under 90 or diastolic 60 or less",1)}${ck("a","Age 65 or over",1)}</div>`;
 case "pack":return `<div class="fg">${inp("cig","Cigarettes per day","20")}${inp("yrs","Years smoked","30")}</div>`;
 case "wells":return `<p class="help">Two-level Wells score for pulmonary embolism, as used in NICE NG158.</p><div class="fg">${ck("dvt","Clinical signs and symptoms of DVT",3)}${ck("alt","PE is the most likely diagnosis",3)}${ck("hr","Heart rate over 100",1.5)}${ck("imm","Immobilised 3 days or more, or surgery in the past 4 weeks",1.5)}${ck("prev","Previous DVT or PE",1.5)}${ck("haem","Haemoptysis",1)}${ck("ca","Active cancer (treatment in last 6 months or palliative)",1)}</div>`;
 case "spesi":return `<p class="help">Simplified Pulmonary Embolism Severity Index, for people with confirmed PE.</p><div class="fg">${ck("age","Age over 80",1)}${ck("ca","Cancer",1)}${ck("cp","Chronic heart failure or chronic lung disease",1)}${ck("hr","Heart rate 110 or more",1)}${ck("sbp","Systolic BP under 100",1)}${ck("sat","Oxygen saturation under 90%",1)}</div>`;
 case "bmi":return `<div class="fg">${inp("ht","Height (cm)","165")}${inp("wt","Weight (kg)","60")}</div>`;
 }
 return "";
}
function calcResult(id){
 const v=S.cv[id];
 switch(id){
 case "gold":{
  const fev=num(v.fev1),ra=num(v.ratio),cat=num(v.cat),eos=num(v.eos),mm=+v.mmrc;
  const lines=[];let big="";
  if(!isNaN(fev)){const g=fev>=80?1:fev>=50?2:fev>=30?3:4;big=`GOLD ${g}`;lines.push(["Mild","Moderate","Severe","Very severe"][g-1]+` airflow obstruction (FEV1 ${Math.round(fev)}% predicted).`)}
  if(!isNaN(ra)){const r=ra>1?ra/100:ra;lines.push(r<0.7?`FEV1/FVC ${r.toFixed(2)}: obstruction confirmed (under 0.70).`:`FEV1/FVC ${r.toFixed(2)}: not under 0.70, so the GOLD spirometric criterion isn't met.`)}
  const E=(+v.mod>=2)||(+v.hosp>=1),B=mm>=2||(!isNaN(cat)&&cat>=10),grp=E?"E":B?"B":"A";
  lines.push(`Group ${grp}: ${E?"2 or more moderate exacerbations, or 1 or more leading to hospital, in the past year.":B?"mMRC 2 or more, or CAT 10 or more, with 0 to 1 moderate exacerbations.":"mMRC 0 to 1 and CAT under 10, with 0 to 1 moderate exacerbations."}`);
  lines.push(`Initial treatment: ${grp==="A"?"a bronchodilator.":grp==="B"?"LABA + LAMA.":`LABA + LAMA${!isNaN(eos)&&eos>=300?". With eosinophils 300 or more, consider LABA + LAMA + ICS.":"; consider adding ICS if blood eosinophils are 300 or more."}`}`);
  lines.push("Check against the current GOLD report, especially for follow-up treatment.");
  return R(grp==="E"?"high":grp==="B"?"mid":"low",`${big?big+", ":""}Group ${grp}`,lines);}
 case "bode":{
  const fev=num(v.fev1),w=num(v.walk),h=num(v.ht)/100,wt=num(v.wt);if([fev,w,h,wt].some(isNaN)||!h)return need("Enter FEV1, walk distance, height and weight.");
  const bmi=wt/(h*h),b=(bmi<=21?1:0),o=fev>=65?0:fev>=50?1:fev>=36?2:3,d=[0,0,1,2,3][+v.mmrc],e=w>=350?0:w>=250?1:w>=150?2:3,s=b+o+d+e;
  const q=s<=2?1:s<=4?2:s<=6?3:4;
  return R(q>=3?"high":q===2?"mid":"low",`${s}`,[`BODE quartile ${q} (BMI ${f1(bmi)}).`,"Higher scores mean higher mortality risk. Quartiles: 0 to 2, 3 to 4, 5 to 6, 7 to 10."]);}
 case "decaf":{
  const s=+v.d+(v.eos?1:0)+(v.cons?1:0)+(v.acid?1:0)+(v.af?1:0);
  return R(s>=3?"high":s===2?"mid":"low",`${s}`,[s<=1?"Low risk (0 to 1). May be suitable for early supported discharge or hospital at home.":s===2?"Intermediate risk (2).":"High risk (3 to 6). Consider escalation planning and early senior review."]);}
 case "curb":{
  const s=["c","u","r","b","a"].reduce((a,k)=>a+(v[k]?1:0),0);
  return R(s>=3?"high":s===2?"mid":"low",`${s}`,[s<=1?"Low severity: consider home treatment.":s===2?"Moderate severity: consider hospital treatment.":"High severity: hospital treatment; consider critical care assessment if 4 or 5."]);}
 case "pack":{
  const c=num(v.cig),y=num(v.yrs);if(isNaN(c)||isNaN(y))return need("Enter cigarettes per day and years smoked.");
  const p=c/20*y;return R(p>=20?"mid":"low",`${f1(p)}`,["Pack-years (cigarettes per day ÷ 20 × years)."]);}
 case "wells":{
  const s=(v.dvt?3:0)+(v.alt?3:0)+(v.hr?1.5:0)+(v.imm?1.5:0)+(v.prev?1.5:0)+(v.haem?1:0)+(v.ca?1:0);
  return R(s>4?"high":"low",`${s}`,[s>4?"PE likely (more than 4 points): offer CTPA, or interim anticoagulation if there will be a delay.":"PE unlikely (4 points or fewer): do a D-dimer; if positive, offer CTPA."]);}
 case "spesi":{
  const s=["age","ca","cp","hr","sbp","sat"].reduce((a,k)=>a+(v[k]?1:0),0);
  return R(s?"high":"low",`${s}`,[s?"Not low risk (30-day mortality around 11% in the derivation study). Usually treat in hospital.":"Low risk (30-day mortality around 1%). Consider outpatient treatment if there are no other concerns."]);}
 case "bmi":{
  const h=num(v.ht)/100,w=num(v.wt);if(isNaN(h)||isNaN(w)||!h)return need("Enter height and weight.");
  const b=w/(h*h);return R(b<18.5||b>=30?"high":b>=25?"mid":"low",f1(b),[b<18.5?"Underweight: in COPD, low BMI is linked to worse outcomes; consider nutritional support.":b<21?"BMI 21 or under adds a point to the BODE index.":b<25?"Healthy weight.":b<30?"Overweight.":"Obesity."]);}
 }
 return "";
}
function vScores(){
 const c=CALCS.find(x=>x.id===S.calc);
 return `<div class="row" style="flex-wrap:wrap;overflow:visible">${CALCS.map(x=>`<button class="chip cat ${S.calc===x.id?"on":""}" style="--cc:${x.c}" data-act="calc" data-v="${x.id}">${x.name}</button>`).join("")}</div>
 <div class="calc" style="--cc:${c.c};margin-top:10px"><h3>${c.name}</h3>${calcForm(c.id)}<div id="cres">${calcResult(c.id)}</div>
 <button class="link" style="margin-top:8px" data-act="creset">Clear</button></div>
 <p class="note">Calculated on your phone; nothing is sent anywhere. For clinical decisions, check results against the source guideline.</p>`;
}

function popEl(el){if(!el)return;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");setTimeout(()=>el.classList.remove("pop"),550)}
document.addEventListener("pointerdown",e=>{const el=e.target.closest(POPSEL);if(!el)return;

// ---------- full-text access routes ----------
const FTMODES=[["direct","Publisher website"],["libkey","LibKey (choose your library once)"],["ezp","University library link (EZproxy)"],["oa","OpenAthens (NHS or university)"]];
function ftURL(doi){
 const ft=st.ft||{},d=`https://doi.org/${doi}`;
 if(ft.mode==="libkey")return `https://libkey.io/${doi}`;
 if(ft.mode==="ezp"&&ft.ezp)return ft.ezp.trim()+d;
 if(ft.mode==="oa"&&ft.oa)return ft.oa.trim()+encodeURIComponent(d);
 return d;
}
async function openFullText(doi){
 const ft=st.ft||{};
 if(!(ft.unpay&&ft.email)){window.open(ftURL(doi),"_blank");return}
 const w=window.open("about:blank","_blank");
 let url=ftURL(doi);
 try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),4000);
  const r=await fetch(`https://api.unpaywall.org/v2/${encodeURIComponent(doi)}?email=${encodeURIComponent(ft.email)}`,{signal:ctl.signal});clearTimeout(tm);
  if(r.ok){const j=await r.json(),b=j.best_oa_location;if(j.is_oa&&b&&(b.url_for_pdf||b.url)){url=b.url_for_pdf||b.url;toast("Opening a free legal copy")}}}catch(e){}
 if(w&&!w.closed)w.location.href=url;else window.open(url,"_blank");
}
// ---------- full text (open access only) via Europe PMC ----------
const EPMC="https://www.ebi.ac.uk/europepmc/webservices/rest/";
async function oaInfo(pmid){
 const r=await fetch(`${EPMC}search?query=EXT_ID:${pmid}%20AND%20SRC:MED&resultType=core&format=json`);
 const j=await r.json(),x=(j.resultList&&j.resultList.result||[])[0]||{};
 return{pmcid:x.pmcid||"",oa:x.isOpenAccess==="Y"||x.inEPMC==="Y"&&!!x.license,license:(x.license||"").toUpperCase()};
}
async function blobToData(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}
async function imgSize(src){return new Promise(res=>{const i=new Image();i.onload=()=>res({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>res({w:4,h:3});i.src=src})}
async function oaFigures(pmcid,max){
 const r=await fetch(`${EPMC}${pmcid}/fullTextXML`);if(!r.ok)return[];
 const x=new DOMParser().parseFromString((await r.text()).replace(/<!DOCTYPE[^>]*>/i,""),"text/xml"),out=[];
 for(const f of [...x.getElementsByTagName("fig")].slice(0,max)){
  const label=(f.getElementsByTagName("label")[0]||{}).textContent||"Figure";
  const cap=((f.getElementsByTagName("caption")[0]||{}).textContent||"").replace(/\s+/g," ").trim();
  const g=f.getElementsByTagName("graphic")[0],href=g?(g.getAttribute("xlink:href")||g.getAttributeNS("http://www.w3.org/1999/xlink","href")||""):"";
  let data=null;
  if(href){const base=href.replace(/\.(jpe?g|png|gif|tif)$/i,"");
   for(const u of [`https://europepmc.org/articles/${pmcid}/bin/${base}.jpg`,`https://www.ncbi.nlm.nih.gov/pmc/articles/${pmcid}/bin/${base}.jpg`]){
    try{const ir=await fetch(u);if(ir.ok&&/image/.test(ir.headers.get("content-type")||"image")){data=await blobToData(await ir.blob());break}}catch(e){}
   }}
  out.push({label:label.trim(),cap,data,link:`https://europepmc.org/article/PMC/${pmcid.replace(/^PMC/,"")}`});
 }
 return out;
}
// ---------- chart slides typed in by the user ----------
const nums=s=>String(s).split(/[,\t;]+/).map(x=>x.trim());
function parseRows(txt,need){return String(txt||"").split(/\n+/).map(l=>nums(l)).filter(a=>a.length>=need&&a[0]&&!isNaN(parseFloat(a[1])))}
function addChartSlide(pptx,ch,short,NAVY,ACC,GREY,FONT){
 const s=pptx.addSlide();s.background={color:"FFFFFF"};
 s.addShape(pptx.ShapeType.rect,{x:0,y:0,w:0.18,h:7.5,fill:{color:ACC}});
 s.addText(ch.title||"Results",{x:0.6,y:0.35,w:12.1,h:0.9,fontFace:FONT,fontSize:28,bold:true,color:NAVY,fit:"shrink"});
 if(ch.type==="bar"){
  const rows=parseRows(ch.data,2),two=rows.some(r=>r.length>=3&&!isNaN(parseFloat(r[2])));
  const series=[{name:ch.s1||"Group 1",labels:rows.map(r=>r[0]),values:rows.map(r=>parseFloat(r[1]))}];
  if(two)series.push({name:ch.s2||"Group 2",labels:rows.map(r=>r[0]),values:rows.map(r=>parseFloat(r[2])||0)});
  s.addChart(pptx.ChartType.bar,series,{x:0.7,y:1.4,w:11.9,h:5.2,barDir:"col",barGrouping:"clustered",chartColors:["2E3A6B","C0504D"],showLegend:two,legendPos:"b",showValue:true,dataLabelFontSize:12,catAxisLabelFontSize:13,valAxisLabelFontSize:12,valAxisTitle:ch.unit||"",showValAxisTitle:!!ch.unit,dataLabelFormatCode:"General"});
 }else{
  const rows=parseRows(ch.data,4).map(r=>({l:r[0],e:parseFloat(r[1]),lo:parseFloat(r[2]),hi:parseFloat(r[3])})).filter(r=>r.e>0&&r.lo>0&&r.hi>0);
  if(rows.length){
   const lg=Math.log10,mn=Math.min(...rows.map(r=>r.lo),1),mx=Math.max(...rows.map(r=>r.hi),1);
   const a=lg(mn)-0.05,b=lg(mx)+0.05,X0=5.0,W=5.2,px=v=>X0+(lg(v)-a)/(b-a)*W,top=1.6,rowH=Math.min(0.6,4.4/rows.length);
   s.addText("Hazard ratio (95% CI)",{x:10.4,y:top-0.55,w:2.6,h:0.4,fontFace:FONT,fontSize:12,bold:true,color:GREY,align:"left"});
   rows.forEach((r,i)=>{const y=top+i*rowH+rowH/2;
    s.addText(r.l,{x:0.6,y:y-rowH/2,w:4.3,h:rowH,fontFace:FONT,fontSize:rows.length>8?11:14,color:"222222",valign:"middle",fit:"shrink"});
    s.addShape(pptx.ShapeType.line,{x:px(r.lo),y,w:Math.max(0.01,px(r.hi)-px(r.lo)),h:0,line:{color:"2E3A6B",width:1.75}});
    const sz=0.14;s.addShape(pptx.ShapeType.rect,{x:px(r.e)-sz/2,y:y-sz/2,w:sz,h:sz,fill:{color:"2E3A6B"},line:{color:"2E3A6B"}});
    s.addText(`${r.e.toFixed(2)} (${r.lo.toFixed(2)}–${r.hi.toFixed(2)})`,{x:10.4,y:y-rowH/2,w:2.6,h:rowH,fontFace:FONT,fontSize:rows.length>8?11:13,color:"222222",valign:"middle"});
   });
   const yb=top+rows.length*rowH;
   s.addShape(pptx.ShapeType.line,{x:px(1),y:top-0.1,w:0,h:rows.length*rowH+0.2,line:{color:"888888",width:1,dashType:"dash"}});
   s.addShape(pptx.ShapeType.line,{x:X0,y:yb+0.15,w:W,h:0,line:{color:"888888",width:1}});
   const ticks=[0.1,0.2,0.25,0.5,0.75,1,1.5,2,3,4,5,10].filter(t=>lg(t)>=a&&lg(t)<=b);
   for(const t of ticks)s.addText(String(t),{x:px(t)-0.35,y:yb+0.2,w:0.7,h:0.3,fontFace:FONT,fontSize:11,color:GREY,align:"center"});
   if(ch.s1||ch.s2){s.addText(`← Favours ${ch.s1||"treatment"}`,{x:X0,y:yb+0.55,w:W/2,h:0.35,fontFace:FONT,fontSize:12,color:GREY,align:"left"});s.addText(`Favours ${ch.s2||"control"} →`,{x:X0+W/2,y:yb+0.55,w:W/2,h:0.35,fontFace:FONT,fontSize:12,color:GREY,align:"right"})}
  }else s.addText("No valid rows. Use: label, hazard ratio, lower CI, upper CI",{x:0.7,y:2,w:11.9,h:1,fontFace:FONT,fontSize:16,color:GREY});
 }
 s.addText(`Redrawn from ${short}`,{x:0.7,y:6.9,w:11.9,h:0.35,fontFace:FONT,fontSize:11,color:GREY});
}

function pdfSections(t){

async function slideShare(){

// spoken punctuation and commonly misheard medical words
const DICTFIX=[[/\b(full stop|period)\b/gi,"."],[/\bcomma\b/gi,","],[/\bquestion mark\b/gi,"?"],[/\bcolon\b/gi,":"],[/\bsemi-?colon\b/gi,";"],[/\b(new paragraph|new line|next line)\b/gi,"\n"],
 [/\bc\.? ?o\.? ?p\.? ?d\b|\bco pd\b|\bcopd\b/gi,"COPD"],[/\ba[ -]?fib\b|\bafib\b/gi,"AF"],[/\be\.? ?c\.? ?g\b|\becg\b/gi,"ECG"],[/\becho cardiogram/gi,"echocardiogram"],[/\btrope? ?on[ie]n\b/gi,"troponin"],
 [/\bn ?t ?pro ?b ?n ?p\b/gi,"NT-proBNP"],[/\bs ?g ?l ?t ?(2|two)\b/gi,"SGLT2"],[/\bh ?f ?r ?e ?f\b|\bheff? ?ref\b/gi,"HFrEF"],[/\bh ?f ?p ?e ?f\b|\bheff? ?peff?\b/gi,"HFpEF"],[/\btavvy\b|\btabby\b|\bt ?a ?v ?i\b/gi,"TAVI"],
 [/\bp ?c ?i\b/gi,"PCI"],[/\bc ?t ?c ?a\b/gi,"CTCA"],[/\bc ?m ?r\b/gi,"CMR"],[/\bd ?o ?a ?c\b|\bdoac\b/gi,"DOAC"],[/\bf ?e ?v ?(1|one)\b/gi,"FEV1"],[/\bf ?v ?c\b/gi,"FVC"],[/\bi ?l ?d\b/gi,"ILD"],[/\bi ?p ?f\b/gi,"IPF"],
 [/\bc ?pap\b|\bsee pap\b/gi,"CPAP"],[/\bn ?i ?v\b/gi,"NIV"],[/\be ?s ?c\b(?= guideline)/gi,"ESC"],[/\bnice\b(?= guideline)/gi,"NICE"],[/\bb ?t ?s\b/gi,"BTS"],[/\bmi\b/g,"MI"],[/\bgp\b/gi,"GP"],[/\bnhs\b/gi,"NHS"]];
function fixDictation(t){
 let x=String(t);for(const[re,v]of DICTFIX)x=x.replace(re,v);
 x=x.replace(/[ \t]+([.,;:?!])/g,"$1").replace(/([.,;:?!])(?=[A-Za-z])/g,"$1 ").replace(/[ \t]*\n[ \t]*/g,"\n").replace(/[ \t]{2,}/g," ");
 x=x.replace(/(^|[.?!]\s+|\n)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
 return x.replace(/\bi\b/g,"I");
}

function dictStop(){if(dict){try{clearTimeout(dict._max);dict.stop()}catch(e){}dict=null}document.querySelectorAll(".mic").forEach(b=>b.classList.remove("on"))}

 const r=new SRec();r.lang="en-GB";r.continuous=true;r.interimResults=true;r._id=id;
 const base=ta.value?ta.value.replace(/\s*$/," "):"";let heard="",pend=0;

  // some phones resend everything heard so far with each update, so build the text afresh and drop repeats
  const parts=[];
  for(let i=0;i<e.results.length;i++){const t=String((e.results[i][0]||{}).transcript||"").trim();if(!t)continue;const p=parts[parts.length-1],tl=t.toLowerCase(),pl=p?p.toLowerCase():"";
   if(p&&tl.startsWith(pl))parts[parts.length-1]=t;else if(p&&pl.startsWith(tl))continue;else parts.push(t)}
  heard=parts.join(" ").slice(0,5000);if(!pend)pend=requestAnimationFrame(apply)}catch(x){}};

function cvSet(el){

}
