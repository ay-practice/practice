insert('t4a',1,{t:'Collision lab',sim:['collisions'],h:`<p>Each red dot is an acid particle. Watch how many hit the magnesium <b>with enough energy</b> to react (yellow flashes).</p><ol><li>Raise the temperature. What happens to the count?</li><li>Raise the concentration.</li><li>Add a catalyst.</li></ol>`});
enrich('t4a',2,{fun:`Flour mills and custard factories have to control dust: a cloud of fine powder has so much surface area that one spark can cause an explosion.`});
enrich('t4a',3,{w:{type:'quiz',q:'Milk turns sour in a few days on a warm worktop but lasts much longer in the fridge. Why?',o:['The fridge kills all bacteria','Lower temperature means fewer successful collisions','Cold milk has a higher concentration','The fridge acts as a catalyst'],a:1}});
enrich('t4a',0,{w:{type:'cards',items:[['Temperature ↑','Particles faster: more collisions, more of them energetic enough'],['Concentration ↑','More particles in the same space: more collisions'],['Particle size ↓','More surface area exposed: more collisions'],['Catalyst','Speeds up the reaction; recovered chemically unchanged']]}});
insert('t4b',3,{t:'Reactions slow down as they go',d:['rateGraph',[{v:80,k:0.0347,c:PAL.u4}],[20,40]],
  h:`<p>Calculate the average rate at different stages and you'll see it falls, because reactants are being used up.</p>`,

enrich('t4b',3,{w:{type:'quiz',q:'The same reaction is repeated at a higher temperature with exactly the same amounts. The new curve is:',o:['steeper, same final volume','steeper, more gas','less steep, same final volume','the same'],a:0}});
enrich('t4c',0,{fun:`"Elephant toothpaste": hydrogen peroxide breaks down very slowly on its own, but add a catalyst and washing-up liquid and a huge column of foam shoots out in seconds.`});

/* ---------- Chapter 5 ---------- */
enrich('t5a',0,{fun:`The pH scale can go below 0 and above 14 for very concentrated acids and alkalis. Some mine water is around pH −3.`});
enrich('t5a',1,{h:`<p>Water contains a tiny number of H<sup>+</sup> and OH<sup>−</sup> ions, in equal amounts:</p><p style="font-weight:800">H<sub>2</sub>O(ℓ) ⇌ H<sup>+</sup>(aq) + OH<sup>−</sup>(aq)</p><p>The ⇌ arrow means the reaction is <b>reversible</b>: it goes both ways. At any moment only a few water molecules are split.</p><ul><li>Acids have more H<sup>+</sup> than OH<sup>−</sup>.</li><li>Alkalis have more OH<sup>−</sup> than H<sup>+</sup>.</li></ul>`});
insert('t5a',3,{t:'Dilution lab',sim:['phDilute'],h:`<p>Add water and watch the indicator colour and pH. Then switch to an alkali and try again.</p>`});
enrich('t5a',3,{h:`<ul><li><b>Soluble non-metal oxides</b> make <b>acids</b>: CO<sub>2</sub> in fizzy drinks, SO<sub>2</sub> and NO<sub>2</sub> in acid rain.</li><li><b>Soluble metal oxides</b> make <b>alkalis</b>: metal oxide + water → metal hydroxide. Sodium oxide + water → sodium hydroxide.</li></ul>`,
  w:{type:'sort',title:'Acidic or alkaline when dissolved?',cats:['Acidic','Alkaline'],items:[['Carbon dioxide',0],['Sodium oxide',1],['Sulfur dioxide',0],['Potassium oxide',1],['Nitrogen dioxide',0],['Lithium oxide',1]]}});
enrich('t5b',1,{h:`<p>A <b>base</b> is anything that neutralises an acid: metal oxides, metal hydroxides, metal carbonates and ammonia. A base that dissolves in water is an <b>alkali</b>.</p><ul><li>acid + metal hydroxide → salt + water</li><li>acid + metal oxide → salt + water</li><li>acid + metal carbonate → salt + water + carbon dioxide</li></ul>`,
  fun:`Leave a chicken bone in vinegar for a few days and it goes bendy: the acid reacts with the calcium carbonate that makes bone hard.`});
enrich('t5b',2,{w:{type:'quiz',q:'Sulfuric acid reacts with copper(II) oxide. Name the salt.',o:['Copper chloride','Copper(II) sulfate','Copper nitrate','Copper sulfide'],a:1}});
insert('t5b',4,{t:'Ionic equations for every base',h:`<p>Leave out the spectator ions and each type of base gives its own short equation:</p><table class="t"><tr><th>Base</th><th>Ionic equation</th></tr><tr><td>Hydroxide</td><td>H<sup>+</sup>(aq) + OH<sup>−</sup>(aq) → H<sub>2</sub>O(ℓ)</td></tr><tr><td>Oxide</td><td>2H<sup>+</sup>(aq) + O<sup>2−</sup>(s) → H<sub>2</sub>O(ℓ)</td></tr><tr><td>Carbonate</td><td>2H<sup>+</sup>(aq) + CO<sub>3</sub><sup>2−</sup> → H<sub>2</sub>O(ℓ) + CO<sub>2</sub>(g)</td></tr></table>`,
  ex:`The carbonate is (aq) if it dissolves, such as sodium carbonate, and (s) if it doesn't, such as calcium carbonate.`,
  w:{type:'quiz',q:'Which ions are spectators when hydrochloric acid reacts with potassium hydroxide?',o:['H⁺ and OH⁻','K⁺ and Cl⁻','K⁺ and OH⁻','H⁺ and Cl⁻'],a:1}});
enrich('t5c',1,{w:{type:'steps',title:'Doing a titration, step by step',steps:['Use a pipette with a safety filler to put exactly 25.0 cm³ of acid in a conical flask.','Add a few drops of indicator. Stand the flask on a white tile.','Fill the burette with alkali and read the start volume at the bottom of the meniscus.','Add alkali, swirling, then drop by drop near the end-point until the colour just changes.','Read the end volume. Titre = end − start.','Repeat until two titres are within 0.2 cm³ (concordant).']}});
insert('t5c',4,{t:'Finding a volume instead',h:`<p>The same method works backwards: if you know both concentrations, you can work out the volume needed.</p>`,
  w:{type:'steps',title:'What volume of 0.20 mol l⁻¹ NaOH neutralises 25.0 cm³ of 0.10 mol l⁻¹ HCl?',steps:['n(HCl) = 0.10 × 0.0250 = 0.0025 mol','HCl + NaOH → NaCl + H<sub>2</sub>O, ratio 1 : 1, so n(NaOH) = 0.0025 mol','V = n ÷ c = 0.0025 ÷ 0.20 = 0.0125 l','= <b>12.5 cm³</b>']}});
CH5.topics.push({id:'t5d',name:'Making salts',slides:[
 {t:'Three ways to make a soluble salt',h:`<table class="t"><tr><th>Start with</th><th>Method</th></tr><tr><td>An alkali (soluble base)</td><td>Titration, then repeat without indicator</td></tr><tr><td>An insoluble oxide or carbonate</td><td>Add excess to acid, filter, evaporate</td></tr><tr><td>A metal</td><td>Add excess metal to acid, filter, evaporate</td></tr></table>`,
  w:{type:'sort',title:'Which method?',cats:['Titration','Excess and filter'],items:[['Sodium hydroxide + acid',0],['Copper(II) oxide + acid',1],['Potassium hydroxide + acid',0],['Calcium carbonate + acid',1],['Zinc metal + acid',1]]}},
 {t:'Method 1: titration',h:`<ol><li>Titrate to find exactly how much alkali neutralises the acid.</li><li>Repeat with the same volumes but <b>no indicator</b>, so the salt isn't contaminated.</li><li>Evaporate the water to leave the salt.</li></ol>`,
  ex:`Hydrochloric acid + sodium hydroxide → sodium chloride + water. Evaporate and you get pure salt crystals.`},
 {t:'Method 2: excess insoluble base',d:['filter'],
  h:`<ol><li>Add the insoluble base (or metal) to the acid until no more reacts. The <b>excess</b> guarantees all the acid is used up.</li><li><b>Filter</b> off the leftover solid.</li><li><b>Evaporate</b> the filtrate to get the salt.</li></ol>`,
  ex:`Black copper(II) oxide + sulfuric acid → blue copper(II) sulfate solution. Filter off the extra black powder, then evaporate to grow blue crystals.`,
  k:`Excess base, filter, evaporate. The excess is there so no acid is left.`},
 {t:'Why not just any method?',h:`<p>You can't see the end-point when the base is insoluble: excess solid simply stays undissolved. And you can't filter off excess alkali because it dissolves. So the base decides the method.</p>`,
  w:{type:'quiz',q:'Why is excess copper(II) carbonate added to the acid?',o:['To make the reaction faster','To make sure all the acid reacts','To lower the temperature','To act as an indicator'],a:1}}
]});

/* ===== Extra diagram: boiling point bars ===== */
DIAGRAMS.bpBars=(data,cap)=>{const vals=data.map(d=>d[1]),mn=Math.min(0,...vals),mx=Math.max(...vals),L=40,B=170,T=30,R=330,Y=v=>T+(mx-v)*(B-T)/(mx-mn),bw=(R-L)/data.length;let s=`<line x1="${L}" x2="${R}" y1="${Y(0)}" y2="${Y(0)}" stroke="${PAL.ink}" stroke-width="1.5"/>`;
  data.forEach(([l,v],i)=>{const x=L+i*bw+4,y=Math.min(Y(v),Y(0)),h=Math.abs(Y(v)-Y(0));s+=`<rect x="${x}" y="${y}" width="${bw-8}" height="${h}" rx="3" fill="${v<20?PAL.u4:PAL.u1}">${AN(`<animate attributeName="height" from="0" to="${h}" dur="1s" fill="freeze"/>`)}</rect>`+TX(x+(bw-8)/2,v<0?(h>18?y+h-5:y+h+12):y-4,v,`text-anchor="middle" font-size="10" font-weight="800" fill="${v<0&&h>18?'#fff':PAL.ink}"`)+TX(x+(bw-8)/2,B+16,l,'text-anchor="middle" font-size="10"');});
  s+=TX(180,B+34,cap||'Boiling point (°C)','text-anchor="middle" font-weight="700"')+(mn<0?TX(L,12,'blue = gas at room temperature (below 20 °C)','font-size="10" font-weight="700" fill="'+PAL.u4+'"'):'');
  return SVG(340,B+42,s,cap||'Boiling points');};

/* ===== Chapter 6: Hydrocarbons ===== */
const CH6={id:'c6',num:6,area:1,sym:'Hc',name:'Hydrocarbons',
blurb:`Carbon's big families: alkanes, cycloalkanes and alkenes. Naming them, drawing them, telling them apart and reacting them.`,
topics:[
{id:'t6a',name:'Homologous series and alkanes',slides:[
 {t:'Families of compounds',h:`<p>Carbon can form millions of compounds, so chemists sort them into families called <b>homologous series</b>. Members of a series have:</p><ul><li>the same <b>general formula</b></li><li>similar <b>chemical properties</b></li><li>a steady pattern in <b>physical properties</b> like boiling point</li></ul><p><b>Hydrocarbons</b> are compounds of hydrogen and carbon only.</p>`,
  w:{type:'cards',items:[['Homologous series','Family with the same general formula and similar chemical properties'],['Hydrocarbon','Contains hydrogen and carbon only'],['Saturated','Only single C–C bonds'],['Unsaturated','At least one C=C double bond']]}},
 {t:'Meet the alkanes',d:['struct','ane',3,{},'Propane, C₃H₈'],
  h:`<table class="t"><tr><th>C</th><th>Name</th><th>Formula</th><th>C</th><th>Name</th><th>Formula</th></tr><tr><td>1</td><td>methane</td><td>CH<sub>4</sub></td><td>5</td><td>pentane</td><td>C<sub>5</sub>H<sub>12</sub></td></tr><tr><td>2</td><td>ethane</td><td>C<sub>2</sub>H<sub>6</sub></td><td>6</td><td>hexane</td><td>C<sub>6</sub>H<sub>14</sub></td></tr><tr><td>3</td><td>propane</td><td>C<sub>3</sub>H<sub>8</sub></td><td>7</td><td>heptane</td><td>C<sub>7</sub>H<sub>16</sub></td></tr><tr><td>4</td><td>butane</td><td>C<sub>4</sub>H<sub>10</sub></td><td>8</td><td>octane</td><td>C<sub>8</sub>H<sub>18</sub></td></tr></table><p>General formula <b>C<sub>n</sub>H<sub>2n+2</sub></b>. All end in <b>-ane</b>.</p>`,
  ex:`Memory hook for 1–4: <b>M</b>onkeys <b>E</b>at <b>P</b>eanut <b>B</b>utter. From 5 on, think shapes and sport: pentagon, hexagon, heptathlon, octopus.`},
 {t:'Molecule builder',sim:['molecule','ane'],h:`<p>Slide the carbon count and switch between families. Notice how each extra carbon adds CH<sub>2</sub>.</p>`},
 {t:'Full and shortened structural formulae',d:['struct','ane',4,{},'Butane: full structural formula'],
  h:`<p>A <b>full structural formula</b> shows every atom and bond. A <b>shortened</b> one groups atoms on each carbon.</p>`,
  ex:`Butane shortened: CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub>, or even CH<sub>3</sub>(CH<sub>2</sub>)<sub>2</sub>CH<sub>3</sub>`,
  w:{type:'quiz',q:'Which alkane has the shortened formula CH₃CH₂CH₂CH₂CH₃?',o:['Butane','Pentane','Hexane','Propane'],a:1,x:'Count the carbons: 5, so pentane.'}},
 {t:'Patterns and uses',d:['bpBars',[['C1',-162],['C2',-89],['C3',-42],['C4',-1],['C5',36],['C6',69],['C7',98],['C8',126]],'Alkane boiling points (°C)'],
  h:`<p>Boiling points rise as the molecules get bigger, because the <b>forces between molecules get stronger</b> as molecular size increases.</p><ul><li>Alkanes are used as <b>fuels</b>.</li><li>They are <b>insoluble in water</b>.</li></ul>`,
  ex:`Methane is natural gas for cookers. Propane and butane are camping and patio-heater gas. Octane is in petrol.`,
  fun:`Natural gas has no smell. Gas companies add a smelly sulfur compound so leaks are easy to notice.`}
]},
{id:'t6b',name:'Naming branched alkanes and cycloalkanes',slides:[
 {t:'Naming a branched alkane',w:{type:'steps',title:'Four steps',steps:['Find the <b>longest continuous chain</b> of carbons. That gives the main name (e.g. butane).','<b>Number</b> the chain from the end nearest a branch.','Name the branches: CH<sub>3</sub> is <b>methyl</b>, C<sub>2</sub>H<sub>5</sub> is <b>ethyl</b>.','Put it together: position-branch + main name, e.g. 2-methylbutane. Two of the same branch: di (2,3-dimethyl…).']},
  k:`The longest chain isn't always drawn in a straight line. Trace it with your finger.`},
 {t:'Example: 2-methylbutane',d:['struct','ane',4,{1:{d:'CH₃'}},'2-methylbutane, C₅H₁₂'],
  h:`<ul><li>Longest chain: 4 carbons → butane.</li><li>Branch: CH<sub>3</sub> → methyl.</li><li>Number from the end nearest the branch: it's on carbon 2.</li></ul>`,
  ex:`Not "3-methylbutane": numbering from the right would give 3, but you must use the lower number.`},
 {t:'Two branches',d:['struct','ane',5,{1:{d:'CH₃'},2:{d:'CH₃'}},'2,3-dimethylpentane'],
  h:`<p>Each branch gets its own number, separated by commas. Numbers and words are joined with a hyphen.</p>`,
  w:{type:'quiz',q:'A 6-carbon main chain has a methyl group on carbon 3. Name it.',o:['3-methylhexane','3-methylpentane','methylhexane','4-methylhexane'],a:0}},
 {t:'Drawing from a name',d:['struct','ane',3,{1:{u:'CH₃',d:'CH₃'}},'2,2-dimethylpropane'],
  w:{type:'steps',title:'Draw 2,2-dimethylpropane',steps:['"propane": draw a chain of 3 carbons.','"2,2-dimethyl": put two CH<sub>3</sub> groups on carbon 2.','Fill every carbon up to 4 bonds with H.','Count: 5 carbons, 12 hydrogens, so C<sub>5</sub>H<sub>12</sub>.']}},
 {t:'Cycloalkanes',d:['struct','cyc',6,null,'Cyclohexane, C₆H₁₂'],
  h:`<ul><li>Carbon atoms joined in a <b>ring</b>, all single bonds: <b>saturated</b>.</li><li>General formula <b>C<sub>n</sub>H<sub>2n</sub></b> (two fewer H than the alkane, because closing the ring uses two bonds).</li><li>Named cyclo + alkane name: cyclopropane (C3) up to cyclooctane (C8).</li><li>Used as fuels and solvents; insoluble in water.</li></ul>`,
  fun:`Cyclohexane is a starting material for making nylon, used in tights, ropes and toothbrush bristles.`,
  w:{type:'quiz',q:'What is the molecular formula of cyclopentane?',o:['C₅H₁₂','C₅H₁₀','C₅H₈','C₆H₁₂'],a:1}}
]},
{id:'t6c',name:'Alkenes and addition reactions',slides:[
 {t:'Meet the alkenes',d:['struct','ene',3,{},'Propene, C₃H₆'],
  h:`<ul><li>Contain the <b>C=C double bond</b>, their functional group.</li><li><b>Unsaturated</b> hydrocarbons, general formula <b>C<sub>n</sub>H<sub>2n</sub></b>.</li><li>Names end in <b>-ene</b>: ethene, propene, but-1-ene…</li><li>Used to make <b>polymers</b> (plastics) and <b>alcohols</b>. Insoluble in water.</li></ul>`,
  fun:`Ethene is a plant hormone. A ripe banana gives it off, which is why it makes other fruit in the bowl ripen faster.`},
 {t:'Naming: where is the double bond?',d:['pair',['struct','ene',4,{},'but-1-ene'],['struct','ene',4,{},'but-2-ene',1]],
  h:`<p>From four carbons on, the double bond could be in different places. Number from the end that gives it the <b>lowest number</b>, and put that number before -ene.</p>`,
  w:{type:'quiz',q:'A 5-carbon chain has the double bond between carbons 2 and 3. Name it.',o:['pent-3-ene','pent-2-ene','pentene','pent-2,3-ene'],a:1}},
 {t:'The bromine test',d:['bromine'],
  h:`<p>Add orange bromine solution:</p><ul><li><b>Unsaturated</b> (alkenes): <b>decolourises quickly</b>.</li><li><b>Saturated</b> (alkanes, cycloalkanes): stays orange.</li></ul>`,
  k:`Bromine decolourising quickly = C=C double bond present.`},
 {t:'Addition reactions',d:['pair',['struct','ene',2,{},'ethene'],['struct','ane',2,{0:{u:'Br'},1:{u:'Br'}},'1,2-dibromoethane'],'+ Br₂ →'],
  h:`<p>The double bond opens and atoms <b>add</b> on, one to each carbon. The product is saturated.</p>`,
  w:{type:'cards',items:[['+ hydrogen','Hydrogenation: alkene → alkane'],['+ halogen (Br₂, Cl₂)','Makes a dihaloalkane (this is the bromine test)'],['+ water','Hydration: alkene → alcohol'],['Why "addition"?','Two molecules join to make one, nothing else is made']]}},
 {t:'Writing addition equations',ex:`ethene + hydrogen → ethane<br>C<sub>2</sub>H<sub>4</sub> + H<sub>2</sub> → C<sub>2</sub>H<sub>6</sub><br><br>ethene + water → ethanol<br>C<sub>2</sub>H<sub>4</sub> + H<sub>2</sub>O → C<sub>2</sub>H<sub>5</sub>OH<br><br>propene + bromine → 1,2-dibromopropane<br>C<sub>3</sub>H<sub>6</sub> + Br<sub>2</sub> → C<sub>3</sub>H<sub>6</sub>Br<sub>2</sub>`,
  d:['pair',['struct','ene',2,{},'ethene'],['struct','ane',2,{1:{d:'OH'}},'ethanol'],'+ H₂O →'],
  w:{type:'quiz',q:'Hydrogen is added to but-2-ene. What forms?',o:['Butane','But-1-ene','Butan-2-ol','2-methylpropane'],a:0}}
]},
{id:'t6d',name:'Isomers',slides:[
 {t:'Same atoms, different arrangement',d:['pair',['struct','ane',4,{},'butane'],['struct','ane',3,{1:{d:'CH₃'}},'2-methylpropane']],
  h:`<p><b>Isomers</b> have the <b>same molecular formula</b> but <b>different structural formulae</b>. They usually have different physical properties.</p>`,
  ex:`Both are C<sub>4</sub>H<sub>10</sub>. Butane boils at −1 °C; 2-methylpropane boils at −12 °C. Same Lego bricks, different model.`},
 {t:'Isomers in different families',d:['pair',['struct','cyc',4,null,'cyclobutane'],['struct','ene',4,{},'but-1-ene']],
  h:`<p>Isomers can even belong to different homologous series. Cycloalkanes and alkenes share the general formula C<sub>n</sub>H<sub>2n</sub>.</p>`,
  ex:`Cyclobutane and but-1-ene are both C<sub>4</sub>H<sub>8</sub>. The bromine test tells them apart: only but-1-ene decolourises it quickly.`},
 {t:'Finding all the isomers',w:{type:'steps',title:'How many isomers of C₅H₁₂?',steps:['Straight chain of 5: <b>pentane</b>.','Chain of 4 with one methyl on carbon 2: <b>2-methylbutane</b>. (Carbon 3 is the same thing flipped.)','Chain of 3 with two methyls on carbon 2: <b>2,2-dimethylpropane</b>.','No other arrangement works, so there are <b>3 isomers</b>.']},
  k:`Same name = same molecule. If two drawings get the same name, they're not isomers, just drawn differently.`},
 {t:'Isomer check',h:`<p>Isomers questions often show two structures and ask if they're isomers. Count the carbons and hydrogens of each first.</p>`,
  w:{type:'quiz',q:'Which compound is an isomer of hexane, C₆H₁₄?',o:['Cyclohexane','Hex-1-ene','2-methylpentane','Pentane'],a:2,x:'2-methylpentane has 6 C and 14 H but a different structure.'}}
]}],

 {t:'t6b',d:['struct','ane',5,{1:{d:'CH₃'}}],q:`Name this alkane.`,o:['2-methylpentane','4-methylpentane','methylhexane','2-methylbutane'],a:0},
 {t:'t6b',d:['struct','ane',4,{1:{u:'CH₃',d:'CH₃'}}],q:`Name this alkane.`,o:['2,2-dimethylbutane','3,3-dimethylbutane','2-dimethylbutane','hexane'],a:0},

 {t:'t6d',m:2,q:`Cyclohexane and hex-1-ene are isomers. Describe a test to tell them apart and the result for each.`,ans:`Add bromine solution [1]. Hex-1-ene decolourises it quickly; cyclohexane does not, it stays orange [1].`}

/* ===== Chapter 7: Everyday consumer products ===== */
const CH7={id:'c7',num:7,area:1,sym:'Cp',name:'Alcohols & carboxylic acids',
blurb:`The chemistry inside hand gel, vinegar, perfume and fuel: two families with their own functional groups.`,
topics:[
{id:'t7a',name:'Alcohols',slides:[
 {t:'The hydroxyl group',d:['struct','ol',2,null,'Ethanol, C₂H₅OH'],
  h:`<p>An <b>alcohol</b> contains the <b>hydroxyl functional group, –OH</b>.</p><p>Straight-chain alcohols have the general formula <b>C<sub>n</sub>H<sub>2n+1</sub>OH</b>. Names end in <b>-ol</b>: methanol, ethanol, propanol…</p>`,
  k:`The –OH in an alcohol is not a hydroxide ion. Alcohols are not alkalis: ethanol is neutral.`},
 {t:'Where is the –OH?',d:['pair',['struct','ol',3,null,'propan-1-ol'],['struct','ane',3,{1:{d:'OH'}},'propan-2-ol']],
  h:`<p>From three carbons on, the –OH can sit on different carbons. Number from the end nearest the –OH and put the number before -ol.</p>`,
  w:{type:'quiz',q:'A 4-carbon chain has –OH on carbon 2. Name it.',o:['butan-1-ol','butan-2-ol','butanol-2','2-butanol acid'],a:1}},
 {t:'Build alcohols',sim:['molecule','ol'],h:`<p>Build methanol to octan-1-ol. Each step adds CH<sub>2</sub>, just like the alkanes.</p>`},
 {t:'What alcohols are used for',h:`<ul><li><b>Fuels:</b> highly flammable, burn with very clean flames.</li><li><b>Solvents:</b> dissolve things that water can't, like perfumes and inks.</li></ul>`,
  ex:`Methylated spirit in camping stoves. Methanol fuel in drag racing and speedway. Ethanol in hand sanitiser and perfume.`,
  fun:`Methanol burns with an almost invisible flame in daylight, so speedway pit crews have to watch out for fires they can't see.`},
 {t:'Patterns in alcohols',d:['bpBars',[['C1',65],['C2',78],['C3',97],['C4',118],['C5',138],['C6',158],['C7',176],['C8',195]],'Straight-chain alcohol boiling points (°C)'],
  h:`<ul><li><b>Solubility:</b> methanol, ethanol and propanol mix completely with water. After that, solubility drops as the molecules get bigger.</li><li><b>Boiling points</b> rise with size, because forces between molecules get stronger.</li></ul>`,
  w:{type:'quiz',q:'Which alcohol would you expect to be least soluble in water?',o:['Methanol','Ethanol','Propan-1-ol','Octan-1-ol'],a:3}}
]},
{id:'t7b',name:'Carboxylic acids',slides:[
 {t:'The carboxyl group',d:['struct','oic',2,null,'Ethanoic acid, CH₃COOH'],
  h:`<p><b>Carboxylic acids</b> contain the <b>carboxyl functional group, –COOH</b>. General formula <b>C<sub>n</sub>H<sub>2n+1</sub>COOH</b>.</p><p>Names end in <b>-oic acid</b>, and the carbon in COOH <b>counts</b> in the name.</p>`,
  ex:`CH<sub>3</sub>COOH has two carbons → ethanoic acid.<br>C<sub>2</sub>H<sub>5</sub>COOH has three carbons → propanoic acid.`},
 {t:'Build carboxylic acids',sim:['molecule','oic'],h:`<p>Notice the end carbon always has a double-bonded O and an OH, so it can't have any hydrogens of its own (except in methanoic acid).</p>`},
 {t:'Vinegar and other uses',h:`<p><b>Vinegar</b> is a solution of <b>ethanoic acid</b>. It's a non-toxic acid, so it's safe to use in household cleaning products like kettle descalers.</p><p>Carboxylic acids are also used to make <b>preservatives, soaps and medicines</b>.</p>`,
  ex:`Pickled onions last for months because the low pH of vinegar stops bacteria and fungi growing.`,
  fun:`Ants sting with methanoic acid. Its old name, formic acid, comes from formica, the Latin for ant.`},
 {t:'Properties',h:`<ul><li>Methanoic to butanoic acid mix completely with water; bigger ones are less soluble.</li><li>Boiling points rise with size.</li><li>Solutions have <b>pH below 7</b>.</li></ul>`,
  w:{type:'quiz',q:'What is the molecular formula of propanoic acid?',o:['C₃H₇COOH','C₂H₅COOH','CH₃COOH','C₃H₆O'],a:1,x:'3 carbons in total, one of which is in COOH: C₂H₅COOH.'}},
 {t:'Reactions and salts',h:`<p>They react like other acids, with metals, metal oxides, hydroxides and carbonates, to form salts. The salt name ends in <b>-anoate</b>.</p>`,
  w:{type:'steps',title:'Name the products',steps:['ethanoic acid + sodium hydroxide → <b>sodium ethanoate</b> + water','methanoic acid + calcium carbonate → <b>calcium methanoate</b> + water + carbon dioxide','propanoic acid + magnesium → <b>magnesium propanoate</b> + hydrogen']},
  fun:`Sodium ethanoate is in "salt and vinegar" crisp flavouring, and in hand warmers that click to heat up.`},
 {t:'Spot the family',w:{type:'sort',title:'Which family?',cats:['Alkane','Alkene','Alcohol','Acid'],items:[['Hexane',0],['Pentan-2-ol',2],['Butanoic acid',3],['Prop-1-ene',1],['Methanol',2],['Octanoic acid',3],['Ethene',1],['2-methylbutane',0]]},
  k:`-ane: alkane. -ene: alkene. -ol: alcohol. -oic acid: carboxylic acid.`}
]}],

 {t:'t7a',q:`What is the name of C₃H₇OH with the –OH on the end carbon?`,o:['Propanol-1','Propan-1-ol','Propanoic acid','Propan-3-ol'],a:1},
 {t:'t7a',q:`Why are alcohols good fuels?`,o:['They are alkaline','They are highly flammable and burn with clean flames','They don\'t burn','They are insoluble'],a:1},
 {t:'t7a',q:`Which alcohol is fully miscible with water?`,o:['Ethanol','Hexan-1-ol','Octan-1-ol','Heptan-1-ol'],a:0},
 {t:'t7b',q:`What is the functional group in carboxylic acids?`,o:['–OH','–COOH','C=C','–CHO'],a:1},
 {t:'t7b',q:`Vinegar is a solution of:`,o:['methanoic acid','ethanoic acid','ethanol','propanoic acid'],a:1},
 {t:'t7b',q:`Name the salt formed when ethanoic acid reacts with potassium hydroxide.`,o:['Potassium ethanol','Potassium ethanoate','Potassium ethanide','Potassium hydroxide'],a:1},
 {t:'t7b',d:['struct','oic',4],q:`Name this compound.`,o:['Butanoic acid','Propanoic acid','Butan-1-ol','Pentanoic acid'],a:0,x:'Four carbons including the COOH carbon.'},
 {t:'t7b',m:2,q:`Give two uses of carboxylic acids and explain why vinegar is used in household cleaning.`,ans:`Any two: preservatives, soaps, medicines [1]. Vinegar is a non-toxic acid, so it is safe to use around the home [1].`},
 {t:'t7a',m:2,q:`Explain why the boiling points of alcohols increase as the molecules get bigger.`,ans:`As molecular size increases [1], the forces of attraction between molecules get stronger, so more energy is needed to separate them [1].`}

/* ===== Chapter 8: Energy from fuels ===== */
const CH8={id:'c8',num:8,area:1,sym:'En',name:'Energy from fuels',
blurb:`Burning fuels, writing combustion equations, and measuring how much energy a fuel gives out.`,
topics:[
{id:'t8a',name:'Exothermic reactions and combustion',slides:[
 {t:'Energy in, energy out',d:['energy','exo'],
  h:`<ul><li><b>Exothermic:</b> releases heat. The surroundings warm up.</li><li><b>Endothermic:</b> takes in heat. The surroundings cool down.</li></ul>`,
  w:{type:'sort',title:'Exo or endo?',cats:['Exothermic','Endothermic'],items:[['Burning petrol',0],['Ice pack cooling',1],['Respiration in your cells',0],['Photosynthesis',1],['Acid + alkali',0]]}},
 {t:'Combustion',h:`<p>In <b>combustion</b>, a substance reacts with <b>oxygen</b>, releasing energy.</p><p>Hydrocarbons and alcohols burn in plenty of oxygen to make <b>carbon dioxide and water</b>.</p>`,
  ex:`methane + oxygen → carbon dioxide + water<br>CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O`,
  fun:`A Bunsen burner with the air hole closed gets a yellow, sooty flame: not enough oxygen for complete combustion.`},
 {t:'Writing combustion equations',w:{type:'steps',title:'Propane, C₃H₈',steps:['Write it out: C<sub>3</sub>H<sub>8</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O','Carbon: 3 on the left, so 3CO<sub>2</sub>.','Hydrogen: 8 on the left, so 4H<sub>2</sub>O.','Oxygen on the right: 3 × 2 + 4 × 1 = 10, so 5O<sub>2</sub>.','<b>C<sub>3</sub>H<sub>8</sub> + 5O<sub>2</sub> → 3CO<sub>2</sub> + 4H<sub>2</sub>O</b>']},
  k:`Balance C, then H, then O last. For alcohols, remember the O already in the fuel.`},
 {t:'Alcohols burn too',ex:`ethanol + oxygen → carbon dioxide + water<br>C<sub>2</sub>H<sub>5</sub>OH + 3O<sub>2</sub> → 2CO<sub>2</sub> + 3H<sub>2</sub>O<br><br>Check oxygen: left 1 + 6 = 7; right 4 + 3 = 7 ✓`,
  w:{type:'quiz',q:'How many O₂ molecules are needed to burn one methanol molecule, CH₃OH, completely?',o:['1','1.5','2','3'],a:1,x:'CH₃OH + 1.5O₂ → CO₂ + 2H₂O (or 2CH₃OH + 3O₂ → 2CO₂ + 4H₂O).'}}
]},
{id:'t8b',name:'Measuring energy: Eh = cmΔT',slides:[
 {t:'The experiment',d:['ehSetup'],
  w:{type:'steps',title:'Method',steps:['Weigh the spirit burner (with fuel) and measure the mass of water in the can.','Record the starting water temperature.','Light the burner and heat the water while stirring.','Put out the flame; record the highest temperature.','Reweigh the burner to find the mass of fuel burned.']}},
 {t:'The formula',h:`<p style="font-size:1.2rem;font-weight:800">E<sub>h</sub> = c m ΔT</p><table class="t"><tr><td>E<sub>h</sub></td><td>heat energy (kJ)</td></tr><tr><td>c</td><td>specific heat capacity of water, 4.18 kJ kg<sup>−1</sup> °C<sup>−1</sup> (data booklet)</td></tr><tr><td>m</td><td>mass of water heated (kg)</td></tr><tr><td>ΔT</td><td>temperature change (°C)</td></tr></table>`,
  ex:`100 cm<sup>3</sup> of water (0.1 kg) warms by 15 °C:<br>E<sub>h</sub> = 4.18 × 0.1 × 15 = <b>6.27 kJ</b>`,
  k:`1 cm³ of water has a mass of 1 g. Divide grams by 1000 to get kg.`},
 {t:'Try the calculator',sim:['energyCalc'],h:`<p>Move the sliders and watch the working change. What happens to E<sub>h</sub> if you double the mass?</p>`},
 {t:'Rearranging the formula',w:{type:'steps',title:'10.45 kJ heats 250 g of water. Find ΔT.',steps:['ΔT = E<sub>h</sub> ÷ (c × m)','m = 250 ÷ 1000 = 0.25 kg','ΔT = 10.45 ÷ (4.18 × 0.25)','= 10.45 ÷ 1.045 = <b>10 °C</b>']},
  ex:`You may be asked about a liquid that isn't water. Just use the c value given in the question.`},
 {t:'Why is my answer too low?',h:`<p>Experimental values are always lower than data booklet values. Heat escapes!</p>`,
  w:{type:'cards',title:'Problems and fixes',items:[['Heat lost to the air','Use a draught shield and insulate the can'],['Heat used warming the can','Use a thin copper can and a lid'],['Incomplete combustion (soot)','Keep the wick short, allow good air flow'],['Fuel evaporates','Keep the lid on the burner when not lit']]}}
]}],
exam:{id:'x8',name:'Chapter 8 test',questions:[
 {t:'t8a',q:`A reaction makes its surroundings colder. It is:`,o:['exothermic','endothermic','combustion','neutralisation'],a:1},
 {t:'t8a',q:`What are the products of complete combustion of a hydrocarbon?`,o:['Carbon and hydrogen','Carbon dioxide and water','Carbon monoxide only','Water only'],a:1},
 {t:'t8a',q:`Balance: C₂H₆ + __O₂ → 2CO₂ + 3H₂O`,o:['3','3.5','5','7'],a:1,x:'Right side O = 4 + 3 = 7, so 3.5O₂ (or double everything: 2C₂H₆ + 7O₂ → 4CO₂ + 6H₂O).'},
 {t:'t8a',m:2,q:`Write a balanced equation for the complete combustion of ethanol, C₂H₅OH.`,ans:`C₂H₅OH + 3O₂ → 2CO₂ + 3H₂O<br>1 mark for correct formulae, 1 mark for balancing.`},
 {t:'t8b',m:2,q:`200 g of water is heated from 18 °C to 43 °C. Calculate the energy absorbed. (c = 4.18 kJ kg⁻¹ °C⁻¹)`,n:20.9,u:'kJ',tol:0.1,x:'Eh = 4.18 × 0.2 × 25 = 20.9 kJ.'},
 {t:'t8b',m:2,q:`500 cm³ of water absorbs 41.8 kJ. Calculate the temperature rise.`,n:20,u:'°C',tol:0.1,x:'ΔT = 41.8 ÷ (4.18 × 0.5) = 20 °C.'},
 {t:'t8b',m:2,q:`6.27 kJ raises the temperature of some water by 30 °C. Calculate the mass of water in kg.`,n:0.05,u:'kg',tol:0.001,x:'m = 6.27 ÷ (4.18 × 30) = 0.05 kg.'},
 {t:'t8b',q:`Why is the experimental value for the energy released by a fuel usually lower than the data booklet value?`,o:['Too much oxygen','Heat is lost to the surroundings','The thermometer is too accurate','Water has a low heat capacity'],a:1},
 {t:'t8b',m:2,q:`Suggest two improvements to the spirit burner experiment.`,ans:`Any two [1 each]: use a draught shield; insulate the can or add a lid; reduce the distance between flame and can; stir the water; reweigh the burner immediately (cap on) to stop evaporation.`}

/* ===== Chapter 9: Metals ===== */
const CH9={id:'c9',num:9,area:2,sym:'Me',name:'Metals',
blurb:`Why metals conduct, how they react, the reactivity series, redox, and how we get metals out of rocks.`,
topics:[
{id:'t9a',name:'Metallic bonding and reactions of metals',slides:[
 {t:'Metallic bonding',d:['metallic'],
  h:`<p><b>Metallic bonding</b> is the electrostatic attraction between <b>positive metal ions</b> and <b>delocalised electrons</b>.</p><p>The delocalised electrons are free to move, so metals <b>conduct electricity</b>.</p>`,
  ex:`Copper is used for household wiring because its electrons flow so easily. Aluminium is used for overhead power cables because it conducts well and is light.`},
 {t:'Metals + oxygen',h:`<p style="font-weight:800">metal + oxygen → metal oxide</p>`,
  ex:`2Mg + O<sub>2</sub> → 2MgO<br>4Na + O<sub>2</sub> → 2Na<sub>2</sub>O<br>Magnesium burns with a dazzling white light; that's why it's used in flares and fireworks.`,
  fun:`Iron wool burns in a sparkly shower, and the product is heavier than the iron you started with, because oxygen atoms have been added.`,
  w:{type:'quiz',q:'Why does magnesium get heavier when it burns?',o:['It absorbs water','Oxygen from the air combines with it','The flame adds carbon','It doesn\'t; it gets lighter'],a:1}},
 {t:'Metals + water',h:`<p style="font-weight:800">metal + water → metal hydroxide + hydrogen</p><p>Only the more reactive metals react with cold water.</p>`,
  ex:`2Na + 2H<sub>2</sub>O → 2NaOH + H<sub>2</sub><br>Sodium whizzes round on the surface, fizzing. Add universal indicator and it turns purple: the hydroxide is an alkali.<br><br>Ca + 2H<sub>2</sub>O → Ca(OH)<sub>2</sub> + H<sub>2</sub>`},
 {t:'Metals + dilute acids',h:`<p style="font-weight:800">metal + dilute acid → salt + hydrogen</p>`,
  ex:`Mg + 2HCl → MgCl<sub>2</sub> + H<sub>2</sub><br>Zn + H<sub>2</sub>SO<sub>4</sub> → ZnSO<sub>4</sub> + H<sub>2</sub><br>Hold a lit splint at the mouth of the tube: hydrogen burns with a <b>pop</b>.`,
  w:{type:'quiz',q:'Name the salt made when zinc reacts with hydrochloric acid.',o:['Zinc sulfate','Zinc chloride','Zinc hydroxide','Zinc oxide'],a:1},
  k:`Copper, silver and gold don't react with dilute acids.`},
 {t:'The reactivity series',d:['extraction'],
  h:`<p>Comparing how fast metals react with oxygen, water and acids puts them in order. The most reactive are at the top.</p>`,
  w:{type:'cards',items:[['Potassium, sodium, lithium','React violently with cold water'],['Calcium, magnesium','React with water (magnesium only slowly) and with acid'],['Zinc, iron, tin, lead','React with acid, not with water'],['Copper, silver, gold','Don\'t react with dilute acids at all']]},
  fun:`Gold is so unreactive that gold jewellery from ancient Egyptian tombs still shines after 3000 years.`},
 {t:'Making salts from metals',h:`<p>A soluble salt can be made by adding <b>excess metal</b> to an acid, <b>filtering</b> off the leftover metal and <b>evaporating</b> the filtrate.</p>`,
  ex:`Excess magnesium ribbon + sulfuric acid → magnesium sulfate + hydrogen. When the fizzing stops, all the acid has reacted.`,
  w:{type:'quiz',q:'Why is the metal added in excess?',o:['To make it faster','So all the acid is used up','To make hydrogen','To colour the salt'],a:1}}
]},
{id:'t9b',name:'Redox',slides:[
 {t:'OIL RIG',h:`<p><b>O</b>xidation <b>I</b>s <b>L</b>oss of electrons.<br><b>R</b>eduction <b>I</b>s <b>G</b>ain of electrons.</p><p>In a <b>redox</b> reaction, reduction and oxidation happen <b>at the same time</b>: electrons lost by one reactant are gained by another.</p>`,
  w:{type:'cards',items:[['Mg → Mg²⁺ + 2e⁻','Oxidation: electrons lost (on the right)'],['Cu²⁺ + 2e⁻ → Cu','Reduction: electrons gained (on the left)'],['Fe²⁺ → Fe³⁺ + e⁻','Oxidation: lost an electron'],['Cl₂ + 2e⁻ → 2Cl⁻','Reduction: gained electrons']]}},
 {t:'Ion-electron equations',h:`<p>The electrochemical series in the data booklet lists <b>reductions</b>. Turn them around for oxidations.</p>`,
  ex:`Data booklet: Zn<sup>2+</sup> + 2e<sup>−</sup> → Zn (reduction)<br>Reversed: Zn → Zn<sup>2+</sup> + 2e<sup>−</sup> (oxidation)`,
  k:`Check that both atoms and charges balance.`},
 {t:'Combining into a redox equation',w:{type:'steps',title:'Magnesium in copper(II) sulfate solution',steps:['Oxidation: Mg → Mg<sup>2+</sup> + 2e<sup>−</sup>','Reduction: Cu<sup>2+</sup> + 2e<sup>−</sup> → Cu','Electrons match (2 and 2), so add them together and cancel the electrons.','<b>Mg + Cu<sup>2+</sup> → Mg<sup>2+</sup> + Cu</b>']},
  fun:`Drop an iron nail into blue copper(II) sulfate solution and it gets a pink-brown coat of copper within minutes, while the blue fades.`},
 {t:'When the electrons don\'t match',w:{type:'steps',title:'Aluminium + copper(II) ions',steps:['Oxidation: Al → Al<sup>3+</sup> + 3e<sup>−</sup>','Reduction: Cu<sup>2+</sup> + 2e<sup>−</sup> → Cu','Make the electrons equal (6): ×2 the first, ×3 the second.','2Al → 2Al<sup>3+</sup> + 6e<sup>−</sup> and 3Cu<sup>2+</sup> + 6e<sup>−</sup> → 3Cu','<b>2Al + 3Cu<sup>2+</sup> → 2Al<sup>3+</sup> + 3Cu</b>']}}
]},
{id:'t9c',name:'Extracting metals and electrolysis',slides:[
 {t:'From ore to metal',d:['extraction'],
  h:`<p>Most metals are found in rocks called <b>ores</b>, as compounds. Extraction turns metal <b>ions</b> back into metal <b>atoms</b>: this is <b>reduction</b>.</p><p>The more reactive the metal, the harder it is to extract.</p>`,
  ex:`Fe<sup>3+</sup> + 3e<sup>−</sup> → Fe: iron ions gain electrons and become iron atoms.`},
 {t:'Three methods',h:`<table class="t"><tr><th>Method</th><th>Metals</th></tr><tr><td>Heat alone</td><td>Silver, gold, mercury</td></tr><tr><td>Heat with carbon or carbon monoxide</td><td>Copper, lead, tin, iron, zinc</td></tr><tr><td>Electrolysis</td><td>More reactive metals, including aluminium</td></tr></table>`,
  ex:`Heat alone: 2HgO → 2Hg + O<sub>2</sub><br>With carbon: 2CuO + C → 2Cu + CO<sub>2</sub><br>With carbon monoxide: Fe<sub>2</sub>O<sub>3</sub> + 3CO → 2Fe + 3CO<sub>2</sub>`,
  fun:`Before cheap electricity, aluminium was so hard to extract that it was more valuable than gold. Napoleon III gave his most important guests aluminium cutlery.`},
 {t:'Electrolysis',d:['electrolysis'],
  h:`<p><b>Electrolysis</b> is breaking down an ionic compound into its elements using electricity. The compound must be molten or dissolved so its ions can move.</p><ul><li>A <b>d.c.</b> supply is needed if you want to identify the products.</li><li>Positive ions <b>gain</b> electrons at the <b>negative</b> electrode.</li><li>Negative ions <b>lose</b> electrons at the <b>positive</b> electrode.</li></ul>`},
 {t:'What forms at each electrode?',ex:`Electrolysis of copper(II) chloride solution:<br>Negative electrode: Cu<sup>2+</sup> + 2e<sup>−</sup> → Cu (pink-brown coating)<br>Positive electrode: 2Cl<sup>−</sup> → Cl<sub>2</sub> + 2e<sup>−</sup> (bubbles of chlorine gas, smells like swimming pools)`,
  w:{type:'quiz',q:'In the electrolysis of molten lead(II) bromide, what forms at the negative electrode?',o:['Bromine','Lead','Hydrogen','Oxygen'],a:1,x:'Positive Pb²⁺ ions are attracted to the negative electrode and gain electrons.'},
  k:`At the negative electrode it's always reduction (gain). At the positive electrode it's oxidation (loss).`}
]}],
exam:{id:'x9',name:'Chapter 9 test',questions:[
 {t:'t9a',q:`Metallic bonding is the attraction between:`,o:['positive and negative ions','positive ions and delocalised electrons','shared pairs of electrons and nuclei','molecules'],a:1},
 {t:'t9a',q:`What are the products when calcium reacts with water?`,o:['Calcium oxide and hydrogen','Calcium hydroxide and hydrogen','Calcium hydroxide and oxygen','Calcium carbonate and water'],a:1},
 {t:'t9a',q:`Which metal would NOT react with dilute hydrochloric acid?`,o:['Magnesium','Zinc','Iron','Copper'],a:3},
 {t:'t9a',m:2,q:`Write a balanced formula equation for magnesium reacting with hydrochloric acid.`,ans:`Mg + 2HCl → MgCl₂ + H₂ [1 formulae, 1 balancing]`},
 {t:'t9b',q:`Which equation shows reduction?`,o:['Na → Na⁺ + e⁻','Fe²⁺ → Fe³⁺ + e⁻','Ag⁺ + e⁻ → Ag','Zn → Zn²⁺ + 2e⁻'],a:2},
 {t:'t9b',m:2,q:`Combine these into a redox equation:<br>Zn → Zn²⁺ + 2e⁻<br>Ag⁺ + e⁻ → Ag`,ans:`Double the silver equation: 2Ag⁺ + 2e⁻ → 2Ag [1].<br>Zn + 2Ag⁺ → Zn²⁺ + 2Ag [1]`},
 {t:'t9c',q:`Which metal is extracted by electrolysis?`,o:['Gold','Copper','Aluminium','Iron'],a:2},
 {t:'t9c',q:`During extraction, metal ions are:`,o:['oxidised','reduced','neutralised','evaporated'],a:1},
 {t:'t9c',q:`Why must a d.c. supply be used in electrolysis if the products are to be identified?`,o:['It is safer','Each electrode stays the same charge, so each product forms at one electrode','It is cheaper','a.c. doesn\'t conduct'],a:1},
 {t:'t9c',m:2,q:`Copper(II) chloride solution is electrolysed. Write the ion-electron equation at each electrode.`,ans:`Negative: Cu²⁺ + 2e⁻ → Cu [1]<br>Positive: 2Cl⁻ → Cl₂ + 2e⁻ [1]`}
]}};

/* ===== Chapter 10: Electrochemical cells ===== */
const CH10={id:'c10',num:10,area:2,sym:'Ec',name:'Electrochemical cells',
blurb:`Batteries from chemistry: how two metals and an electrolyte make electricity, and which way the electrons go.`,
topics:[
{id:'t10a',name:'Making electricity from chemicals',slides:[
 {t:'A simple cell',d:['simpleCell'],
  h:`<p>Put two different metals in an <b>electrolyte</b> (a solution of ions that conducts) and join them with a wire: electricity flows. That's a <b>cell</b>.</p>`,
  fun:`Stick a zinc nail and a copper coin into a lemon and you've made a battery. Press one hand on an aluminium plate and the other on a copper plate and your sweat is the electrolyte!`},
 {t:'Half-cells and the ion bridge',h:`<ul><li>A <b>half-cell</b> is a metal dipped in a solution of its own ions, e.g. zinc in zinc sulfate.</li><li>Two half-cells are joined by a wire <b>and</b> an <b>ion bridge</b> (salt bridge): filter paper soaked in an ionic solution.</li><li>Ions move through the bridge to <b>complete the circuit</b>. Electrons can't travel through the solution.</li></ul>`,
  w:{type:'quiz',q:'What is the job of the ion bridge?',o:['To carry electrons','To let ions move and complete the circuit','To measure voltage','To stop the reaction'],a:1}},
 {t:'Build a cell',sim:['cell'],h:`<p>Pick two metals. Watch which way the electrons flow and how the voltage changes. Try zinc and copper, then magnesium and copper, then iron and lead.</p>`},
 {t:'The electrochemical series',h:`<p>Measuring voltages lets us put elements in order: the <b>electrochemical series</b> (data booklet).</p><ul><li>The <b>further apart</b> two metals are, the <b>bigger the voltage</b>.</li><li><b>Electrons flow</b> through the wire <b>from the metal higher in the series to the one lower</b>.</li></ul>`,
  w:{type:'quiz',q:'Which pair would give the biggest voltage?',o:['Zinc and iron','Magnesium and copper','Copper and silver','Tin and lead'],a:1,x:'Magnesium and copper are furthest apart in the series.'}}
]},
{id:'t10b',name:'Reactions in cells',slides:[
 {t:'What happens in a zinc–copper cell',w:{type:'steps',title:'Follow the electrons',steps:['Zinc is higher in the series, so it loses electrons. <b>Oxidation:</b> Zn → Zn<sup>2+</sup> + 2e<sup>−</sup>','Electrons travel through the wire from zinc to copper.','Copper ions in the solution pick them up. <b>Reduction:</b> Cu<sup>2+</sup> + 2e<sup>−</sup> → Cu','<b>Redox:</b> Zn + Cu<sup>2+</sup> → Zn<sup>2+</sup> + Cu','Over time the zinc electrode wears away and the copper electrode gets thicker.']}},
 {t:'Cells without two metals',h:`<p>A half-cell can use a non-metal, with an inert <b>graphite rod</b> as the electrode.</p>`,
  ex:`Magnesium half-cell joined to iodine solution with a graphite rod:<br>Oxidation: Mg → Mg<sup>2+</sup> + 2e<sup>−</sup><br>Reduction (at the graphite): I<sub>2</sub> + 2e<sup>−</sup> → 2I<sup>−</sup><br>Electrons flow from magnesium to the graphite. The brown iodine colour fades.`,
  k:`Graphite just passes electrons on. It doesn't react.`},
 {t:'Cells vs electrolysis',w:{type:'cards',items:[['Cell','Chemical reaction makes electricity'],['Electrolysis','Electricity forces a chemical reaction'],['In both','Oxidation and reduction happen at the same time'],['Electron flow in a cell','From higher in the series to lower']]},
  h:`<p>They're opposites: a cell turns chemical energy into electrical energy; electrolysis uses electrical energy to break compounds apart.</p>`}
]}],
exam:{id:'x10',name:'Chapter 10 test',questions:[
 {t:'t10a',q:`An electrolyte is:`,o:['a metal that conducts','a solution containing ions that conducts','a wire','an insulator'],a:1},
 {t:'t10a',q:`Electrons flow through the external circuit:`,o:['from lower to higher in the electrochemical series','from higher to lower in the electrochemical series','through the ion bridge','in both directions'],a:1},
 {t:'t10a',q:`Which pair of metals gives the smallest voltage?`,o:['Magnesium and silver','Zinc and copper','Tin and lead','Sodium and copper'],a:2},
 {t:'t10a',q:`Ions move through the ion bridge in order to:`,o:['produce electrons','complete the circuit','increase the voltage','neutralise the solution'],a:1},
 {t:'t10b',m:2,q:`In a zinc–copper cell, write the oxidation and reduction equations.`,ans:`Oxidation: Zn → Zn²⁺ + 2e⁻ [1]<br>Reduction: Cu²⁺ + 2e⁻ → Cu [1]`},
 {t:'t10b',q:`Why is graphite used as the electrode in an iodine half-cell?`,o:['It reacts with iodine','It conducts but doesn\'t react','It is a metal','It makes the voltage higher'],a:1},
 {t:'t10b',q:`In a magnesium–iodine cell, what happens to the iodine?`,o:['It is oxidised to I⁺','It is reduced to iodide ions','It forms magnesium','It does nothing'],a:1},
 {t:'t10b',m:2,q:`In an iron–copper cell, which way do electrons flow and which electrode gets heavier?`,ans:`Electrons flow from iron to copper (iron is higher in the series) [1]. The copper electrode gets heavier as copper ions are reduced onto it [1].`}
]}};

/* ===== Helpers ===== */
const NUC=(A,Z,S)=>`<span style="display:inline-flex;flex-direction:column;font-size:.68em;line-height:1.05;vertical-align:middle;text-align:right;margin-right:1px"><span>${A}</span><span>${Z}</span></span>${S}`;
DIAGRAMS.polyChain=(sub,mono,poly)=>{const [a,b,c,d]=sub;let s='';
  const m=[['C',140,50],['C',200,50],[a,108,20],[b,108,80],[c,232,20],[d,232,80]];s+=CHEM.draw(m,[[140,50,200,50,2],[140,50,108,20,1],[140,50,108,80,1],[200,50,232,20,1],[200,50,232,80,1]]);
  s+=TX(248,54,mono,'font-weight="800" font-size="12"')+ARROW(170,100,170,126,PAL.u4);
  const Y=180,D=46,atoms=[],bonds=[[6,Y,32,Y,1]];for(let i=0;i<6;i++){const x=32+i*D,top=i%2?c:a,bot=i%2?d:b;atoms.push(['C',x,Y],[top,x,Y-36],[bot,x,Y+36]);bonds.push([x,Y,x,Y-36,1],[x,Y,x,Y+36,1],[x,Y,i<5?x+D:x+24,Y,1]);}
  s+=CHEM.draw(atoms,bonds)+`<path d="M${32-20} ${Y-50} h-5 v100 h5 M${32+D+20} ${Y-50} h5 v100 h-5" fill="none" stroke="${PAL.u0}" stroke-width="2.5"/>`+TX(32+D+30,Y+52,'n','font-weight="800" fill="'+PAL.u0+'"');
  s+=TX(170,244,poly+' (repeating unit in red)','text-anchor="middle" font-weight="800" font-size="12"');
  return SVG(340,252,s,'Monomer and polymer');};

/* ===== Chapter 11: Plastics & fertilisers ===== */
const CH11={id:'c11',num:11,area:2,sym:'Pf',name:'Plastics & fertilisers',
blurb:`Joining small molecules into giant chains, and the chemistry that feeds half the world.`,
topics:[
{id:'t11a',name:'Plastics and addition polymerisation',slides:[
 {t:'Polymers',d:['polymer'],
  h:`<p><b>Plastics</b> are <b>polymers</b>: long-chain molecules made by joining lots of small molecules called <b>monomers</b>.</p><p><b>Addition polymerisation</b> joins <b>unsaturated</b> monomers: each C=C double bond opens up and links to the next monomer.</p>`,
  ex:`Think of paperclips: each monomer is a clip, and the polymer is the chain you make by hooking thousands together.`},
 {t:'Naming polymers',h:`<p>Put poly in front of the monomer's name. Brackets help show the monomer.</p>`,
  w:{type:'cards',items:[['Ethene','→ poly(ethene): carrier bags, bottles'],['Propene','→ poly(propene): ropes, crates, food tubs'],['Chloroethene','→ poly(chloroethene), PVC: window frames, pipes'],['Tetrafluoroethene','→ poly(tetrafluoroethene), PTFE: non-stick pans']]}},
 {t:'Drawing a polymer from a monomer',d:['polyChain',['H','H','H','CH₃'],'propene','poly(propene)'],
  w:{type:'steps',title:'Propene → poly(propene)',steps:['Draw the monomer with the C=C in the middle and the other groups up and down.','Change the double bond to a single bond with an open bond on each end.','Join several units in a row, keeping every group in the same position.','The <b>repeating unit</b> is the shortest section that repeats: here, two carbons.']}},
 {t:'Working backwards',d:['polyChain',['H','H','H','Cl'],'chloroethene','poly(chloroethene)'],
  h:`<p>Given a polymer, find the monomer:</p><ol><li>Find the repeating unit (two carbons from the backbone).</li><li>Put the <b>double bond back</b> between them.</li></ol>`,
  w:{type:'quiz',q:'A polymer\'s repeating unit is –CH₂–CHCl–. What is the monomer?',o:['Chloroethane','Chloroethene','Ethene','Dichloroethene'],a:1},
  fun:`PTFE was discovered by accident in 1938 when a gas cylinder seemed empty but still weighed too much. Inside was a slippery white powder.`}
]},
{id:'t11b',name:'Fertilisers and ammonia',slides:[
 {t:'What plants need',h:`<p>Growing plants need compounds of <b>nitrogen (N)</b>, <b>phosphorus (P)</b> and <b>potassium (K)</b>. Crops remove these from the soil.</p><p><b>Fertilisers</b> restore these essential elements. They must be <b>soluble</b> so roots can take them in.</p>`,
  w:{type:'cards',items:[['N','Nitrogen: leafy growth'],['P','Phosphorus: roots'],['K','Potassium: flowers and fruit'],['NPK 20-10-10','A bag label showing the % of each nutrient']]}},
 {t:'Ammonia',h:`<p><b>Ammonia, NH<sub>3</sub></b>, is a <b>pungent, clear, colourless gas</b>. It dissolves very easily in water to make an <b>alkaline</b> solution.</p><p style="font-weight:800">ammonia solution + acid → ammonium salt + water</p>`,
  ex:`ammonia + nitric acid → ammonium nitrate<br>ammonia + sulfuric acid → ammonium sulfate<br>ammonia + phosphoric acid → ammonium phosphate (N and P in one!)`,
  fun:`Ammonia dissolves so fast that in the "fountain experiment" water is sucked up into a flask of ammonia and sprays out like a fountain.`},
 {t:'Which fertiliser gives most nitrogen?',d:['pctBar',[['N',35,PAL.u3],['other',65,'#9AA5B1']],'Ammonium nitrate: 35% nitrogen'],
  w:{type:'steps',title:'% nitrogen in ammonium phosphate, (NH₄)₃PO₄ (GFM 149)',steps:['Nitrogen atoms: 3 (one in each NH<sub>4</sub>)','Mass of N = 3 × 14 = 42 g','% N = (42 ÷ 149) × 100 = <b>28.2%</b>']}}
]},
{id:'t11c',name:'The Haber and Ostwald processes',slides:[
 {t:'The Haber process',d:['haber'],
  h:`<p>Makes the ammonia needed for fertilisers:</p><p style="font-weight:800">N<sub>2</sub>(g) + 3H<sub>2</sub>(g) ⇌ 2NH<sub>3</sub>(g)</p><p>The ⇌ shows it's <b>reversible</b>: ammonia also breaks back down.</p>`,
  fun:`Fertilisers made from Haber-process ammonia grow the food for about half the people on Earth.`},
 {t:'Choosing the temperature',w:{type:'steps',title:'Why not just make it hot?',steps:['At <b>low temperature</b> the forward reaction is too <b>slow</b> to be economical.','<b>Raising</b> the temperature speeds up the reaction…','…but the higher the temperature, the more the <b>backward reaction</b> (ammonia breaking down) takes over.','So a <b>moderately high</b> temperature is a compromise, and an <b>iron catalyst</b> speeds things up without needing more heat.']},
  k:`Iron catalyst for Haber. Platinum catalyst for Ostwald.`},
 {t:'The Ostwald process',d:['ostwald'],
  h:`<p>Turns ammonia into <b>nitric acid</b>, using ammonia, oxygen and water with a <b>platinum catalyst</b>.</p>`,
  ex:`The full fertiliser chain: air (N<sub>2</sub>) → Haber → ammonia → Ostwald → nitric acid. Then ammonia + nitric acid → ammonium nitrate fertiliser.`,
  w:{type:'quiz',q:'Which catalyst is used in the Ostwald process?',o:['Iron','Platinum','Nickel','No catalyst'],a:1}}
]}],
exam:{id:'x11',name:'Chapter 11 test',questions:[
 {t:'t11a',q:`Addition polymers are made from monomers that are:`,o:['saturated','unsaturated','ionic','metals'],a:1},
 {t:'t11a',q:`The monomer for poly(propene) is:`,o:['propane','propene','ethene','propanol'],a:1},
 {t:'t11a',m:2,q:`Describe what a repeating unit is, and how many carbon atoms it has in the main chain of an addition polymer made from one monomer.`,ans:`The shortest section of polymer chain which, if repeated, gives the whole chain [1]. It has two carbon atoms in the main chain [1].`},
 {t:'t11a',q:`A polymer has repeating unit –CF₂–CF₂–. Name the monomer.`,o:['Tetrafluoroethane','Tetrafluoroethene','Fluoroethene','Ethene'],a:1},
 {t:'t11b',q:`Which three elements are most needed by growing plants?`,o:['C, H, O','N, P, K','Na, Cl, K','Fe, Cu, Zn'],a:1},
 {t:'t11b',q:`Ammonia dissolves in water to give:`,o:['an acidic solution','a neutral solution','an alkaline solution','a precipitate'],a:2},
 {t:'t11b',q:`Ammonia solution reacts with sulfuric acid to form:`,o:['ammonium sulfate and water','ammonium sulfide and hydrogen','nitric acid','ammonium nitrate'],a:0},
 {t:'t11c',q:`The equation for the Haber process is:`,o:['N₂ + O₂ → 2NO','N₂ + 3H₂ ⇌ 2NH₃','NH₃ + HNO₃ → NH₄NO₃','4NH₃ + 5O₂ → 4NO + 6H₂O'],a:1},
 {t:'t11c',m:2,q:`Explain why the Haber process isn't run at a low temperature or a very high one.`,ans:`At low temperature the reaction is too slow to be economical [1]. At very high temperature the backward reaction becomes dominant, so less ammonia is produced [1].`},
 {t:'t11c',q:`What is made in the Ostwald process?`,o:['Ammonia','Nitric acid','Sulfuric acid','Ammonium nitrate'],a:1}
]}};

/* ===== Chapter 12: Nuclear chemistry ===== */
const CH12={id:'c12',num:12,area:2,sym:'Nu',name:'Nuclear chemistry',
blurb:`Alpha, beta and gamma radiation, nuclear equations, half-life and how radioactivity is put to work.`,
topics:[
{id:'t12a',name:'Alpha, beta and gamma',slides:[
 {t:'Unstable nuclei',h:`<p>Some nuclei are unstable. These <b>radioisotopes</b> become more stable by giving out <b>radiation</b>: alpha, beta or gamma. This is <b>radioactive decay</b>.</p><p>Unlike chemical reactions, decay changes the <b>nucleus</b>, so the element can change.</p>`,
  fun:`Marie Curie discovered two radioactive elements, polonium and radium. Her notebooks are still so radioactive they're kept in lead-lined boxes.`},
 {t:'The three types',h:`<table class="t"><tr><th></th><th>What it is</th><th>Charge</th><th>Range in air</th><th>Stopped by</th></tr><tr><td><b>α</b></td><td>2 protons + 2 neutrons</td><td>2+</td><td>a few cm</td><td>paper</td></tr><tr><td><b>β</b></td><td>electron from the nucleus</td><td>1−</td><td>over a metre</td><td>thin aluminium</td></tr><tr><td><b>γ</b></td><td>electromagnetic wave</td><td>none</td><td>great distances</td><td>lead or concrete</td></tr></table>`,
  w:{type:'cards',items:[['Alpha α','Heavy, 2+, stopped by paper'],['Beta β','Fast electron, 1−, stopped by thin aluminium'],['Gamma γ','Wave, no charge, stopped by thick lead or concrete'],['Where from?','All three come from the nucleus']]}},
 {t:'How far does it get?',d:['radPen'],h:`<p>The bigger and more charged the radiation, the sooner it's stopped.</p>`},
 {t:'In an electric field',d:['radDeflect'],
  h:`<ul><li><b>Alpha</b> (positive) bends towards the <b>negative</b> plate.</li><li><b>Beta</b> (negative) bends towards the <b>positive</b> plate.</li><li><b>Gamma</b> has no charge and goes straight through.</li></ul>`,
  w:{type:'quiz',q:'Radiation passes straight between charged plates and is only stopped by thick lead. What is it?',o:['Alpha','Beta','Gamma','Neutrons'],a:2}}
]},
{id:'t12b',name:'Nuclear equations',slides:[
 {t:'Symbols you need',h:`<table class="t"><tr><td>Alpha particle</td><td style="font-size:1.2rem">${NUC(4,2,'He')}</td></tr><tr><td>Beta particle</td><td style="font-size:1.2rem">${NUC(0,'−1','e')}</td></tr><tr><td>Proton</td><td style="font-size:1.2rem">${NUC(1,1,'p')}</td></tr><tr><td>Neutron</td><td style="font-size:1.2rem">${NUC(1,0,'n')}</td></tr></table><p>In every nuclear equation the <b>mass numbers balance</b> and the <b>atomic numbers balance</b>.</p>`,
  k:`Top numbers add up the same on both sides. Bottom numbers add up the same on both sides.`},
 {t:'Alpha decay',w:{type:'steps',title:'Uranium-238 gives out an alpha particle',steps:[`Start: ${NUC(238,92,'U')} → ? + ${NUC(4,2,'He')}`,'Mass: 238 − 4 = 234','Atomic number: 92 − 2 = 90, which is thorium (Th) in the periodic table',`<b>${NUC(238,92,'U')} → ${NUC(234,90,'Th')} + ${NUC(4,2,'He')}</b>`]},
  k:`Alpha decay: mass number down 4, atomic number down 2.`},
 {t:'Beta decay',w:{type:'steps',title:'Carbon-14 gives out a beta particle',steps:[`Start: ${NUC(14,6,'C')} → ? + ${NUC(0,'−1','e')}`,'Mass: 14 − 0 = 14','Atomic number: 6 − (−1) = 7, which is nitrogen',`<b>${NUC(14,6,'C')} → ${NUC(14,7,'N')} + ${NUC(0,'−1','e')}</b>`]},
  k:`Beta decay: mass number stays the same, atomic number goes up 1. (A neutron turns into a proton.)`},
 {t:'Find the missing particle',ex:`${NUC(226,88,'Ra')} → ${NUC(222,86,'Rn')} + ?<br>Mass: 226 − 222 = 4. Atomic number: 88 − 86 = 2. So it's ${NUC(4,2,'He')}, an alpha particle.`,
  w:{type:'quiz',q:'²⁴Na (atomic number 11) decays to ²⁴Mg (atomic number 12). What is given out?',o:['Alpha','Beta','Gamma only','A proton'],a:1,x:'Mass unchanged, atomic number up by 1: beta decay.'}}
]},
{id:'t12c',name:'Half-life and uses',slides:[
 {t:'Half-life',d:['decay',8],
  h:`<p><b>Half-life</b> is the time for <b>half the nuclei</b> of a radioisotope to decay.</p><p>It's a <b>constant</b> for each isotope and isn't changed by temperature, pressure or what compound the atoms are in.</p>`},
 {t:'Watch it happen',sim:['halfLife'],h:`<p>Each press waits one half-life. You can't predict which nucleus will decay next, but you can predict how many.</p>`},
 {t:'Half-life calculations',w:{type:'steps',title:'80 g of an isotope with a half-life of 5 years. How much is left after 20 years?',steps:['Number of half-lives = 20 ÷ 5 = 4','80 → 40 → 20 → 10 → 5','<b>5 g</b> left (that is 1/16 of the start)']},
  ex:`Backwards: how long until only 12.5% remains if the half-life is 8 days?<br>100 → 50 → 25 → 12.5% is 3 half-lives = <b>24 days</b>.`},
 {t:'Dating ancient objects',h:`<p>Living things contain a steady amount of carbon-14. After death it decays with a half-life of about 5730 years, so the amount left tells us the age.</p>`,
  ex:`A bone has 25% of the carbon-14 of living bone. That's 2 half-lives: 2 × 5730 = about <b>11 460 years</b> old.`,
  fun:`Carbon dating showed that Ötzi, the "iceman" found in the Alps in 1991, lived about 5300 years ago.`},
 {t:'Choosing the right isotope',h:`<p>The type of radiation and the half-life decide what an isotope is good for.</p>`,
  w:{type:'cards',items:[['Medical tracer','Gamma (escapes the body to be detected) and short half-life (doesn\'t stay radioactive inside you)'],['Sterilising equipment','Gamma: passes through packaging and kills bacteria'],['Smoke detector','Alpha: easily stopped by smoke; long half-life so it lasts for years'],['Paper thickness gauge','Beta: partly absorbed by paper, so the reading changes with thickness']]}},
 {t:'Evaluate it',w:{type:'quiz',q:'A doctor needs an isotope to inject as a tracer. Which is best?',o:['Alpha emitter, half-life 1000 years','Gamma emitter, half-life 6 hours','Beta emitter, half-life 30 years','Gamma emitter, half-life 50 years'],a:1,x:'Gamma can be detected outside the body, and a short half-life means it soon stops being radioactive.'}}
]}],
exam:{id:'x12',name:'Chapter 12 test',questions:[
 {t:'t12a',q:`An alpha particle consists of:`,o:['one electron','two protons and two neutrons','an electromagnetic wave','one proton'],a:1},
 {t:'t12a',q:`Which radiation is stopped by a sheet of paper?`,o:['Alpha','Beta','Gamma','All three'],a:0},
 {t:'t12a',q:`In an electric field, beta particles are attracted to the:`,o:['negative plate','positive plate','neither plate','both plates'],a:1},
 {t:'t12b',q:`Thorium-234 (atomic number 90) emits a beta particle. What is the atomic number of the new nucleus?`,o:['89','90','91','88'],a:2},
 {t:'t12b',m:2,q:`Polonium-210 (atomic number 84) emits an alpha particle. Give the mass number and atomic number of the product.`,ans:`Mass number 206 [1]; atomic number 82, which is lead [1].`},
 {t:'t12c',q:`The half-life of an isotope:`,o:['halves when heated','is constant','depends on the compound','increases with time'],a:1},
 {t:'t12c',m:2,q:`An isotope has a half-life of 6 hours. What fraction remains after 24 hours? Give your answer as a decimal.`,n:0.0625,tol:0.001,x:'24 ÷ 6 = 4 half-lives. (1/2)⁴ = 1/16 = 0.0625.'},
 {t:'t12c',m:2,q:`A sample's activity falls from 400 to 50 counts per minute in 15 days. Calculate the half-life.`,n:5,u:'days',tol:0.05,x:'400 → 200 → 100 → 50 is 3 half-lives. 15 ÷ 3 = 5 days.'},
 {t:'t12c',m:2,q:`Explain why a gamma emitter with a short half-life is suitable as a medical tracer.`,ans:`Gamma passes out of the body so it can be detected [1]. A short half-life means the patient isn't exposed to radiation for long [1].`}
]}};

/* ===== Chapter 13: Chemical analysis ===== */
const CH13={id:'c13',num:13,area:2,sym:'An',name:'Chemical analysis',
blurb:`The practical toolkit: apparatus, techniques, tests for gases and ions, and how to report an experiment.`,
topics:[
{id:'t13a',name:'Apparatus and techniques',slides:[
 {t:'Know your kit',d:['apparatus'],h:`<p>You need to recognise these and know what each is for.</p>`,
  w:{type:'cards',items:[['Pipette + safety filler','Measures one fixed volume very accurately (e.g. 25.0 cm³)'],['Burette','Adds a variable volume accurately, in a titration'],['Measuring cylinder','Measures volume roughly'],['Evaporating basin','Heating a solution to leave the solid']]}},
 {t:'Filtration and the balance',d:['filter'],
  h:`<ul><li><b>Filtration</b> separates an insoluble solid (the <b>residue</b>) from a liquid (the <b>filtrate</b>).</li><li>When using a <b>balance</b>, press tare (zero) with the empty container on, then add the substance.</li></ul>`,
  w:{type:'quiz',q:'Sand and salt water are filtered. What is the filtrate?',o:['Sand','Salt water','Pure water','Salt crystals'],a:1}},
 {t:'Collecting gases',d:['gasCollect'],
  h:`<ul><li><b>Over water</b>: for gases that don't dissolve well (hydrogen, oxygen, carbon dioxide).</li><li><b>Downward displacement of air</b>: soluble gases lighter than air (ammonia).</li><li><b>Upward displacement of air</b>: soluble gases denser than air (chlorine).</li></ul>`,
  w:{type:'sort',title:'How would you collect it?',cats:['Over water','Downward displ.','Upward displ.'],items:[['Hydrogen (insoluble)',0],['Ammonia (soluble, light)',1],['Chlorine (soluble, dense)',2],['Oxygen (insoluble)',0]]}},
 {t:'Heating safely',h:`<ul><li><b>Bunsen burner</b>: yellow safety flame when not in use, blue flame for heating.</li><li><b>Electric hotplate</b>: use for <b>flammable</b> liquids like ethanol: no flame.</li></ul>`,
  w:{type:'quiz',q:'Which should you use to warm ethanol?',o:['Blue Bunsen flame','Yellow Bunsen flame','Electric hotplate','A spirit burner'],a:2}}
]},
{id:'t13b',name:'Tests and precipitation',slides:[
 {t:'Testing for gases',w:{type:'cards',items:[['Oxygen','Relights a glowing splint'],['Hydrogen','Burns with a pop with a lit splint'],['Carbon dioxide','Turns limewater cloudy (milky)'],['Tip','Splint goes at the mouth of the tube, not inside the liquid']]},
  h:`<p>Three gas tests you must know.</p>`,
  fun:`The "pop" is a tiny explosion: hydrogen and oxygen combining to make water.`},
 {t:'Flame tests',sim:['flame'],h:`<p>Many metal ions give a colour to a flame, so a flame test tells you which metal is in a compound. The colours are in the data booklet.</p>`,
  ex:`Fireworks use the same chemistry: strontium for red, barium for green, sodium for yellow, copper for blue-green.`},
 {t:'Precipitation',d:['precip'],
  h:`<p>Mix two solutions and an <b>insoluble salt</b> may form as a solid: a <b>precipitate</b>. The solubility table in the data booklet tells you when this will happen.</p>`,
  ex:`lead(II) nitrate + potassium iodide → <b>lead(II) iodide</b> (yellow precipitate) + potassium nitrate<br>silver nitrate + sodium chloride → <b>silver chloride</b> (white precipitate) + sodium nitrate`,
  k:`A precipitate can identify an ion: a white precipitate with silver nitrate shows chloride ions are present.`},
 {t:'Making an insoluble salt',w:{type:'steps',title:'Make barium sulfate',steps:['Mix barium chloride solution with sodium sulfate solution.','A white precipitate of barium sulfate forms.','Filter: the barium sulfate stays on the filter paper.','Wash it with water to remove the soluble sodium chloride.','Dry it in a warm oven.']},
  fun:`Barium sulfate is so insoluble it's safe to swallow. Patients drink a "barium meal" so their gut shows up on X-rays.`},
 {t:'Titration accuracy',h:`<p>A <b>standard solution</b> has an accurately known concentration. Titration measures volumes accurately; titres within <b>0.2 cm<sup>3</sup></b> are concordant.</p>`,
  w:{type:'quiz',q:'Titres: 18.6 (rough), 18.1, 18.5, 18.2 cm³. Which are concordant?',o:['18.6 and 18.5','18.1 and 18.2','All four','18.5 only'],a:1,x:'Only 18.1 and 18.2 are within 0.2 cm³ of each other. Average = 18.15 cm³.'}}
]},
{id:'t13c',name:'Reporting experiments',slides:[
 {t:'Tables',h:`<p>Column headings need the <b>quantity and its unit</b>. Put the thing you changed in the first column.</p><table class="t"><tr><th>Temperature (°C)</th><th>Time for cross to vanish (s)</th></tr><tr><td>20</td><td>84</td></tr><tr><td>30</td><td>45</td></tr><tr><td>40</td><td>23</td></tr></table>`,
  k:`Units go in the heading, not after every number.`},
 {t:'Graphs',d:['bestfit'],
  h:`<ul><li><b>Line or scatter graph</b> when both quantities are numbers; <b>bar graph</b> for categories.</li><li>Suitable scales using most of the grid, axis labels with units.</li><li>Plot points accurately, then draw a <b>line of best fit</b> (straight or curved), not dot to dot.</li></ul>`},
 {t:'Averages',w:{type:'steps',title:'Mean of three repeats: 2.4, 2.6 and 2.5 g',steps:['Add them: 2.4 + 2.6 + 2.5 = 7.5','Divide by the number of results: 7.5 ÷ 3','Mean = <b>2.5 g</b>']},
  k:`Repeating and averaging makes results more reliable.`},
 {t:'Evaluating and improving',w:{type:'cards',items:[['Results vary a lot','Repeat and average'],['Unfair test','Keep everything the same except one variable'],['Heat lost','Insulate, use a lid or draught shield'],['Low precision','Use more accurate apparatus, e.g. a pipette instead of a measuring cylinder']]},
  h:`<p>An improvement must say <b>what</b> to change and <b>why</b> it helps.</p>`},
 {t:'Your assignment',h:`<p>In National 5, an experiment report (the assignment) is worth 20 marks. It needs:</p><ul><li>a title and a clear aim</li><li>the chemistry behind it</li><li>your raw data, a correct table and averages</li><li>data from a website or book, with a reference</li><li>a graph with scales, labels and units</li><li>a comparison, a conclusion that matches the aim, and an evaluation</li></ul>`,
  fun:`Everything on this slide is a skill you can practise in any experiment, starting now.`}
]}],
exam:{id:'x13',name:'Chapter 13 test',questions:[

 {t:'t13a',q:`Ammonia is very soluble and less dense than air. How should it be collected?`,o:['Over water','Downward displacement of air','Upward displacement of air','In a beaker'],a:1},
 {t:'t13a',q:`The solid left in the filter paper is the:`,o:['filtrate','residue','solvent','precipitate solution'],a:1},
 {t:'t13b',q:`A gas turns limewater cloudy. It is:`,o:['oxygen','hydrogen','carbon dioxide','nitrogen'],a:2},
 {t:'t13b',q:`A gas relights a glowing splint. It is:`,o:['oxygen','hydrogen','carbon dioxide','chlorine'],a:0},
 {t:'t13b',q:`A compound gives a yellow flame. Which metal does it contain?`,o:['Potassium','Sodium','Copper','Barium'],a:1},
 {t:'t13b',q:`A precipitate is:`,o:['a gas formed in a reaction','an insoluble solid formed when two solutions react','a coloured flame','a concentrated solution'],a:1},

 {t:'t2b',m:3,q:`Magnesium oxide melts at 2852 °C. Explain, in terms of electrons and bonding, how it forms and why its melting point is so high.`,ans:`Magnesium (2,8,2) loses 2 electrons to form Mg²⁺ [1]. Oxygen gains those 2 electrons to form O²⁻ [1]. The ions are held in a lattice by strong electrostatic attraction between oppositely charged ions, which needs a lot of energy to break [1].`},
