<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--ink:#1E2B47;--ink2:#4A5878;--paper:#F6F9FC;--grid:#E1E9F2;--line:#C9D6E5;--card:#fff;
--u0:#D7263D;--u1:#F46036;--u2:#F2C14E;--u3:#6BBF59;--u4:#2E86AB;--u5:#5B3E96;--r:14px;
--font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.5;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:2.1rem;line-height:1.08;letter-spacing:-.02em;margin:.15em 0 .3em;font-weight:800}
h2{font-size:1.3rem;margin:1.8em 0 .6em;font-weight:800;line-height:1.2}
h3{font-size:1.08rem;margin:0 0 .25em}
p{margin:.45em 0}
sub,sup{line-height:0}
.sub{color:var(--ink2);font-size:.95rem}
small{display:block;color:var(--ink2);font-size:.82rem;margin-top:2px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--u4);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.85rem}
.btn.danger{border-color:var(--u0);color:var(--u0)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.back{background:none;border:0;padding:6px 0;color:var(--ink2);font-weight:700}
.back::before{content:"‹ "}
.hero{padding:8px 0 4px}
.hero-top{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:18px;border:2px solid var(--ink);flex:none;object-fit:cover}
.ind{position:relative;margin:14px 0 8px;padding-top:30px}
.scale{height:18px;border-radius:9px;border:2px solid var(--ink);background:linear-gradient(90deg,var(--u0),var(--u1) 30%,var(--u2) 50%,var(--u3) 62%,var(--u4) 80%,var(--u5))}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.mk b{background:var(--ink);color:#fff;font-size:.8rem;padding:1px 8px;border-radius:8px}
.mk::after{content:"";width:3px;height:30px;background:var(--ink);margin-top:-2px}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);margin-top:4px}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:150px}
.tile .n{font-weight:800;font-size:.95rem}
.tile .pc{position:absolute;top:10px;right:12px;font-weight:800;font-size:.85rem}
.tile .sym{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:auto}
.tile .nm{font-weight:700;font-size:.88rem;line-height:1.2}
.tile.new{border-style:dashed;background:rgba(255,255,255,.85)}
.tile:active{transform:translateY(1px)}
.chhead{display:flex;gap:14px;align-items:center;margin-top:8px}
.mini{flex:none;width:64px;height:64px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:1.6rem;background:var(--card)}
.chhead h1{margin:0;font-size:1.8rem}
.topics{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:t}
.topics li{counter-increment:t}
.trow{width:100%;text-align:left;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:12px 14px 12px 52px;position:relative;display:block}
.trow::before{content:counter(t);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.tn{display:block;font-weight:800}
.meta{display:block;font-size:.85rem;color:var(--ink2)}
.pbar{display:block;height:6px;background:var(--grid);border-radius:3px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--u4)}
.testcard,.card{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:16px;margin-top:22px}
.card{padding:10px;margin-top:0}
.slide{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:18px 18px 20px;margin-top:6px;box-shadow:4px 4px 0 var(--ink)}
.slide h2{margin:0 0 .5em;font-size:1.45rem}
.fig{margin:6px 0 12px;display:flex;justify-content:center;background:#FAFCFE;border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{height:auto;display:block}
.body ul,.body ol{padding-left:1.2em;margin:.4em 0}.body li{margin:.25em 0}
table.t{border-collapse:collapse;width:100%;font-size:.86rem;margin:.5em 0;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
table.t th{background:#EEF3F9}
.ex{border-left:5px solid var(--u4);background:#EEF6FA;padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.ex>b:first-child{display:block;color:var(--u4);margin-bottom:2px}
.key{background:#FFF6D9;border:2px dashed #D9A520;border-radius:10px;padding:8px 12px;margin-top:12px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);transform:scale(1.3)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.face{border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 4px;font-size:.75rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;line-height:1.15}
.face b{font-size:1.2rem}
.face.on{background:var(--ink);color:#fff}
.examtop{display:flex;justify-content:space-between;align-items:center}
.qbar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 10px}.qbar i{display:block;height:100%;background:var(--ink)}
.qtext{font-size:1.08rem;font-weight:600}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 12px;min-height:48px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.opt.right{background:#E6F5E2;border-color:#2F8F3A}
.opt.wrong{background:#FCE4E7;border-color:var(--u0)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.numrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.numrow input{font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;width:9em}
.err{color:var(--u0);font-weight:700;font-size:.9rem;width:100%}
textarea{width:100%;font:inherit;border:2px solid var(--ink);border-radius:12px;padding:10px;margin:12px 0 8px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:2px solid}
.fb.good{background:#E6F5E2;border-color:#2F8F3A}.fb.mid{background:#FFF6D9;border-color:#C99A1E}.fb.bad{background:#FCE4E7;border-color:var(--u0)}
.fb>b{display:block}
.next{margin-top:14px}
.result{border:2px solid var(--ink);border-radius:var(--r);padding:20px;text-align:center;margin-top:8px;box-shadow:4px 4px 0 var(--ink)}
.result .big{font-size:3.6rem;font-weight:800;line-height:1;margin:.1em 0}
.bt,.hist,.elist,.ladder{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.bt li{display:grid;grid-template-columns:1fr 70px 44px auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bt .pbar{margin:0}
.ecard{display:flex;gap:12px;justify-content:space-between;align-items:center;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:12px 14px}
.ladder .ecard{border-left-width:10px}
.ladder li:nth-child(1){border-left-color:var(--u3)}.ladder li:nth-child(2){border-left-color:var(--u4)}.ladder li:nth-child(3){border-left-color:var(--u5)}
table.pt{width:100%;border-collapse:collapse;background:var(--card);font-size:.88rem;border:1px solid var(--line)}
table.pt th,table.pt td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.pt th:not(:first-child),table.pt td:not(:first-child){width:60px;text-align:center}
.chh{margin-top:18px}
.chip{display:inline-block;border-radius:8px;padding:1px 7px;font-weight:800}
.hist li{display:grid;grid-template-columns:60px 1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.foot{margin-top:28px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(246,249,252,.95);border-top:2px solid var(--ink)}
.nav button{flex:1;max-width:200px;border:2px solid transparent;background:none;border-radius:12px;padding:8px;font-weight:800}
.nav button.on{border-color:var(--ink);background:var(--card)}
.tip{background:#FFF0E6;border-left:5px solid var(--u1);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.tip b{color:#B5441B}
.tact{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 52px}
.tact a,.res a{color:var(--u4);font-weight:700}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.watch{margin-top:14px;border:2px solid var(--line);border-radius:12px;padding:12px;background:#FBFDFF}
.watch ul{margin:.3em 0;padding-left:1.1em}.watch li{margin:.35em 0}
.res{list-style:none;padding:0;display:grid;gap:8px}.res li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gsel{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 4px;margin:2px;background:#fff;max-width:100%}
.gsel.right{border-color:#2F8F3A;background:#E6F5E2}.gsel.wrong{border-color:var(--u0);background:#FCE4E7}
.ord{display:grid;gap:6px}.ord button{text-align:left}
.ord button.right{background:#E6F5E2;border-color:#2F8F3A}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:shake .25s 2}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.fun{background:#F3EEFF;border-left:5px solid var(--u5);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.fun b{color:var(--u5)}
.wg{border:2px dashed #AFC3D8;border-radius:12px;padding:12px;margin-top:12px;background:#FBFDFF}
.wt{display:block;margin-bottom:6px}
.steps ol{margin:.3em 0 .6em;padding-left:1.3em}.steps li{margin:.35em 0;padding:6px 8px;background:#fff;border-radius:8px;border:1px solid var(--grid)}
.wx{margin-top:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card2{overflow-wrap:anywhere;hyphens:auto;border:2px solid var(--ink);border-radius:12px;background:#fff;min-height:86px;padding:10px;font-weight:800;line-height:1.25}
.card2 .b{display:none}.card2.on{background:var(--ink);color:#fff}.card2.on .f{display:none}.card2.on .b{display:block;font-weight:600;font-size:.88rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.srow>span:first-child{font-weight:700}
.sb{display:flex;gap:6px;flex-wrap:wrap}
.btn.right{background:#E6F5E2;border-color:#2F8F3A}.btn.wrong{background:#FCE4E7;border-color:var(--u0)}
.sscore{font-weight:800;margin-bottom:0}
.sim{margin-top:12px;border:2px solid var(--u4);border-radius:12px;padding:12px;background:#F5FAFD}
.sim .wt{color:var(--u4)}
.sim label{display:block;font-weight:700;font-size:.9rem;margin-top:8px}
.sim input[type=range]{width:100%;accent-color:var(--u4)}
.sim select{font:inherit;padding:6px 8px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.simrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.simout{margin-top:8px;font-size:.95rem}
.simsvg{display:flex;justify-content:center;overflow-x:auto}
.btn.on{background:var(--ink);color:#fff}
.cheer{font-size:1.4rem;font-weight:800;margin:.2em 0 0}
.areah{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.areah span{font-size:.85rem;color:var(--ink2);font-weight:700}
@media (prefers-reduced-motion:no-preference){.cheer{animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}}
@media (prefers-reduced-motion:no-preference){.anim{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}}
</style>

<body>
<main id="app" class="wrap"></main>

<script>
/* Generic SVG helpers that course diagram functions can use */
const PAL={ink:'#1E2B47',ink2:'#4A5878',line:'#9AB0C8',u0:'#D7263D',u1:'#F46036',u2:'#F2C14E',u3:'#6BBF59',u4:'#2E86AB',u5:'#5B3E96'};
const SVG=(w,h,inner,label='')=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%" role="img" aria-label="${label}" font-family="inherit" font-size="13" fill="${PAL.ink}">${inner}</svg>`;
const TX=(x,y,t,a='')=>`<text x="${x}" y="${y}" ${a}>${t}</text>`;
const BOX=(x,y,w,h,lines,fill='#fff',fs=12)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${PAL.ink}" stroke-width="2"/>`;const L=[].concat(lines),y0=y+h/2-(L.length-1)*fs*0.6+fs*0.35;L.forEach((l,i)=>s+=TX(x+w/2,y0+i*fs*1.2,l,`text-anchor="middle" font-size="${fs}" font-weight="700"`));return s;};
const MOTION=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const AN=x=>MOTION?x:'';
const SPIN=(cx,cy,dur,rev)=>AN(`<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="${rev?-360:360} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/>`);
const ARROW=(x1,y1,x2,y2,col=PAL.ink,dash='')=>{const a=Math.atan2(y2-y1,x2-x1),h=8;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}/><path d="M${x2} ${y2} L${x2-h*Math.cos(a-0.45)} ${y2-h*Math.sin(a-0.45)} L${x2-h*Math.cos(a+0.45)} ${y2-h*Math.sin(a+0.45)} Z" fill="${col}"/>`;};
</script>

<script>
/* ===== S3 Chemistry: diagram library ===== */
const CHEM = {};
CHEM.atomFrag=(cx,cy,sh,o={})=>{const r0=o.r0||40,st=o.st||26,nr=o.nr||24,er=o.er||5;let s='';
  sh.forEach((e,i)=>{const r=r0+i*st;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${PAL.line}" stroke-width="1.5"/><g>${o.still?'':SPIN(cx,cy,10+i*6,i%2)}`;
    for(let k=0;k<e;k++){const a=-Math.PI/2+2*Math.PI*k/e,x=(cx+r*Math.cos(a)).toFixed(1),y=(cy+r*Math.sin(a)).toFixed(1);
      const hi=o.hi&&i===sh.length-1&&k===e-1;s+=`<circle cx="${x}" cy="${y}" r="${er}" fill="${hi?PAL.u0:PAL.u4}"/>`;}s+='</g>';});
  return s+`<circle cx="${cx}" cy="${cy}" r="${nr}" fill="${PAL.u1}"/>`;};
CHEM.dataN=(lst)=>lst; /* placeholder for readability */

const DIAGRAMS={
atom:(sym,p,n,sh,cap)=>{const R=40+(sh.length-1)*26,W=Math.max(2*R+40,340),cx=W/2,cy=R+14,H=cy+R+34;
  let s=CHEM.atomFrag(cx,cy,sh);
  s+=TX(cx,cy-2,p+'p','text-anchor="middle" font-weight="800" fill="#fff" font-size="12"')+TX(cx,cy+12,n+'n','text-anchor="middle" font-weight="800" fill="#fff" font-size="12"');
  s+=TX(cx,H-10,cap||`${sym}  ${sh.join(',')}`,'text-anchor="middle" font-weight="700" font-size="13"');
  return SVG(W,H,s,cap||sym+' atom');},

nuclide:(sym,A,Z,charge)=>{let s=TX(162,100,sym,'font-size="76" font-weight="800" text-anchor="middle"')+TX(104,52,A,'font-size="26" font-weight="700" text-anchor="end" fill="'+PAL.u4+'"')+TX(104,104,Z,'font-size="26" font-weight="700" text-anchor="end" fill="'+PAL.u1+'"');
  if(charge)s+=TX(212,52,charge,'font-size="26" font-weight="700" fill="'+PAL.u0+'"');
  s+=TX(150,140,'Top: mass number = protons + neutrons','text-anchor="middle" font-weight="700" fill="'+PAL.u4+'"')+TX(150,160,'Bottom: atomic number = protons','text-anchor="middle" font-weight="700" fill="'+PAL.u1+'"');
  return SVG(300,170,s,'Nuclide notation for '+sym);},

isotopes:()=>{let s='';[[85,35,18],[255,37,20]].forEach(([x,A,n])=>{
  s+=TX(x,82,'Cl','font-size="56" font-weight="800" text-anchor="middle"')+TX(x-36,40,A,'font-size="22" font-weight="700" text-anchor="end" fill="'+PAL.u4+'"')+TX(x-36,82,17,'font-size="22" font-weight="700" text-anchor="end" fill="'+PAL.u1+'"');
  s+=TX(x,112,'17 protons','text-anchor="middle"')+TX(x,130,n+' neutrons','text-anchor="middle" font-weight="800" fill="'+PAL.u0+'"')+TX(x,148,'17 electrons','text-anchor="middle"');});
  s+=TX(170,62,'vs','text-anchor="middle" font-size="16" fill="'+PAL.ink2+'"');
  return SVG(340,160,s,'Chlorine-35 and chlorine-37 isotopes');},

periodic:()=>{const E=[[1,'H',1,1],[2,'He',8,1],[3,'Li',1,2],[4,'Be',2,2],[5,'B',3,2],[6,'C',4,2],[7,'N',5,2],[8,'O',6,2],[9,'F',7,2],[10,'Ne',8,2],[11,'Na',1,3],[12,'Mg',2,3],[13,'Al',3,3],[14,'Si',4,3],[15,'P',5,3],[16,'S',6,3],[17,'Cl',7,3],[18,'Ar',8,3],[19,'K',1,4],[20,'Ca',2,4]];
  const metal=new Set(['Li','Be','Na','Mg','Al','K','Ca']),fam={Li:'u1',Na:'u1',K:'u1',F:'u3',Cl:'u3',He:'u5',Ne:'u5',Ar:'u5'},S0=44,X0=30,Y0=38;let s='';
  for(let g=1;g<=8;g++)s+=TX(X0+(g-1)*S0+S0/2-2,Y0-9,g===8?'0':g,`text-anchor="middle" font-size="11" font-weight="800" fill="${PAL.ink2}"`);
  for(let p=1;p<=4;p++)s+=TX(X0-8,Y0+(p-1)*S0+S0/2+4,p,`text-anchor="end" font-size="11" font-weight="800" fill="${PAL.ink2}"`);
  E.forEach(([z,sym,g,p])=>{const x=X0+(g-1)*S0,y=Y0+(p-1)*S0,f=fam[sym]?PAL[fam[sym]]:metal.has(sym)?'#FCE3D5':'#DCEBF7',tc=(fam[sym]&&fam[sym]!=='u3')?'#fff':PAL.ink;
    s+=`<rect x="${x+1}" y="${y+1}" width="${S0-4}" height="${S0-4}" rx="4" fill="${f}" stroke="${PAL.ink}" stroke-width="1.5"/>`+TX(x+5,y+12,z,`font-size="9" fill="${tc}"`)+TX(x+S0/2-1,y+32,sym,`text-anchor="middle" font-size="16" font-weight="800" fill="${tc}"`);});
  s+=`<path d="M${X0+2*S0-1} ${Y0+S0} V${Y0+2*S0} H${X0+3*S0-1} V${Y0+4*S0}" fill="none" stroke="${PAL.u0}" stroke-width="4"/>`;
  const ly=Y0+4*S0+14,L=[[PAL.u1,'Alkali metals'],[PAL.u3,'Halogens'],[PAL.u5,'Noble gases'],['#FCE3D5','Other metals'],['#DCEBF7','Other non-metals']];
  L.forEach(([c,t],i)=>{const x=10+(i%3)*118,y=ly+Math.floor(i/3)*20;s+=`<rect x="${x}" y="${y}" width="14" height="14" rx="3" fill="${c}" stroke="${PAL.ink}"/>`+TX(x+19,y+11,t,'font-size="11"');});
  s+=`<line x1="246" y1="${ly+27}" x2="262" y2="${ly+27}" stroke="${PAL.u0}" stroke-width="4"/>`+TX(266,ly+31,'metal | non-metal','font-size="11"');
  s+=TX(X0+8*S0/2,12,'Groups across the top, periods down the side','text-anchor="middle" font-size="11" fill="'+PAL.ink2+'"');
  return SVG(X0+8*S0+8,ly+44,s,'Periodic table of the first 20 elements');},

dotcross:(lN,rN,lE,rE,pairs,cap)=>{const cy=92,R=52,xl=128,xr=208;let s=`<circle cx="${xl}" cy="${cy}" r="${R}" fill="#F3F7FB" stroke="${PAL.ink}" stroke-width="2"/><circle cx="${xr}" cy="${cy}" r="${R}" fill="none" stroke="${PAL.ink}" stroke-width="2"/>`;
  const offs=pairs===1?[0]:pairs===2?[-12,12]:[-22,0,22];
  offs.forEach(o=>{s+=`<circle cx="162" cy="${cy+o}" r="5" fill="${PAL.u4}"/>`+TX(175,cy+o+6,'×',`text-anchor="middle" font-size="18" font-weight="800" fill="${PAL.u0}"`);});
  const ang=n=>n===1?[180]:n===2?[145,215]:[130,180,230],put=(cx,a,dot)=>{let r='';[-7,7].forEach(d=>{const rad=(a+d)*Math.PI/180,x=cx+R*Math.cos(rad),y=cy-R*Math.sin(rad);r+=dot?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="5" fill="${PAL.u4}"/>`:TX(x.toFixed(1),(y+6).toFixed(1),'×',`text-anchor="middle" font-size="18" font-weight="800" fill="${PAL.u0}"`);});return r;};
  if(lE)ang(lE/2).forEach(a=>s+=put(xl,a,true));if(rE)ang(rE/2).forEach(a=>s+=put(xr,180-a,false));
  s+=TX(xl-16,cy+7,lN,'text-anchor="middle" font-size="20" font-weight="800"')+TX(xr+16,cy+7,rN,'text-anchor="middle" font-size="20" font-weight="800"');
  s+=`<circle cx="70" cy="172" r="5" fill="${PAL.u4}"/>`+TX(80,177,'electron from '+lN)+TX(196,178,'×',`font-size="18" font-weight="800" fill="${PAL.u0}"`)+TX(210,177,'electron from '+rN);
  if(cap)s+=TX(168,200,cap,'text-anchor="middle" font-weight="700"');
  return SVG(336,cap?210:190,s,cap||'Dot and cross diagram');},

shapes:()=>{const P=[
  {n:'Hydrogen chloride',f:'HCl',sh:'linear',c:['Cl',95,70,19],h:[[45,70]]},
  {n:'Water',f:'H₂O',sh:'angular (bent)',c:['O',80,58,17],h:[[42,94],[118,94]]},
  {n:'Ammonia',f:'NH₃',sh:'trigonal pyramidal',c:['N',80,52,17],h:[[38,92],[80,110],[122,92]]},
  {n:'Methane',f:'CH₄',sh:'tetrahedral',c:['C',80,66,17],h:[[80,20],[36,96],[124,96],[96,114]]}];
  let s='';P.forEach((p,i)=>{const ox=(i%2)*170,oy=Math.floor(i/2)*170,[sym,cx,cy,r]=p.c;
    p.h.forEach(([x,y])=>s+=`<line x1="${ox+cx}" y1="${oy+cy}" x2="${ox+x}" y2="${oy+y}" stroke="${PAL.ink}" stroke-width="4"/>`);
    p.h.forEach(([x,y])=>s+=`<circle cx="${ox+x}" cy="${oy+y}" r="11" fill="#fff" stroke="${PAL.ink}" stroke-width="2"/>`+TX(ox+x,oy+y+4,'H','text-anchor="middle" font-size="11" font-weight="800"'));
    s+=`<circle cx="${ox+cx}" cy="${oy+cy}" r="${r}" fill="${PAL.u4}" stroke="${PAL.ink}" stroke-width="2"/>`+TX(ox+cx,oy+cy+5,sym,'text-anchor="middle" font-size="13" font-weight="800" fill="#fff"');
    s+=TX(ox+80,oy+136,p.n,'text-anchor="middle" font-weight="800"')+TX(ox+80,oy+152,p.f,'text-anchor="middle"')+TX(ox+80,oy+168,p.sh,`text-anchor="middle" fill="${PAL.u4}" font-weight="700"`);});
  return SVG(340,350,s,'Shapes of four molecules');},

ionForm:()=>{const o={r0:14,st:12,nr:8,er:3.2,hi:true,still:true};let s='';
  s+=CHEM.atomFrag(60,60,[2,8,1],o)+TX(60,118,'Na atom 2,8,1','text-anchor="middle" font-weight="700"');
  s+=ARROW(115,60,205,60)+TX(160,50,'loses 1 e⁻','text-anchor="middle" font-size="12"');
  s+=CHEM.atomFrag(270,60,[2,8],{r0:14,st:12,nr:8,er:3.2,still:true})+TX(270,118,'Na⁺ ion 2,8','text-anchor="middle" font-weight="700"');
  s+=CHEM.atomFrag(60,200,[2,8,7],{r0:14,st:12,nr:8,er:3.2,still:true})+TX(60,258,'Cl atom 2,8,7','text-anchor="middle" font-weight="700"');
  s+=ARROW(115,200,205,200)+TX(160,190,'gains 1 e⁻','text-anchor="middle" font-size="12"');
  s+=CHEM.atomFrag(270,200,[2,8,8],o)+TX(270,258,'Cl⁻ ion 2,8,8','text-anchor="middle" font-weight="700"');
  s+=AN(`<circle r="5" fill="${PAL.u0}"><animateMotion dur="3s" repeatCount="indefinite" path="M60 22 C 140 40, 140 160, 60 162" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear"/></circle>`);
  s+=ARROW(60,126,60,156,PAL.u0,'5 4')+TX(68,145,'1 electron moves','font-size="11" fill="'+PAL.u0+'" font-weight="700"');
  return SVG(340,268,s,'Sodium gives an electron to chlorine');},

lattice:()=>{let s='';for(let r=0;r<4;r++)for(let c=0;c<6;c++){const x=30+c*46,y=26+r*46,pos=(r+c)%2===0;
  s+=`<g>${AN(`<animateTransform attributeName="transform" type="translate" values="0 0;${(r+c)%3-1} ${(r*c)%3-1};0 0" dur="${0.6+((r+c)%4)*0.15}s" repeatCount="indefinite"/>`)}`;s+=pos?`<circle cx="${x}" cy="${y}" r="12" fill="${PAL.u1}" stroke="${PAL.ink}" stroke-width="1.5"/>`+TX(x,y+5,'+','text-anchor="middle" font-size="16" font-weight="800" fill="#fff"'):`<circle cx="${x}" cy="${y}" r="18" fill="${PAL.u3}" stroke="${PAL.ink}" stroke-width="1.5"/>`+TX(x,y+6,'−','text-anchor="middle" font-size="18" font-weight="800"');s+='</g>';}
  s+=`<circle cx="40" cy="214" r="8" fill="${PAL.u1}"/>`+TX(52,218,'Na⁺')+`<circle cx="120" cy="214" r="10" fill="${PAL.u3}"/>`+TX(134,218,'Cl⁻')+TX(180,218,'every + pulls every −','font-size="12" fill="'+PAL.ink2+'"');
  return SVG(310,230,s,'Ionic lattice of sodium chloride');},

metallic:()=>{let s='',seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<34;i++){const x=(15+rnd()*290).toFixed(0),y=(15+rnd()*130).toFixed(0),dx=(rnd()*60-30).toFixed(0),dy=(rnd()*30-15).toFixed(0);s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${PAL.u4}">${AN(`<animateTransform attributeName="transform" type="translate" values="0 0;${dx} ${dy};0 0" dur="${(2+rnd()*3).toFixed(1)}s" repeatCount="indefinite"/>`)}</circle>`;}
  for(let r=0;r<3;r++)for(let c=0;c<6;c++){const x=35+c*50,y=30+r*48;s+=`<circle cx="${x}" cy="${y}" r="15" fill="${PAL.u1}" stroke="${PAL.ink}" stroke-width="1.5"/>`+TX(x,y+5,'+','text-anchor="middle" font-size="16" font-weight="800" fill="#fff"');}
  s+=TX(160,172,'Positive ions in a sea of delocalised electrons','text-anchor="middle" font-weight="700" font-size="12"');
  return SVG(320,182,s,'Metallic bonding');},

detective:()=>{let s='';const qx=4,qw=160,ax=194,aw=142,h=48;
  [[10,['Conducts as a solid?'],['Metallic','(or graphite)'],PAL.u4],[92,['Conducts when melted','or dissolved?'],['Ionic lattice'],PAL.u1],[174,['Very high melting','point?'],['Covalent network'],PAL.u5]].forEach(([y,q,a,c])=>{
    s+=BOX(qx,y,qw,h,q,'#fff')+BOX(ax,y,aw,h,a,'#fff')+`<rect x="${ax}" y="${y}" width="8" height="${h}" rx="3" fill="${c}"/>`+ARROW(qx+qw,y+h/2,ax-2,y+h/2)+TX(180,y+h/2-6,'yes','text-anchor="middle" font-size="11" font-weight="800"');
    s+=ARROW(qx+qw/2,y+h,qx+qw/2,y+h+32)+TX(qx+qw/2+8,y+h+22,'no','font-size="11" font-weight="800"');});
  s+=BOX(qx,256,qw,h,['Covalent molecular','(low melting point)'],'#fff')+`<rect x="${qx}" y="256" width="8" height="${h}" rx="3" fill="${PAL.u3}"/>`;
  return SVG(340,312,s,'Flowchart to identify a structure');},

eqWater:()=>{let s=TX(170,18,'2H₂ + O₂ → 2H₂O','text-anchor="middle" font-weight="800" font-size="15"');
  const H=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="${PAL.ink}" stroke-width="2"/>`+TX(x,y+4,'H','text-anchor="middle" font-size="10" font-weight="800"');
  const O=(x,y)=>`<circle cx="${x}" cy="${y}" r="13" fill="${PAL.u0}" stroke="${PAL.ink}" stroke-width="2"/>`+TX(x,y+5,'O','text-anchor="middle" font-size="12" font-weight="800" fill="#fff"');
  [55,95].forEach(y=>s+=H(32,y)+H(49,y));s+=TX(80,80,'+','text-anchor="middle" font-size="22" font-weight="800"')+O(110,75)+O(134,75)+ARROW(160,75,196,75);
  [50,104].forEach(y=>s+=H(232,y+13)+H(268,y+13)+O(250,y));
  s+=TX(85,140,'Left: 4 H, 2 O','text-anchor="middle" font-weight="700"')+TX(250,140,'Right: 4 H, 2 O','text-anchor="middle" font-weight="700"');
  return SVG(340,150,s,'Balanced equation for making water');},

triangle:(top,bl,br,cap)=>{let s=`<path d="M150 12 L22 170 L278 170 Z" fill="#F3F7FB" stroke="${PAL.ink}" stroke-width="2.5" stroke-linejoin="round"/><line x1="77" y1="102" x2="223" y2="102" stroke="${PAL.ink}" stroke-width="2.5"/><line x1="150" y1="102" x2="150" y2="170" stroke="${PAL.ink}" stroke-width="2.5"/>`;
  s+=TX(150,82,top,'text-anchor="middle" font-size="24" font-weight="800" fill="'+PAL.u0+'"')+TX(104,146,bl,'text-anchor="middle" font-size="24" font-weight="800" fill="'+PAL.u4+'"')+TX(198,146,br,'text-anchor="middle" font-size="24" font-weight="800" fill="'+PAL.u5+'"');
  s+=TX(150,94,'÷','text-anchor="middle" font-size="12" fill="'+PAL.ink2+'"')+TX(150,140,'×','text-anchor="middle" font-size="14" font-weight="800" fill="'+PAL.ink2+'"');
  if(cap)s+=TX(150,192,cap,'text-anchor="middle" font-weight="700"');
  return SVG(300,cap?200:180,s,'Formula triangle');},

rateGraph:(curves,marks,ylab)=>{const L=46,B=196,Rr=328,Tp=16,tmax=60,vmax=80,X=t=>L+t*(Rr-L)/tmax,Y=v=>B-v*(B-Tp)/vmax;let s='';

  for(let v=0;v<=80;v+=20)s+=`<line x1="${L}" x2="${Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3EAF2"/>`+TX(L-6,Y(v)+4,v,'text-anchor="end" font-size="11"');
  s+=`<path d="M${L} ${Tp} V${B} H${Rr}" fill="none" stroke="${PAL.ink}" stroke-width="2"/>`;
  curves.forEach(c=>{let d='';for(let t=0;t<=60;t+=1)d+=(t?'L':'M')+X(t).toFixed(1)+' '+Y(c.v*(1-Math.exp(-c.k*t))).toFixed(1)+' ';
    s+=c.dash||!MOTION?`<path d="${d}" fill="none" stroke="${c.c||PAL.u4}" stroke-width="3" ${c.dash?'stroke-dasharray="6 4"':''}/>`:`<path d="${d}" fill="none" stroke="${c.c||PAL.u4}" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.2s" fill="freeze"/></path>`;
    if(c.l)s+=TX(c.lx?X(c.lx):Rr-4,Y(c.v*(1-Math.exp(-c.k*(c.lx||60))))+(c.below?18:-7),c.l,`text-anchor="end" font-size="12" font-weight="800" fill="${c.c||PAL.u4}"`);});
  (marks||[]).forEach(t=>{const c=curves[0],v=Math.round(c.v*(1-Math.exp(-c.k*t)));s+=`<path d="M${X(t)} ${B} V${Y(v)} H${L}" fill="none" stroke="${PAL.u0}" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${X(t)}" cy="${Y(v)}" r="4.5" fill="${PAL.u0}"/>`+TX(X(t)+6,Y(v)+15,`${v} cm³ at ${t} s`,`font-size="11" font-weight="800" fill="${PAL.u0}"`);});
  s+=TX((L+Rr)/2,B+31,'Time (s)','text-anchor="middle" font-weight="700"')+`<text transform="translate(13 ${(Tp+B)/2}) rotate(-90)" text-anchor="middle" font-weight="700">${ylab||'Volume of gas (cm³)'}</text>`;

/* ===== Chapter 1: Atoms & the periodic table ===== */
const CH1={id:'c1',num:1,sym:'At',name:'Atoms & the periodic table',
blurb:`What everything is made of, what's inside an atom, and how the periodic table is organised.`,
topics:[
{id:'t1a',name:'Inside the atom',slides:[
 {t:'Everything is made of atoms',d:['atom','He',2,2,[2],'Helium: 2 protons, 2 neutrons, 2 electrons'],
  h:`<p>Your phone, your breakfast and the air you breathe are all built from about 118 kinds of atom. Each kind is an <b>element</b>.</p><p>Atoms are tiny. The full stop at the end of this sentence is roughly two million carbon atoms wide.</p>`,
  k:`An element contains only one kind of atom.`},
 {t:'Three tiny particles',
  h:`<table class="t"><tr><th>Particle</th><th>Charge</th><th>Mass</th><th>Where</th></tr><tr><td>Proton</td><td>+1</td><td>1</td><td>Nucleus</td></tr><tr><td>Neutron</td><td>0</td><td>1</td><td>Nucleus</td></tr><tr><td>Electron</td><td>−1</td><td>almost 0</td><td>Shells (energy levels) around the nucleus</td></tr></table>`,
  ex:`Imagine the atom is Hampden Park. The nucleus would be a pea on the centre spot, and the electrons would be whizzing around the top of the stands. An atom is mostly empty space.`,
  k:`Protons and neutrons are in the nucleus. Electrons are in shells outside it.`},
 {t:'Atomic number and mass number',d:['nuclide','Na',23,11],
  h:`<ul><li><b>Atomic number</b> = number of protons. It is the element's identity card: every sodium atom has 11.</li><li><b>Mass number</b> = protons + neutrons (the heavy particles).</li><li><b>Neutrons</b> = mass number − atomic number.</li></ul>`,
  ex:`Sodium, mass number 23 and atomic number 11:<br>11 protons, 11 electrons, 23 − 11 = 12 neutrons.`},
 {t:'Atoms are neutral, ions are not',
  h:`<p>In an atom, protons = electrons, so the charges cancel. An <b>ion</b> forms when an atom gains or loses electrons. Protons never change.</p>`,
  ex:`Mg<sup>2+</sup> with mass number 24 and atomic number 12: 12 protons, 12 neutrons, 10 electrons (it lost 2).<br>Cl<sup>−</sup> with mass number 35 and atomic number 17: 17 protons, 18 neutrons, 18 electrons (it gained 1).`,
  k:`Charge = protons − electrons. Lose electrons and you become positive.`}
]},
{id:'t1b',name:'Electrons and the periodic table',slides:[
 {t:'Electron shells',d:['atom','Na',11,12,[2,8,1],'Sodium  2,8,1'],
  h:`<p>Electrons fill shells from the inside out. For the first 20 elements: the first shell holds <b>2</b>, the next holds <b>8</b>, the third holds 8 before the fourth starts.</p><p>The SQA data booklet lists every arrangement, so you can always check.</p>`,
  ex:`Sodium has 11 electrons: 2 in the first shell, 8 in the second, 1 left over in the third. Written as 2,8,1.`},
 {t:'Reading the periodic table',d:['periodic'],
  h:`<ul><li><b>Groups</b> are columns. Elements in a group have the same number of outer electrons, so they react in similar ways.</li><li><b>Periods</b> are rows. The period number tells you how many shells are in use.</li></ul>`,
  ex:`Chlorine is 2,8,7. Seven outer electrons puts it in group 7. Three shells puts it in period 3.`},
 {t:'Chemical families',
  h:`<ul><li><b>Group 1, alkali metals:</b> soft metals that react quickly with water, faster as you go down.</li><li><b>Group 7, halogens:</b> reactive non-metals that exist as pairs like Cl<sub>2</sub>.</li><li><b>Group 0, noble gases:</b> full outer shell, so very unreactive. Helium fills party balloons; neon glows in signs.</li><li><b>Transition metals</b> (the middle block): often coloured compounds and useful catalysts.</li></ul>`,
  k:`The number of outer electrons decides how an element reacts.`},
 {t:'Metals and non-metals',
  h:`<p>Metals sit to the left of the staircase line on the periodic table. They are shiny and conduct electricity. Non-metals sit to the right and usually don't conduct (graphite is the famous exception).</p>`,
  ex:`Sort these: magnesium, sulfur, aluminium, bromine.<br>Metals: magnesium, aluminium. Non-metals: sulfur, bromine.`}
]},
{id:'t1c',name:'Isotopes and relative atomic mass',slides:[
 {t:'Isotopes',d:['isotopes'],
  h:`<p><b>Isotopes</b> are atoms with the same atomic number but different mass numbers. They have different numbers of neutrons.</p><p>They react the same way because they have the same electrons.</p>`,
  ex:`Think of two identical school bags, one with an extra textbook inside. Same bag, different weight.`},
 {t:'Why relative atomic mass is not a whole number',
  h:`<p><b>Relative atomic mass (RAM)</b> is the average mass of an element's atoms, taking into account how common each isotope is.</p>`,
  ex:`Chlorine's RAM is 35.5. About three quarters of chlorine atoms are Cl-35 and one quarter are Cl-37, so the average sits between them, closer to 35.`},
 {t:'Calculating RAM',
  h:`<ol><li>Multiply each mass number by its percentage.</li><li>Add the answers.</li><li>Divide by 100.</li></ol>`,
  ex:`Chlorine: 75% Cl-35 and 25% Cl-37<br>(75 × 35 + 25 × 37) ÷ 100<br>= (2625 + 925) ÷ 100 = <b>35.5</b>`,
  k:`The RAM is always closest to the most common isotope. Use that to check your answer makes sense.`},
 {t:'Reasoning with RAM',
  h:`<p>You can work backwards from a RAM to say which isotope is more common, with no calculator.</p>`,
  ex:`Bromine has isotopes Br-79 and Br-81. Its RAM is 79.9.<br>Halfway would be 80. 79.9 is just below, so Br-79 is very slightly more common.`}
]}],
exam:{id:'x1',name:'Chapter 1 test',questions:[
 {t:'t1a',q:`Which particle has no charge?`,o:['Proton','Neutron','Electron','Ion'],a:1,x:`Neutrons are neutral and sit in the nucleus with the protons.`},
 {t:'t1a',q:`An atom has atomic number 13 and mass number 27. How many neutrons does it have?`,o:['13','14','27','40'],a:1,x:`Neutrons = 27 − 13 = 14.`},
 {t:'t1a',q:`How many electrons are in a neutral atom of potassium (atomic number 19)?`,n:19,x:`In a neutral atom, electrons = protons = atomic number.`},
 {t:'t1b',q:`What is the electron arrangement of sulfur (atomic number 16)?`,o:['2,8,6','2,6,8','2,8,8','8,8'],a:0,x:`Fill from the inside: 2, then 8, then the remaining 6.`},
 {t:'t1b',q:`An element has the electron arrangement 2,8,1. Which group is it in?`,o:['Group 1','Group 2','Group 3','Group 8'],a:0,x:`One outer electron means group 1. It is sodium.`},
 {t:'t1b',q:`Why are the noble gases so unreactive?`,o:['They are gases','They have a full outer shell of electrons','They have no electrons','Their atoms are very heavy'],a:1,x:`A full outer shell is stable, so there is no need to gain, lose or share electrons.`},
 {t:'t1c',q:`Isotopes of an element have the same number of ___ but different numbers of ___.`,o:['protons, neutrons','neutrons, protons','electrons, protons','protons, electrons'],a:0,x:`Same atomic number (protons), different mass number (neutrons).`},
 {t:'t1c',m:2,q:`Boron is 20% boron-10 and 80% boron-11. Calculate its relative atomic mass.`,n:10.8,tol:0.02,x:`(20 × 10 + 80 × 11) ÷ 100 = (200 + 880) ÷ 100 = 10.8. Closer to 11 because boron-11 is more common.`},
 {t:'t1c',m:2,q:`Explain why the relative atomic mass of chlorine is 35.5 and not a whole number.`,ans:`Chlorine has more than one isotope (Cl-35 and Cl-37) [1]. The RAM is the average mass taking into account how common each isotope is; there is more Cl-35, so the average is nearer 35 [1].`},
 {t:'t1a',m:2,q:`An ion has mass number 24, atomic number 12 and a 2+ charge. State the number of protons, neutrons and electrons.`,ans:`12 protons and 12 neutrons [1]; 10 electrons, because it has lost 2 to become 2+ [1].`}
]}};

/* ===== Chapter 2: Bonding & structure ===== */
const CH2={id:'c2',num:2,sym:'Bd',name:'Bonding & structure',
blurb:`Why atoms join together, the different ways they do it, and how that explains whether something melts, dissolves or conducts.`,
topics:[
{id:'t2a',name:'Covalent bonds and molecules',slides:[
 {t:'Why atoms bond',
  h:`<p>Noble gases are stable because their outer shell is full. Other atoms bond to get the same full outer shell.</p><ul><li>Non-metal + non-metal: <b>share</b> electrons (covalent)</li><li>Metal + non-metal: <b>transfer</b> electrons (ionic)</li></ul>`,
  k:`Bonding is all about getting a full outer shell.`},
 {t:'Sharing electrons',d:['dotcross','H','H',0,0,1,'Hydrogen, H₂: one shared pair'],
  h:`<p>A <b>covalent bond</b> is a shared pair of electrons. The two positive nuclei are both attracted to the shared negative electrons, and that attraction holds the atoms together.</p>`,
  ex:`Like two people both gripping the same rope. Neither lets go, so they stay connected.`},
 {t:'Diatomic elements',d:['dotcross','Cl','Cl',6,6,1,'Chlorine, Cl₂: one shared pair'],
  h:`<p>Seven elements exist as pairs of atoms: H<sub>2</sub>, N<sub>2</sub>, O<sub>2</sub>, F<sub>2</sub>, Cl<sub>2</sub>, Br<sub>2</sub>, I<sub>2</sub>.</p><p>Memory hook: <b>HOFBrINCl</b>, say it "hof-brinkle".</p>`,
  ex:`Oxygen shares two pairs (a double bond, O=O). Nitrogen shares three pairs (a triple bond).`},
 {t:'Shapes of molecules',d:['shapes'],
  h:`<p>Molecules have definite 3D shapes. These four come up again and again.</p>`,
  ex:`The methane in a Bunsen burner is tetrahedral, like a camera tripod with one leg pointing up.`}
]},
{id:'t2b',name:'Ionic bonds',slides:[
 {t:'Making ions',d:['ionForm'],
  h:`<p>Metal atoms <b>lose</b> their outer electrons and become positive ions. Non-metal atoms <b>gain</b> electrons and become negative ions. Both end up with a noble gas arrangement.</p>`,
  k:`Metals lose, non-metals gain.`},
 {t:'The ionic bond',d:['lattice'],
  h:`<p>An <b>ionic bond</b> is the electrostatic attraction between positive and negative ions.</p><p>Ions don't form small molecules. They pack into a giant <b>ionic lattice</b>.</p>`,
  ex:`Look at table salt under a magnifying glass: the crystals are little cubes because the lattice is built in a cube pattern.`},
 {t:'Ion charges from the group',
  h:`<table class="t"><tr><th>Group</th><th>1</th><th>2</th><th>3</th><th>5</th><th>6</th><th>7</th></tr><tr><td>Ion charge</td><td>+1</td><td>+2</td><td>+3</td><td>−3</td><td>−2</td><td>−1</td></tr></table>`,
  ex:`Magnesium oxide: magnesium (group 2) forms Mg<sup>2+</sup>; oxygen (group 6) forms O<sup>2−</sup>.`}
]},
{id:'t2c',name:'Structure and properties',slides:[
 {t:'Four types of structure',
  h:`<table class="t"><tr><th>Structure</th><th>Example</th><th>Melting point</th><th>Conducts?</th></tr><tr><td>Covalent molecular</td><td>Water, CO<sub>2</sub></td><td>Low</td><td>No</td></tr><tr><td>Covalent network</td><td>Diamond, sand (SiO<sub>2</sub>)</td><td>Very high</td><td>No (graphite does)</td></tr><tr><td>Ionic lattice</td><td>Salt (NaCl)</td><td>High</td><td>Only when molten or dissolved</td></tr><tr><td>Metallic</td><td>Copper</td><td>Usually high</td><td>Yes, as a solid</td></tr></table>`},
 {t:'Covalent molecular substances',
  h:`<p>Inside each molecule the covalent bonds are strong. Between molecules the forces are weak. Melting or boiling only has to separate the molecules, so melting and boiling points are low.</p><p>They don't conduct because there are no charged particles free to move.</p>`,
  ex:`When a kettle boils, the water molecules move apart. The O–H bonds inside each molecule are not broken; steam is still H<sub>2</sub>O.`},
 {t:'Networks, lattices and metals',d:['metallic'],
  h:`<ul><li><b>Covalent network:</b> a giant web of strong covalent bonds, so very high melting point and very hard.</li><li><b>Ionic:</b> conducts when molten or dissolved because the ions are then free to move.</li><li><b>Metallic:</b> positive ions in a sea of delocalised electrons. The electrons move, so metals conduct even when solid.</li></ul>`},
 {t:'Structure detective',d:['detective'],
  h:`<p>Exam questions often give you data and ask for the structure. Work down the flowchart.</p>`,
  ex:`Melts at 801 °C, conducts only when melted or dissolved: <b>ionic lattice</b>.<br>Melts at −183 °C, never conducts: <b>covalent molecular</b>.`}
]}],
exam:{id:'x2',name:'Chapter 2 test',questions:[
 {t:'t2a',q:`What is a covalent bond?`,o:['A shared pair of electrons between two atoms','Electrons transferred from a metal to a non-metal','Attraction between positive and negative ions','Positive ions in a sea of electrons'],a:0,x:`Covalent bonds form between non-metal atoms that share a pair of electrons.`},
 {t:'t2a',q:`Which element exists as diatomic molecules?`,o:['Helium','Chlorine','Carbon','Sodium'],a:1,x:`Remember HOFBrINCl: hydrogen, oxygen, fluorine, bromine, iodine, nitrogen, chlorine.`},
 {t:'t2a',q:`What is the shape of a methane (CH₄) molecule?`,o:['Linear','Angular','Trigonal pyramidal','Tetrahedral'],a:3,x:`Four bonds spread out evenly in 3D make a tetrahedron.`},
 {t:'t2a',q:`What is the shape of a water molecule?`,o:['Linear','Angular','Tetrahedral','Trigonal pyramidal'],a:1,x:`Water is bent, which chemists call angular.`},
 {t:'t2b',q:`When magnesium forms an ion, it:`,o:['gains 2 electrons to form Mg²⁻','loses 2 electrons to form Mg²⁺','loses 2 protons','gains 2 protons'],a:1,x:`Metals lose their outer electrons. Magnesium is 2,8,2 and loses 2 to become 2,8.`},
 {t:'t2b',q:`Ionic bonding is found between:`,o:['two non-metals','a metal and a non-metal','two metals','two noble gases'],a:1,x:`The metal gives electrons to the non-metal.`},
 {t:'t2c',q:`A substance melts at 801 °C and conducts only when molten or dissolved. What is its structure?`,o:['Covalent molecular','Covalent network','Ionic lattice','Metallic'],a:2,x:`Conducting only when the ions are free to move is the giveaway.`},
 {t:'t2c',q:`A substance melts at −183 °C and does not conduct in any state. What is its structure?`,o:['Covalent molecular','Covalent network','Ionic lattice','Metallic'],a:0,x:`A very low melting point means only weak forces between molecules need to be overcome.`},
 {t:'t2c',m:2,q:`Explain why sodium chloride conducts electricity when dissolved in water but not as a solid.`,ans:`In the solid, the ions are held in fixed positions in the lattice and cannot move [1]. When dissolved, the ions are free to move and carry the charge [1].`},
 {t:'t2c',m:2,q:`Covalent bonds are strong. Explain why covalent molecular substances still have low melting points.`,ans:`Melting only overcomes the weak forces of attraction between the molecules [1]; the strong covalent bonds inside the molecules are not broken [1].`}
]}};

/* ===== Chapter 3: Formulae & the mole ===== */
const CH3={id:'c3',num:3,sym:'Mo',name:'Formulae & the mole',
blurb:`Writing chemical formulae, balancing equations, and using moles to calculate how much you need or make.`,
topics:[
{id:'t3a',name:'Writing formulae',slides:[
 {t:'Valency',
  h:`<p><b>Valency</b> is the number of bonds an atom makes. You can read it from the group.</p><table class="t"><tr><th>Group</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>0</th></tr><tr><td>Valency</td><td>1</td><td>2</td><td>3</td><td>4</td><td>3</td><td>2</td><td>1</td><td>0</td></tr></table>`,
  k:`It goes up to 4 in the middle, then back down.`},
 {t:'The SVSDF method',
  h:`<p><b>S</b>ymbols, <b>V</b>alencies, <b>S</b>wap, <b>D</b>ivide (if you can), <b>F</b>ormula.</p>`,
  ex:`Aluminium oxide: Al and O; valencies 3 and 2; swap to get Al<sub>2</sub>O<sub>3</sub>; nothing to divide. <b>Al<sub>2</sub>O<sub>3</sub></b><br><br>Magnesium oxide: Mg and O; valencies 2 and 2; swap to Mg<sub>2</sub>O<sub>2</sub>; divide by 2. <b>MgO</b>`},
 {t:'Prefixes give it away',
  h:`<p>mono = 1, di = 2, tri = 3, tetra = 4, penta = 5. When the name has a prefix, use it and ignore valency.</p>`,
  ex:`carbon monoxide CO, carbon dioxide CO<sub>2</sub>, nitrogen dioxide NO<sub>2</sub>, carbon tetrachloride CCl<sub>4</sub>`},
 {t:'Group ions and Roman numerals',
  h:`<p>Some ions are groups of atoms. They're in the data booklet: hydroxide OH<sup>−</sup>, carbonate CO<sub>3</sub><sup>2−</sup>, sulfate SO<sub>4</sub><sup>2−</sup>, nitrate NO<sub>3</sub><sup>−</sup>, ammonium NH<sub>4</sub><sup>+</sup>.</p><p>Put brackets round a group ion when you need more than one. A Roman numeral gives the valency: copper(II) has valency 2.</p>`,
  ex:`Calcium hydroxide: Ca(OH)<sub>2</sub><br>Ammonium sulfate: (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub><br>Iron(III) oxide: Fe<sub>2</sub>O<sub>3</sub>`}
]},
{id:'t3b',name:'Balanced equations',slides:[
 {t:'From words to formulae',
  h:`<p>Write the word equation, then swap each name for its formula. Watch out for the diatomic elements.</p>`,
  ex:`hydrogen + oxygen → water<br>H<sub>2</sub> + O<sub>2</sub> → H<sub>2</sub>O (not balanced yet)`},
 {t:'Why we balance',d:['eqWater'],
  h:`<p>In a reaction, atoms are rearranged. None are created or destroyed, so each side must have the same number of each kind of atom.</p><p>Only change the big numbers in front. Never change the small numbers inside a formula: that would make a different substance.</p>`},
 {t:'Balancing step by step',
  ex:`CH<sub>4</sub> + O<sub>2</sub> → CO<sub>2</sub> + H<sub>2</sub>O<br>1. Carbon: 1 on each side. Fine.<br>2. Hydrogen: 4 on the left, so make it 2H<sub>2</sub>O.<br>3. Oxygen: now 2 + 2 = 4 on the right, so make it 2O<sub>2</sub>.<br><b>CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O</b>`,
  k:`Balance oxygen and hydrogen last. They usually appear in more than one place.`},
 {t:'State symbols',
  h:`<p>(s) solid, (l) liquid, (g) gas, (aq) dissolved in water.</p>`,
  ex:`Mg(s) + 2HCl(aq) → MgCl<sub>2</sub>(aq) + H<sub>2</sub>(g)`}
]},
{id:'t3c',name:'The mole',slides:[
 {t:'Counting by weighing',
  h:`<p>Atoms are far too small to count, so chemists weigh them. One <b>mole</b> of a substance is its gram formula mass (GFM) in grams.</p><p>Find the GFM by adding the relative atomic masses from the data booklet.</p>`,
  ex:`Banks count coins by weighing the bag. Same idea.<br>GFM of CO<sub>2</sub> = 12 + (2 × 16) = 44 g`},
 {t:'Mass and moles',d:['triangle','m','n','GFM','m = n × GFM'],
  h:`<p>Cover the one you want. Mass on top, moles × GFM underneath.</p>`,
  ex:`22 g of CO<sub>2</sub>: n = 22 ÷ 44 = <b>0.5 mol</b><br>0.25 mol of NaOH (GFM 40): m = 0.25 × 40 = <b>10 g</b>`},
 {t:'Concentration',d:['triangle','n','c','V','n = c × V'],
  h:`<p>Concentration is in mol l<sup>−1</sup> (moles per litre). V must be in <b>litres</b>: divide cm<sup>3</sup> by 1000.</p>`,
  ex:`0.1 mol dissolved to make 250 cm<sup>3</sup>:<br>V = 250 ÷ 1000 = 0.25 l<br>c = 0.1 ÷ 0.25 = <b>0.4 mol l<sup>−1</sup></b>`,
  k:`Forgetting to convert cm³ to litres is the most common lost mark.`},
 {t:'Calculating from an equation',
  h:`<ol><li>Write the balanced equation.</li><li>Work out moles of what you know.</li><li>Use the mole ratio.</li><li>Convert to mass.</li></ol>`,
  ex:`What mass of CO<sub>2</sub> comes from 10 g of CaCO<sub>3</sub>?<br>CaCO<sub>3</sub> + 2HCl → CaCl<sub>2</sub> + H<sub>2</sub>O + CO<sub>2</sub><br>n(CaCO<sub>3</sub>) = 10 ÷ 100 = 0.1 mol<br>Ratio 1 : 1, so 0.1 mol CO<sub>2</sub><br>m = 0.1 × 44 = <b>4.4 g</b>`}
]}],
exam:{id:'x3',name:'Chapter 3 test',questions:[
 {t:'t3a',q:`What is the formula for aluminium oxide?`,o:['AlO','Al₂O₃','Al₃O₂','AlO₃'],a:1,x:`Valencies 3 and 2. Swap them: Al₂O₃.`},
 {t:'t3a',q:`What is the formula for carbon tetrachloride?`,o:['CCl','CCl₂','C₄Cl','CCl₄'],a:3,x:`Tetra means 4, and it belongs to the chlorine.`},
 {t:'t3a',q:`What is the formula for calcium hydroxide?`,o:['CaOH','Ca(OH)₂','Ca₂OH','CaOH₂'],a:1,x:`Calcium has valency 2 and hydroxide has valency 1. You need two hydroxides, so brackets: Ca(OH)₂.`},
 {t:'t3b',q:`Which numbers balance this equation?<br>__ H₂ + O₂ → __ H₂O`,o:['1 and 1','2 and 2','2 and 1','4 and 2'],a:1,x:`2H₂ + O₂ → 2H₂O gives 4 H and 2 O on each side.`},
 {t:'t3b',q:`Which state symbol shows a substance dissolved in water?`,o:['(s)','(l)','(g)','(aq)'],a:3,x:`aq is short for aqueous.`},
 {t:'t3c',q:`Calculate the gram formula mass of NaOH. (Na = 23, O = 16, H = 1)`,n:40,u:'g',x:`23 + 16 + 1 = 40 g.`},
 {t:'t3c',m:2,q:`How many moles are in 22 g of carbon dioxide (GFM 44 g)?`,n:0.5,u:'mol',x:`n = m ÷ GFM = 22 ÷ 44 = 0.5 mol.`},
 {t:'t3c',m:2,q:`0.1 mol of sodium chloride is dissolved to make 500 cm³ of solution. Calculate the concentration.`,n:0.2,u:'mol l⁻¹',x:`V = 500 ÷ 1000 = 0.5 l. c = 0.1 ÷ 0.5 = 0.2 mol l⁻¹.`},
 {t:'t3c',m:3,q:`CaCO₃ + 2HCl → CaCl₂ + H₂O + CO₂<br>Calculate the mass of carbon dioxide produced from 10 g of calcium carbonate. (GFM CaCO₃ = 100 g, CO₂ = 44 g)`,n:4.4,u:'g',x:`n(CaCO₃) = 10 ÷ 100 = 0.1 mol. Ratio 1:1, so 0.1 mol CO₂. Mass = 0.1 × 44 = 4.4 g.`},
 {t:'t3b',m:2,q:`Write a balanced formula equation for:<br>magnesium + hydrochloric acid → magnesium chloride + hydrogen`,ans:`Mg + 2HCl → MgCl₂ + H₂<br>1 mark for all formulae correct, 1 mark for balancing.`}
]}};
/* ===== Chapter 4: Rates of reaction ===== */
const CH4={id:'c4',num:4,sym:'Rt',name:'Rates of reaction',
blurb:`What makes reactions go faster or slower, how to measure the speed, and how to read rate graphs.`,
topics:[
{id:'t4a',name:'Collision theory',slides:[
 {t:'Reactions need collisions',
  h:`<p>For particles to react they must <b>collide</b>, and with enough energy. Anything that causes more successful collisions per second makes the reaction faster.</p>`,
  ex:`Think of dodgems. More cars on the floor, or cars going faster, means more bumps every minute.`},
 {t:'Concentration',d:['collide'],
  h:`<p>A higher concentration means more particles in the same space, so they collide more often.</p>`,
  ex:`Magnesium fizzes much faster in 2 mol l<sup>−1</sup> acid than in 0.5 mol l<sup>−1</sup> acid.`},
 {t:'Particle size',d:['surface'],
  h:`<p>Smaller pieces have a bigger <b>surface area</b>, so more particles are exposed and available to collide.</p>`,
  ex:`Chopped potatoes boil faster than whole ones. Fine flour dust in the air can even explode.`},
 {t:'Temperature',
  h:`<p>Heating makes particles move faster. They collide more often <b>and</b> more of the collisions have enough energy to react.</p>`,
  ex:`Food lasts longer in the fridge because the reactions that make it go off slow down. A glow stick shines brighter in hot water.`,
  k:`Concentration, particle size, temperature, catalyst. Four ways to change the rate.`}
]},
{id:'t4b',name:'Following a reaction',slides:[
 {t:'Measuring the rate',d:['gasSetup'],
  h:`<p>If a gas is made, you can measure its <b>volume</b> with a gas syringe (or an upturned measuring cylinder in water), or record the <b>loss of mass</b> on a balance as the gas escapes.</p>`,
  ex:`The cotton wool lets gas out but stops acid spray escaping, so only the gas affects the mass.`},
 {t:'Reading the graph',d:['rateGraph',[{v:80,k:0.0347,c:PAL.u4}]],
  h:`<ul><li><b>Steep</b> at the start: fast, lots of reactant.</li><li><b>Curving over:</b> slowing as reactants get used up.</li><li><b>Flat:</b> the reaction has stopped because one reactant has run out.</li></ul>`},
 {t:'Average rate',d:['rateGraph',[{v:80,k:0.0347,c:PAL.u4}],[20,40]],
  h:`<p>Average rate = change in quantity ÷ change in time</p>`,
  ex:`Between 20 s and 40 s:<br>(60 − 40) ÷ (40 − 20) = 20 ÷ 20 = <b>1.0 cm<sup>3</sup> s<sup>−1</sup></b>`,
  k:`Always include units: cm³ s⁻¹ for gas volume, g s⁻¹ for mass.`},
 {t:'Comparing experiments',d:['rateGraph',[{v:60,k:0.05,c:PAL.u4,l:'A: chips',lx:56,below:true},{v:60,k:0.16,c:PAL.u0,l:'B: powder',lx:28},{v:30,k:0.05,c:PAL.u5,l:'C: half the marble',lx:58}]],
  h:`<ul><li>B is steeper than A: faster. Same final volume because the same amount of marble was used.</li><li>C uses half the marble, so it makes half the gas.</li></ul>`,
  k:`Rate changes the slope. Amount of reactant changes where the line levels off.`}
]},
{id:'t4c',name:'Catalysts and energy',slides:[
 {t:'Catalysts',
  h:`<p>A <b>catalyst</b> speeds up a reaction but is not used up. It can be recovered at the end, unchanged.</p><p><b>Enzymes</b> are biological catalysts.</p>`,
  ex:`A car's catalytic converter cleans up exhaust gases. Biological washing powder uses enzymes so it works at low temperatures.`},
 {t:'Exothermic and endothermic',d:['energy','exo'],
  h:`<ul><li><b>Exothermic:</b> gives out heat, surroundings get warmer. Burning, neutralisation, hand warmers.</li><li><b>Endothermic:</b> takes in heat, surroundings get colder. Instant ice packs, photosynthesis.</li></ul>`},
 {t:'How a catalyst helps (extra)',d:['energy','exo',true],
  h:`<p>A catalyst gives the reaction an easier route with a lower energy barrier. More collisions have enough energy to get over it, so the reaction speeds up.</p><p>You'll meet this properly at Higher. It helps to picture it now.</p>`}
]}],
exam:{id:'x4',name:'Chapter 4 test',questions:[
 {t:'t4a',q:`Which change would NOT speed up the reaction between marble chips and acid?`,o:['Heating the acid','Using powder instead of chips','Adding water to the acid','Adding a catalyst'],a:2,x:`Adding water dilutes the acid, lowering its concentration, so there are fewer collisions.`},
 {t:'t4a',q:`Why does powder react faster than lumps?`,o:['It has a larger surface area, so more collisions','Powder is hotter','Powder is more concentrated','Powder has fewer particles'],a:0,x:`More exposed surface means more particles available to collide.`},
 {t:'t4a',q:`Why does increasing temperature increase the rate?`,o:['Particles move faster, collide more often and with more energy','There are more particles','A catalyst forms','The particles get bigger'],a:0,x:`Both the number of collisions and their energy go up.`},
 {t:'t4b',m:2,d:['rateGraph',[{v:80,k:0.0347,c:PAL.u4}]],q:`Use the graph. Calculate the average rate of reaction over the first 20 seconds.`,n:2,u:'cm³ s⁻¹',x:`At 20 s the volume is 40 cm³. Rate = (40 − 0) ÷ (20 − 0) = 2.0 cm³ s⁻¹.`},
 {t:'t4b',m:2,q:`30 cm³ of gas had been collected at 10 s and 50 cm³ at 30 s. Calculate the average rate between these times.`,n:1,u:'cm³ s⁻¹',x:`(50 − 30) ÷ (30 − 10) = 20 ÷ 20 = 1.0 cm³ s⁻¹.`},
 {t:'t4b',m:2,q:`The mass of a flask fell from 150.40 g to 149.80 g in 60 s. Calculate the average rate of mass loss.`,n:0.01,u:'g s⁻¹',tol:0.0005,x:`Change in mass = 0.60 g. Rate = 0.60 ÷ 60 = 0.01 g s⁻¹.`},
 {t:'t4b',q:`Why does the graph of gas volume eventually level off?`,o:['One of the reactants has been used up','The catalyst has been used up','The temperature has dropped','The gas syringe is broken'],a:0,x:`No more reactant means no more gas.`},
 {t:'t4b',q:`An experiment is repeated with the same mass of marble, but powdered. Compared with the first, the final volume of gas will be:`,o:['higher','lower','the same, reached sooner','the same, reached later'],a:2,x:`Same amount of reactant gives the same amount of gas. Powder just gets there faster.`},
 {t:'t4c',q:`A catalyst:`,o:['is used up in the reaction','speeds up a reaction and is not used up','slows down a reaction','changes what the products are'],a:1,x:`It can be recovered unchanged at the end.`},
 {t:'t4c',q:`In an exothermic reaction:`,o:['heat is given out, so the surroundings get warmer','heat is taken in, so the surroundings get colder','there is no energy change','something must be burning'],a:0,x:`Exo means out. Neutralisation is exothermic but nothing burns.`},
 {t:'t4a',m:2,q:`Using collision theory, explain why increasing the concentration of acid speeds up its reaction with magnesium.`,ans:`There are more acid particles in the same volume [1], so they collide with the magnesium more often, giving more successful collisions per second [1].`}
]}};

/* ===== Chapter 5: Acids & bases ===== */
const CH5={id:'c5',num:5,sym:'Ab',name:'Acids & bases',
blurb:`The pH scale, what makes something acidic or alkaline, neutralisation, salts and titrations.`,
topics:[
{id:'t5a',name:'The pH scale',slides:[
 {t:'The pH scale',d:['pH'],
  h:`<p>Below 7 is <b>acidic</b>, 7 is <b>neutral</b>, above 7 is <b>alkaline</b>. Universal indicator shows the pH by colour.</p>`,
  ex:`A bee sting is acidic. A wasp sting is alkaline. That's why different remedies are suggested for each.`},
 {t:'The ions behind pH',d:['ions'],
  h:`<p>Water contains a tiny number of H<sup>+</sup> and OH<sup>−</sup> ions, in equal amounts.</p><ul><li>Acids have more H<sup>+</sup> than OH<sup>−</sup>.</li><li>Alkalis have more OH<sup>−</sup> than H<sup>+</sup>.</li></ul>`,
  k:`H⁺ makes it acidic. OH⁻ makes it alkaline.`},
 {t:'Dilution',
  h:`<p>Adding water spreads the ions out. The concentration of H<sup>+</sup> in an acid falls, so its pH <b>rises towards 7</b>. An alkali's pH <b>falls towards 7</b>. Dilution never takes it past 7.</p>`,
  ex:`Like adding water to strong squash: it gets weaker and weaker but never turns into a different drink.`},
 {t:'Oxides and acid rain',
  h:`<ul><li>Non-metal oxides that dissolve make <b>acids</b>: CO<sub>2</sub> in fizzy drinks, SO<sub>2</sub> and NO<sub>2</sub> in acid rain.</li><li>Metal oxides that dissolve make <b>alkalis</b>: sodium oxide forms sodium hydroxide.</li></ul>`,
  ex:`Acid rain slowly eats away limestone and marble buildings and statues.`}
]},
{id:'t5b',name:'Neutralisation and salts',slides:[
 {t:'Neutralisation',d:['neutral'],
  h:`<p>A <b>base</b> neutralises an acid. The pH moves towards 7. The key reaction is:</p><p style="font-weight:800">H<sup>+</sup>(aq) + OH<sup>−</sup>(aq) → H<sub>2</sub>O(l)</p>`,
  ex:`Indigestion tablets neutralise extra stomach acid. Farmers spread lime to neutralise acidic soil.`},
 {t:'Three kinds of base',
  h:`<ul><li>acid + metal hydroxide → salt + water</li><li>acid + metal oxide → salt + water</li><li>acid + metal carbonate → salt + water + carbon dioxide</li></ul>`,
  ex:`hydrochloric acid + calcium carbonate → calcium chloride + water + carbon dioxide. The CO<sub>2</sub> is the fizz.`,
  k:`A soluble base is called an alkali.`},
 {t:'Naming salts',
  h:`<table class="t"><tr><th>Acid</th><th>Salt name ends</th></tr><tr><td>Hydrochloric</td><td>…chloride</td></tr><tr><td>Sulfuric</td><td>…sulfate</td></tr><tr><td>Nitric</td><td>…nitrate</td></tr></table><p>The first part of the name comes from the metal in the base.</p>`,
  ex:`nitric acid + potassium hydroxide → <b>potassium nitrate</b> + water`},
 {t:'Spectator ions',

  ex:`H<sup>+</sup> + Cl<sup>−</sup> + Na<sup>+</sup> + OH<sup>−</sup> → Na<sup>+</sup> + Cl<sup>−</sup> + H<sub>2</sub>O<br>Na<sup>+</sup> and Cl<sup>−</sup> are unchanged, so they are the spectators.`}
]},
{id:'t5c',name:'Titration',slides:[
 {t:'What a titration does',d:['titration'],

 {t:'When the ratio is not 1 : 1',

]}],

/* ===== Diagram library, part 2: carbon chemistry, metals, nuclear, analysis ===== */
CHEM.P=['','meth','eth','prop','but','pent','hex','hept','oct'];
CHEM.COL={C:PAL.ink,H:PAL.ink2,O:PAL.u0,Br:'#A0522D',Cl:'#2F8F3A',N:PAL.u4};
CHEM.draw=(atoms,bonds)=>{let s='';
  bonds.forEach(([x1,y1,x2,y2,o])=>{const L=Math.hypot(x2-x1,y2-y1),nx=-(y2-y1)/L*3.5,ny=(x2-x1)/L*3.5;(o===2?[-1,1]:o===3?[-1.6,0,1.6]:[0]).forEach(k=>s+=`<line x1="${(x1+nx*k).toFixed(1)}" y1="${(y1+ny*k).toFixed(1)}" x2="${(x2+nx*k).toFixed(1)}" y2="${(y2+ny*k).toFixed(1)}" stroke="${PAL.ink}" stroke-width="2"/>`);});
  atoms.forEach(([l,x,y])=>{const plain=l.replace(/<[^>]+>/g,''),r=plain.length>2?18:plain.length>1?13:10,c=CHEM.COL[plain.replace(/[^A-Za-z]/g,'').slice(0,2)]||CHEM.COL[plain[0]]||PAL.ink;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`+TX(x,y+5,l,`text-anchor="middle" font-weight="800" font-size="${plain==='H'?13:14}" fill="${c}"`);});
  return s;};
/* fam: 'ane' | 'ene' | 'ol' | 'oic'; sub = {carbonIndex:{u|d|l|r:'label'}}; db = carbon index where the C=C starts */
CHEM.chain=(fam,n,sub={},db=0)=>{const D=46,atoms=[],bonds=[];
  const upX=Object.values(sub).some(o=>o.u)||fam==='oic'?1:1,Y=18+0.85*D+ (Object.values(sub).some(o=>o.u&&o.u.length>2)?10:0);
  const xs=i=>18+0.85*D+i*D;
  for(let i=0;i<n;i++){const x=xs(i);atoms.push(['C',x,Y]);
    if(i<n-1)bonds.push([x,Y,xs(i+1),Y,fam==='ene'&&i===db?2:1]);
    let used=(i>0)+(i<n-1)+(fam==='ene'&&(i===db||i===db+1)?1:0);const taken=Object.assign({},sub[i]||{});
    if(i===n-1&&fam==='ol')taken.r='OH';
    if(i===n-1&&fam==='oic'){taken.u='=O';taken.r='OH';}
    Object.entries(taken).forEach(([pos,l])=>{used+=l==='=O'?2:1;});
    const order=n===1?['u','d','l','r']:i===0?['u','d','l']:i===n-1?['u','d','r']:['u','d'];
    let need=4-used;order.forEach(pos=>{if(need>0&&!taken[pos]){taken[pos]='H';need--;}});
    Object.entries(taken).forEach(([pos,l])=>{const off={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[pos],ax=x+off[0]*0.85*D,ay=Y+off[1]*0.85*D;
      if(l==='=O'){atoms.push(['O',ax,ay]);bonds.push([x,Y,ax,ay,2]);}
      else if(l==='OH'&&pos==='r'){atoms.push(['O',x+D,Y],['H',x+1.8*D,Y]);bonds.push([x,Y,x+D,Y,1],[x+D,Y,x+1.8*D,Y,1]);}
      else{const lx=x+off[0]*(l.length>2?1.05:0.85)*D,ly=Y+off[1]*(l.length>2?1:0.85)*D;atoms.push([l,lx,ly]);bonds.push([x,Y,lx,ly,1]);}});
  }
  const xmax=Math.max(...atoms.map(a=>a[1]))+22,ymax=Math.max(...atoms.map(a=>a[2]))+22;
  return {s:CHEM.draw(atoms,bonds),W:Math.max(xmax,120),H:ymax};};
CHEM.ring=n=>{const R=26+n*6,cx=R+30,cy=R+22,pts=[];for(let i=0;i<n;i++){const a=-Math.PI/2+2*Math.PI*i/n;pts.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]);}
  const bonds=pts.map((p,i)=>[...p,...pts[(i+1)%n],1]);return {s:CHEM.draw(pts.map(p=>['CH<tspan font-size="10" dy="3">2</tspan>',p[0],p[1]]),bonds),W:2*cx,H:2*cy-10};};
CHEM.name=(fam,n)=>{const p=CHEM.P[n];return fam==='ane'?p+'ane':fam==='ene'?(n<=3?p+'ene':p+'-1-ene'):fam==='cyc'?'cyclo'+p+'ane':fam==='ol'?(n<=2?p+'anol':p+'an-1-ol'):p+'anoic acid';};
CHEM.f=(...parts)=>parts.map(p=>typeof p==='number'?(p>1?`<sub>${p}</sub>`:''):p).join('');
CHEM.formula=(fam,n)=>fam==='ane'?CHEM.f('C',n,'H',2*n+2):fam==='ene'||fam==='cyc'?CHEM.f('C',n,'H',2*n):fam==='ol'?CHEM.f('C',n,'H',2*n+1,'OH'):n===1?'HCOOH':n===2?'CH<sub>3</sub>COOH':CHEM.f('C',n-1,'H',2*n-1,'COOH');
CHEM.general={ane:'C<sub>n</sub>H<sub>2n+2</sub>',ene:'C<sub>n</sub>H<sub>2n</sub>',cyc:'C<sub>n</sub>H<sub>2n</sub>',ol:'C<sub>n</sub>H<sub>2n+1</sub>OH',oic:'C<sub>n</sub>H<sub>2n+1</sub>COOH'};

Object.assign(DIAGRAMS,{
struct:(fam,n,sub,cap,db)=>{const r=fam==='cyc'?CHEM.ring(n):CHEM.chain(fam,n,sub||{},db||0),H=r.H+(cap?24:0);return SVG(r.W,H,r.s+(cap?TX(r.W/2,H-6,cap,'text-anchor="middle" font-weight="800"'):''),cap||'Structural formula');},

  s+=TX(123,192,'paper','text-anchor="middle" font-size="11" font-weight="700"')+TX(205,192,'aluminium','text-anchor="middle" font-size="11" font-weight="700"')+TX(293,192,'lead','text-anchor="middle" font-size="11" font-weight="700"');
  [['α alpha',45,118,PAL.u0],['β beta',100,198,PAL.u4],['γ gamma',155,278,PAL.u5]].forEach(([l,y,stop,c],i)=>{s+=TX(52,y-8,l,`font-size="12" font-weight="800" fill="${c}"`)+`<line x1="48" y1="${y}" x2="${stop}" y2="${y}" stroke="${c}" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>`;

radDeflect:()=>{let s=`<rect x="110" y="8" width="200" height="12" fill="${PAL.u0}"/><rect x="110" y="170" width="200" height="12" fill="${PAL.u4}"/>`+TX(320,19,'+','font-size="18" font-weight="800" fill="'+PAL.u0+'"')+TX(320,182,'−','font-size="18" font-weight="800" fill="'+PAL.u4+'"');
  s+=`<rect x="6" y="80" width="40" height="30" rx="5" fill="${PAL.ink}"/>`+TX(26,100,'☢','text-anchor="middle" font-size="16" fill="#F2C14E"');
  const P=[['M46 95 C150 95, 230 120, 310 160','α to −',PAL.u0,310,152],['M46 95 C120 95, 170 50, 230 22','β to +',PAL.u4,236,40],['M46 95 H320','γ straight',PAL.u5,250,88]];

  return SVG(340,190,s,'Radiation in an electric field');},

decay:(T)=>{T=T||8;const L=44,B=190,R=326,Tp=16,X=t=>L+t*(R-L)/(4*T),Y=p=>B-p*(B-Tp)/100;let s='',d='';
  for(let t=0;t<=4*T;t+=T)s+=TX(X(t),B+15,t,'text-anchor="middle" font-size="11"');for(let p=0;p<=100;p+=25)s+=`<line x1="${L}" x2="${R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#E3EAF2"/>`+TX(L-6,Y(p)+4,p,'text-anchor="end" font-size="11"');
  for(let t=0;t<=4*T;t+=T/10)d+=(t?'L':'M')+X(t).toFixed(1)+' '+Y(100*Math.pow(0.5,t/T)).toFixed(1)+' ';
  s+=`<path d="M${L} ${Tp} V${B} H${R}" fill="none" stroke="${PAL.ink}" stroke-width="2"/><path d="${d}" fill="none" stroke="${PAL.u5}" stroke-width="3" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${MOTION?100:0}">${AN('<animate attributeName="stroke-dashoffset" from="100" to="0" dur="2.5s" fill="freeze"/>')}</path>`;
  [[T,50],[2*T,25]].forEach(([t,p])=>s+=`<path d="M${L} ${Y(p)} H${X(t)} V${B}" fill="none" stroke="${PAL.u0}" stroke-dasharray="4 3"/>`);
  s+=TX(X(T)+5,Y(50)-6,`half-life = ${T} days`,'font-size="12" font-weight="800" fill="'+PAL.u0+'"');
  s+=TX((L+R)/2,B+31,'Time (days)','text-anchor="middle" font-weight="700"')+`<text transform="translate(13 ${(Tp+B)/2}) rotate(-90)" text-anchor="middle" font-weight="700">% remaining</text>`;
  return SVG(340,228,s,'Radioactive decay curve');},

  ['Evaporating|basin',(x,y)=>`<path d="M${x-26} ${y-6} Q${x} ${y+30} ${x+26} ${y-6} Z" fill="#fff" stroke="${PAL.ink}" stroke-width="2"/>`],

  ['Burette',(x,y)=>`<rect x="${x-5}" y="${y-34}" width="10" height="50" fill="#EAF4FB" stroke="${PAL.ink}" stroke-width="2"/><rect x="${x-9}" y="${y+16}" width="18" height="5" fill="${PAL.u1}"/><path d="M${x-2} ${y+21} L${x} ${y+30} L${x+2} ${y+21}" fill="${PAL.ink}"/>`],
  ['Thermometer',(x,y)=>`<rect x="${x-3}" y="${y-34}" width="6" height="52" rx="3" fill="#fff" stroke="${PAL.ink}" stroke-width="1.5"/><circle cx="${x}" cy="${y+22}" r="6" fill="${PAL.u0}"/><line x1="${x}" y1="${y+18}" x2="${x}" y2="${y-8}" stroke="${PAL.u0}" stroke-width="2.5"/>`],
  ['Dropper',(x,y)=>`<ellipse cx="${x}" cy="${y-22}" rx="7" ry="10" fill="${PAL.u0}"/><path d="M${x-4} ${y-12} V${y+16} L${x} ${y+26} L${x+4} ${y+16} V${y-12}" fill="#EAF4FB" stroke="${PAL.ink}" stroke-width="1.5"/>`],
  ['Delivery tube',(x,y)=>`<rect x="${x-24}" y="${y-8}" width="14" height="14" fill="#E8B48A"/><path d="M${x-17} ${y+6} V${y-20} H${x+20} V${y+22}" fill="none" stroke="${PAL.ink}" stroke-width="3"/>`],
  ['Filter paper',(x,y)=>`<circle cx="${x}" cy="${y}" r="24" fill="#F7F1E3" stroke="${PAL.ink2}" stroke-width="1.5"/><path d="M${x-24} ${y} H${x+24} M${x} ${y-24} V${y+24}" stroke="${PAL.ink2}" stroke-dasharray="3 3"/>`]];
  let s='';I.forEach(([l,f],i)=>{const x=44+(i%4)*84,y=44+Math.floor(i/4)*100;s+=f(x,y);l.split('|').forEach((t,k)=>s+=TX(x,y+44+k*12,t,'text-anchor="middle" font-size="11" font-weight="700"'));});

precip:()=>{let s=`<path d="M90 40 V180 Q90 190 100 190 H240 Q250 190 250 180 V40" fill="#F2F7FB" stroke="${PAL.ink}" stroke-width="2.5"/>`;
  let seed=5;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let i=0;i<26;i++){const x=(100+rnd()*140).toFixed(0),y0=(60+rnd()*60).toFixed(0),y1=(170+rnd()*14).toFixed(0);s+=`<circle cx="${x}" cy="${MOTION?y0:y1}" r="4" fill="#F2C94C" stroke="#C9A227">${AN(`<animate attributeName="cy" values="${y0};${y1};${y1}" keyTimes="0;0.7;1" dur="${(3+rnd()*2).toFixed(1)}s" repeatCount="indefinite"/>`)}</circle>`;}
  s+=TX(170,22,'Two clear solutions mixed','text-anchor="middle" font-weight="800"')+TX(170,212,'yellow lead(II) iodide precipitate forms','text-anchor="middle" font-size="12" font-weight="700"');
  return SVG(340,222,s,'A precipitate forming');},

bestfit:()=>{const L=46,B=186,R=326,Tp=14,X=v=>L+v*(R-L)/60,Y=v=>B-v*(B-Tp)/50;let s='';
  for(let t=0;t<=60;t+=10)s+=TX(X(t),B+15,t,'text-anchor="middle" font-size="11"');for(let v=0;v<=50;v+=10)s+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#E3EAF2"/>`+TX(L-6,Y(v)+4,v,'text-anchor="end" font-size="11"');
  s+=`<path d="M${L} ${Tp} V${B} H${R}" fill="none" stroke="${PAL.ink}" stroke-width="2"/><line x1="${X(0)}" y1="${Y(2)}" x2="${X(60)}" y2="${Y(44)}" stroke="${PAL.u4}" stroke-width="2.5"/>`;
  [[10,10],[20,15],[30,23],[40,30],[50,36],[60,46]].forEach(([x,y])=>s+=`<path d="M${X(x)-5} ${Y(y)-5} l10 10 m0 -10 l-10 10" stroke="${PAL.u0}" stroke-width="2.5"/>`);
  s+=TX((L+R)/2,B+31,'Temperature (°C)','text-anchor="middle" font-weight="700"')+`<text transform="translate(13 ${(Tp+B)/2}) rotate(-90)" text-anchor="middle" font-weight="700">Rate (relative)</text>`+TX(X(18),Y(40),'line of best fit','font-size="12" font-weight="800" fill="'+PAL.u4+'"');
  return SVG(340,224,s,'Plotted points with a line of best fit');},

dissolve:()=>{let s=`<path d="M40 30 V180 Q40 190 50 190 H290 Q300 190 300 180 V30" fill="#EAF4FB" stroke="${PAL.ink}" stroke-width="2.5"/>`;
  for(let r=0;r<3;r++)for(let c=0;c<3;c++){const pos=(r+c)%2===0,x=70+c*26,y=120+r*24,tx=150+c*48-x+(r*12),ty=60+r*40-y;s+=`<g>${AN(`<animateTransform attributeName="transform" type="translate" values="0 0;0 0;${tx} ${ty};${tx} ${ty}" keyTimes="0;0.2;0.7;1" dur="5s" repeatCount="indefinite"/>`)}<circle cx="${x}" cy="${y}" r="${pos?8:11}" fill="${pos?PAL.u1:PAL.u3}"/>${TX(x,y+4,pos?'+':'−','text-anchor="middle" font-size="12" font-weight="800"')}</g>`;}
  s+=TX(170,212,'Water pulls the lattice apart and the ions spread out','text-anchor="middle" font-size="12" font-weight="700"');
  return SVG(340,220,s,'Ionic lattice dissolving');},

pctBar:(parts,cap)=>{let s='',x=10;parts.forEach(([l,p,c])=>{const w=320*p/100;s+=`<rect x="${x}" y="20" width="${w}" height="40" fill="${c}" stroke="#fff" stroke-width="2">${AN(`<animate attributeName="width" from="0" to="${w}" dur="1s" fill="freeze"/>`)}</rect>`+(w>70?TX(x+w/2,46,`${l} ${p}%`,'text-anchor="middle" font-weight="800" fill="#fff" font-size="13"'):TX(Math.max(x+w/2,30),76,`${l} ${p}%`,`text-anchor="middle" font-weight="800" font-size="12" fill="${c}"`));x+=w;});
  if(cap)s+=TX(170,100,cap,'text-anchor="middle" font-weight="700"');return SVG(340,108,s,cap||'Percentage composition');}
});

/* ===== Interactive simulations ===== */
const SIMS={};
SIMS.atomBuilder=el=>{const EL=['','H','He','Li','Be','B','C','N','O','F','Ne','Na','Mg','Al','Si','P','S','Cl','Ar','K','Ca'],NM=['','Hydrogen','Helium','Lithium','Beryllium','Boron','Carbon','Nitrogen','Oxygen','Fluorine','Neon','Sodium','Magnesium','Aluminium','Silicon','Phosphorus','Sulfur','Chlorine','Argon','Potassium','Calcium'],NN=[0,0,2,4,5,6,6,7,8,10,10,12,12,14,14,16,16,18,22,20,20];
  const arr=n=>{const r=[];for(const c of [2,8,8,2]){if(n<=0)break;r.push(Math.min(c,n));n-=c;}return r;};let p=3,n=4,e=3;
  const draw=()=>{const ch=p-e,sh=arr(e),A=p+n,R=40+Math.max(0,sh.length-1)*26,W=Math.max(2*R+40,240),cx=W/2,cy=R+14;
    let sv=CHEM.atomFrag(cx,cy,sh)+TX(cx,cy-2,p+'p','text-anchor="middle" font-weight="800" fill="#fff" font-size="12"')+TX(cx,cy+12,n+'n','text-anchor="middle" font-weight="800" fill="#fff" font-size="12"');
    const chs=ch===0?'':(Math.abs(ch)>1?Math.abs(ch):'')+(ch>0?'+':'−');
    const note=ch===0?'Neutral atom: protons = electrons.':`An ion with charge ${chs}: it has ${ch>0?'lost':'gained'} ${Math.abs(ch)} electron${Math.abs(ch)>1?'s':''}.`;
    const iso=n===NN[p]?`This is the most common isotope of ${NM[p].toLowerCase()}.`:`This is an isotope of ${NM[p].toLowerCase()} (the most common one has ${NN[p]} neutrons).`;
    el.innerHTML=`<b class="wt">Build an atom</b><div class="simsvg">${SVG(W,2*cy+10,sv,'Your atom')}</div>
    <div class="simrow" style="justify-content:center;gap:14px"><span style="font-size:2.4rem;font-weight:800;position:relative;padding-left:26px"><span style="position:absolute;left:0;top:-2px;font-size:.9rem;color:${PAL.u4}">${A}</span><span style="position:absolute;left:0;bottom:2px;font-size:.9rem;color:${PAL.u1}">${p}</span>${EL[p]}<sup style="font-size:1rem;color:${PAL.u0}">${chs}</sup></span><span><b>${NM[p]}-${A}</b><br>Electron arrangement ${sh.join(',')||'none'}</span></div>
    ${[['Protons','p',p],['Neutrons','n',n],['Electrons','e',e]].map(([l,k,v])=>`<div class="simrow" style="justify-content:space-between"><b>${l}: ${v}</b><span><button class="btn sm" data-sb="${k}-">−</button> <button class="btn sm" data-sb="${k}+">+</button></span></div>`).join('')}
    <p class="simout">${note} ${iso} Change the protons and the element changes.</p>`;};
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-sb]');if(!b)return;const [k,op]=[b.dataset.sb[0],b.dataset.sb[1]],d=op==='+'?1:-1;
    if(k==='p'){p=Math.min(20,Math.max(1,p+d));} if(k==='n')n=Math.min(24,Math.max(0,n+d)); if(k==='e')e=Math.min(p+3,Math.max(0,e+d));draw();});draw();};

SIMS.phDilute=el=>{const COLS=['#D7263D','#E0323A','#EB4A35','#F46036','#F68A3A','#F6B03F','#F2C14E','#9BCB5B','#6BBF59','#3FA88F','#2E86AB','#3F6DB0','#4E57A8','#5B3E96','#4B2C7F'];let kind='acid',k=0;
  const draw=()=>{const ph=kind==='acid'?Math.min(1+k,7):Math.max(13-k,7),near=(kind==='acid'?1+k:13-k)!==ph||k>=6,shown=k>=6?'almost 7':ph,col=COLS[Math.round(ph)],dots=[30,14,7,4,2,1,1][Math.min(k,6)];
    let sv=`<path d="M60 20 V150 Q60 160 70 160 H190 Q200 160 200 150 V20" fill="${col}" fill-opacity="0.85" stroke="${PAL.ink}" stroke-width="2.5"/>`;let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    for(let i=0;i<dots;i++)sv+=TX((75+rnd()*105).toFixed(0),(40+rnd()*110).toFixed(0),kind==='acid'?'H⁺':'OH⁻','font-size="11" font-weight="800" fill="#fff"');
    sv+=TX(270,70,'pH','text-anchor="middle" font-size="16" font-weight="700"')+TX(270,108,shown,'text-anchor="middle" font-size="'+(k>=6?18:34)+'" font-weight="800"');
    el.innerHTML=`<b class="wt">Dilute it yourself</b><div class="simrow"><button class="btn sm ${kind==='acid'?'on':''}" data-ph="acid">Acid</button><button class="btn sm ${kind==='alkali'?'on':''}" data-ph="alkali">Alkali</button></div><div class="simsvg">${SVG(340,170,sv,'Beaker')}</div>
    <div class="simrow"><button class="btn primary sm" data-ph="water" ${k>=6?'disabled':''}>Add water (10× more dilute)</button><button class="btn sm" data-ph="reset">Start again</button></div>
    <p class="simout">${k===0?`Start: ${kind==='acid'?'lots of H⁺ ions':'lots of OH⁻ ions'}. Each tap makes the solution ten times more dilute.`:k>=6?`The pH gets ever closer to 7 but never crosses it. Water alone can't turn an ${kind} into the opposite.`:`Fewer ${kind==='acid'?'H⁺':'OH⁻'} ions in each drop, so the pH moves ${kind==='acid'?'up':'down'} towards 7.`}</p>`;};
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-ph]');if(!b||b.disabled)return;const a=b.dataset.ph;if(a==='water')k++;else if(a==='reset')k=0;else{kind=a;k=0;}draw();});draw();};

SIMS.collisions=el=>{el.innerHTML=`<b class="wt">Collision lab</b><canvas width="320" height="190" style="width:100%;max-width:340px;display:block;margin:auto;border-radius:8px;background:#fff;border:1px solid #C9D6E5"></canvas>
  <label>Temperature <input type="range" min="1" max="10" value="4" data-c="t"></label><label>Concentration <input type="range" min="4" max="40" value="12" data-c="n"></label>
  <label><input type="checkbox" data-c="cat"> Add a catalyst (lowers the energy needed)</label><p class="simout" aria-live="polite"></p>`;
  const cv=el.querySelector('canvas'),cx=cv.getContext('2d'),W=320,H=190,ps=[],flashes=[];let temp=4,N=12,cat=false,hits=0,good=0,last=performance.now(),rate=0;
  const add=()=>ps.push({x:10+Math.random()*(W-20),y:10+Math.random()*(H-60),a:Math.random()*6.28});while(ps.length<N)add();
  el.addEventListener('input',ev=>{const c=ev.target.dataset.c;if(c==='t')temp=+ev.target.value;if(c==='n'){N=+ev.target.value;while(ps.length<N)add();ps.length=N;}if(c==='cat')cat=ev.target.checked;});
  const step=now=>{if(!el.isConnected)return;const sp=0.6+temp*0.35;cx.clearRect(0,0,W,H);cx.fillStyle='#B8C2CC';cx.fillRect(0,H-22,W,22);cx.fillStyle='#4A5878';cx.font='bold 11px sans-serif';cx.fillText('magnesium',W/2-28,H-8);
    ps.forEach(p=>{p.x+=Math.cos(p.a)*sp;p.y+=Math.sin(p.a)*sp;if(p.x<6||p.x>W-6){p.a=Math.PI-p.a;p.x=Math.max(6,Math.min(W-6,p.x));}
      if(p.y<6){p.a=-p.a;p.y=6;}if(p.y>H-28){p.a=-p.a;p.y=H-28;hits++;if(Math.random()<Math.min(1,0.04+Math.pow(temp/10,2)+(cat?0.3:0))){good++;flashes.push({x:p.x,y:H-24,t:18});}}
      cx.beginPath();cx.arc(p.x,p.y,5,0,7);cx.fillStyle='#D7263D';cx.fill();});
    flashes.forEach(f=>{cx.beginPath();cx.arc(f.x,f.y,10-f.t/3,0,7);cx.fillStyle=`rgba(242,193,78,${f.t/18})`;cx.fill();f.t--;});while(flashes.length&&flashes[0].t<=0)flashes.shift();
    if(now-last>1000){rate=good;good=0;hits=0;last=now;el.querySelector('.simout').innerHTML=`<b>Successful collisions per second: ${rate}</b><br>Yellow flashes are collisions with enough energy to react. Try changing one thing at a time.`;}
    requestAnimationFrame(step);};requestAnimationFrame(step);};

insert('t1a',4,{t:'The periodic table is in atomic number order',h:`<p>Elements are arranged in order of <b>increasing atomic number</b>: hydrogen 1, helium 2, lithium 3 and so on. Every box in the data booklet's periodic table shows the atomic number.</p>`,

insert('t2c',3,{t:'Dissolving',d:['dissolve'],
  h:`<ul><li><b>Many ionic compounds dissolve in water.</b> Water molecules pull the lattice apart and surround the ions.</li><li><b>Covalent molecular substances</b> that don't dissolve in water may dissolve in other solvents.</li><li><b>Covalent networks don't dissolve</b> at all.</li></ul>`,

insert('t3a',5,{t:'Ionic formulae and network formulae',h:`<ul><li>An <b>ionic formula</b> can show the charges: sodium oxide is (Na<sup>+</sup>)<sub>2</sub>O<sup>2−</sup>; calcium hydroxide is Ca<sup>2+</sup>(OH<sup>−</sup>)<sub>2</sub>. Charges are superscript, numbers are subscript.</li><li>A <b>covalent molecular</b> formula gives the real number of atoms in one molecule: CO<sub>2</sub>.</li><li>A <b>covalent network</b> formula only gives the simplest ratio: SiO<sub>2</sub> means one silicon for every two oxygens in a giant structure.</li></ul>`,

  h:`<p><b>Percentage composition</b> tells you how much of a compound's mass comes from one element.</p><p style="font-weight:800">% = (mass of element in formula ÷ GFM) × 100</p>`,
  ex:`Water, H<sub>2</sub>O: GFM = 2 + 16 = 18<br>% hydrogen = (2 ÷ 18) × 100 = <b>11.1%</b>`},
 {t:'Worked example: fertilisers',d:['pctBar',[['N',35,PAL.u3],['H',5,PAL.u4],['O',60,PAL.u0]],'Ammonium nitrate, NH₄NO₃'],

  k:`Count every atom of the element, including ones inside brackets.`},
 {t:'Compare and choose',h:`<p>Farmers compare fertilisers by their % nitrogen. More nitrogen per kilogram means fewer bags to buy and spread.</p>`,
  ex:`Ammonium nitrate NH<sub>4</sub>NO<sub>3</sub>: 35% N<br>Urea CO(NH<sub>2</sub>)<sub>2</sub>: GFM 60, N = 28, so 46.7% N<br>Ammonium sulfate (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>: GFM 132, N = 28, so 21.2% N<br>Urea gives the most nitrogen per kilogram.`,
  w:{type:'quiz',q:'What is the % of carbon in carbon dioxide, CO₂? (C = 12, O = 16)',o:['12%','27.3%','33.3%','50%'],a:1,x:'GFM 44. (12 ÷ 44) × 100 = 27.3%.'}}
]});
