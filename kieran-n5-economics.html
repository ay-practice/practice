<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--ink:#1E2B47;--ink2:#4A5878;--paper:#F6F9FC;--grid:#E1E9F2;--line:#C9D6E5;--card:#fff;
--u0:#D7263D;--u1:#F46036;--u2:#F2C14E;--u3:#6BBF59;--u4:#2E86AB;--u5:#5B3E96;--r:14px;
--font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);font-size:17px;line-height:1.5;color:var(--ink);background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:2.1rem;line-height:1.08;letter-spacing:-.02em;margin:.15em 0 .3em;font-weight:800}
h2{font-size:1.3rem;margin:1.8em 0 .6em;font-weight:800;line-height:1.2}
h3{font-size:1.08rem;margin:0 0 .25em}
p{margin:.45em 0}
sub,sup{line-height:0}
.sub{color:var(--ink2);font-size:.95rem}
small{display:block;color:var(--ink2);font-size:.82rem;margin-top:2px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--u4);outline-offset:2px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--ink);color:#fff}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.85rem}
.btn.danger{border-color:var(--u0);color:var(--u0)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.back{background:none;border:0;padding:6px 0;color:var(--ink2);font-weight:700}
.back::before{content:"‹ "}
.hero{padding:8px 0 4px}
.hero-top{display:flex;gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:18px;border:2px solid var(--ink);flex:none;object-fit:cover}
.ind{position:relative;margin:14px 0 8px;padding-top:30px}
.scale{height:18px;border-radius:9px;border:2px solid var(--ink);background:linear-gradient(90deg,var(--u0),var(--u1) 30%,var(--u2) 50%,var(--u3) 62%,var(--u4) 80%,var(--u5))}
.mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.mk b{background:var(--ink);color:#fff;font-size:.8rem;padding:1px 8px;border-radius:8px}
.mk::after{content:"";width:3px;height:30px;background:var(--ink);margin-top:-2px}
.ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink2);margin-top:4px}
.table{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:2px solid var(--ink);border-radius:6px;background:var(--card);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:150px}
.tile .n{font-weight:800;font-size:.95rem}
.tile .pc{position:absolute;top:10px;right:12px;font-weight:800;font-size:.85rem}
.tile .sym{font-size:3rem;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:auto}
.tile .nm{font-weight:700;font-size:.88rem;line-height:1.2}
.tile.new{border-style:dashed;background:rgba(255,255,255,.85)}
.tile:active{transform:translateY(1px)}
.chhead{display:flex;gap:14px;align-items:center;margin-top:8px}
.mini{flex:none;width:64px;height:64px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:1.6rem;background:var(--card)}
.chhead h1{margin:0;font-size:1.8rem}
.topics{list-style:none;padding:0;margin:0;display:grid;gap:10px;counter-reset:t}
.topics li{counter-increment:t}
.trow{width:100%;text-align:left;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:12px 14px 12px 52px;position:relative;display:block}
.trow::before{content:counter(t);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.tn{display:block;font-weight:800}
.meta{display:block;font-size:.85rem;color:var(--ink2)}
.pbar{display:block;height:6px;background:var(--grid);border-radius:3px;margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--u4)}
.testcard,.card{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:16px;margin-top:22px}
.card{padding:10px;margin-top:0}
.slide{border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:18px 18px 20px;margin-top:6px;box-shadow:4px 4px 0 var(--ink)}
.slide h2{margin:0 0 .5em;font-size:1.45rem}
.fig{margin:6px 0 12px;display:flex;justify-content:center;background:#FAFCFE;border:1px solid var(--line);border-radius:10px;padding:8px}
.fig svg{height:auto;display:block}
.body ul,.body ol{padding-left:1.2em;margin:.4em 0}.body li{margin:.25em 0}
table.t{border-collapse:collapse;width:100%;font-size:.86rem;margin:.5em 0;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:top}
table.t th{background:#EEF3F9}
.ex{border-left:5px solid var(--u4);background:#EEF6FA;padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.ex>b:first-child{display:block;color:var(--u4);margin-bottom:2px}
.key{background:#FFF6D9;border:2px dashed #D9A520;border-radius:10px;padding:8px 12px;margin-top:12px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink);transform:scale(1.3)}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.face{border:2px solid var(--ink);border-radius:10px;background:var(--card);padding:8px 4px;font-size:.75rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;line-height:1.15}
.face b{font-size:1.2rem}
.face.on{background:var(--ink);color:#fff}
.examtop{display:flex;justify-content:space-between;align-items:center}
.qbar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden;margin:6px 0 10px}.qbar i{display:block;height:100%;background:var(--ink)}
.qtext{font-size:1.08rem;font-weight:600}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:10px 12px;min-height:48px}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.opt.right{background:#E6F5E2;border-color:#2F8F3A}
.opt.wrong{background:#FCE4E7;border-color:var(--u0)}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.numrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.numrow input{font:inherit;font-size:1.1rem;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;width:9em}
.err{color:var(--u0);font-weight:700;font-size:.9rem;width:100%}
textarea{width:100%;font:inherit;border:2px solid var(--ink);border-radius:12px;padding:10px;margin:12px 0 8px}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:2px solid}
.fb.good{background:#E6F5E2;border-color:#2F8F3A}.fb.mid{background:#FFF6D9;border-color:#C99A1E}.fb.bad{background:#FCE4E7;border-color:var(--u0)}
.fb>b{display:block}
.next{margin-top:14px}
.result{border:2px solid var(--ink);border-radius:var(--r);padding:20px;text-align:center;margin-top:8px;box-shadow:4px 4px 0 var(--ink)}
.result .big{font-size:3.6rem;font-weight:800;line-height:1;margin:.1em 0}
.bt,.hist,.elist,.ladder{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.bt li{display:grid;grid-template-columns:1fr 70px 44px auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bt .pbar{margin:0}
.ecard{display:flex;gap:12px;justify-content:space-between;align-items:center;border:2px solid var(--ink);border-radius:var(--r);background:var(--card);padding:12px 14px}
.ladder .ecard{border-left-width:10px}
.ladder li:nth-child(1){border-left-color:var(--u3)}.ladder li:nth-child(2){border-left-color:var(--u4)}.ladder li:nth-child(3){border-left-color:var(--u5)}
table.pt{width:100%;border-collapse:collapse;background:var(--card);font-size:.88rem;border:1px solid var(--line)}
table.pt th,table.pt td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.pt th:not(:first-child),table.pt td:not(:first-child){width:60px;text-align:center}
.chh{margin-top:18px}
.chip{display:inline-block;border-radius:8px;padding:1px 7px;font-weight:800}
.hist li{display:grid;grid-template-columns:60px 1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.foot{margin-top:28px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(246,249,252,.95);border-top:2px solid var(--ink)}
.nav button{flex:1;max-width:200px;border:2px solid transparent;background:none;border-radius:12px;padding:8px;font-weight:800}
.nav button.on{border-color:var(--ink);background:var(--card)}
.tip{background:#FFF0E6;border-left:5px solid var(--u1);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.tip b{color:#B5441B}
.tact{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 52px}
.tact a,.res a{color:var(--u4);font-weight:700}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.watch{margin-top:14px;border:2px solid var(--line);border-radius:12px;padding:12px;background:#FBFDFF}
.watch ul{margin:.3em 0;padding-left:1.1em}.watch li{margin:.35em 0}
.res{list-style:none;padding:0;display:grid;gap:8px}.res li{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.gsel{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:8px;padding:2px 4px;margin:2px;background:#fff;max-width:100%}
.gsel.right{border-color:#2F8F3A;background:#E6F5E2}.gsel.wrong{border-color:var(--u0);background:#FCE4E7}
.ord{display:grid;gap:6px}.ord button{text-align:left}
.ord button.right{background:#E6F5E2;border-color:#2F8F3A}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.shake{animation:shake .25s 2}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.fun{background:#F3EEFF;border-left:5px solid var(--u5);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px}
.fun b{color:var(--u5)}
.wg{border:2px dashed #AFC3D8;border-radius:12px;padding:12px;margin-top:12px;background:#FBFDFF}
.wt{display:block;margin-bottom:6px}
.steps ol{margin:.3em 0 .6em;padding-left:1.3em}.steps li{margin:.35em 0;padding:6px 8px;background:#fff;border-radius:8px;border:1px solid var(--grid)}
.wx{margin-top:8px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card2{overflow-wrap:anywhere;hyphens:auto;border:2px solid var(--ink);border-radius:12px;background:#fff;min-height:86px;padding:10px;font-weight:800;line-height:1.25}
.card2 .b{display:none}.card2.on{background:var(--ink);color:#fff}.card2.on .f{display:none}.card2.on .b{display:block;font-weight:600;font-size:.88rem}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--grid);flex-wrap:wrap}
.srow>span:first-child{font-weight:700}
.sb{display:flex;gap:6px;flex-wrap:wrap}
.btn.right{background:#E6F5E2;border-color:#2F8F3A}.btn.wrong{background:#FCE4E7;border-color:var(--u0)}
.sscore{font-weight:800;margin-bottom:0}
.sim{margin-top:12px;border:2px solid var(--u4);border-radius:12px;padding:12px;background:#F5FAFD}
.sim .wt{color:var(--u4)}
.sim label{display:block;font-weight:700;font-size:.9rem;margin-top:8px}
.sim input[type=range]{width:100%;accent-color:var(--u4)}
.sim select{font:inherit;padding:6px 8px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.simrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.simout{margin-top:8px;font-size:.95rem}
.simsvg{display:flex;justify-content:center;overflow-x:auto}
.btn.on{background:var(--ink);color:#fff}
.cheer{font-size:1.4rem;font-weight:800;margin:.2em 0 0}
.areah{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.areah span{font-size:.85rem;color:var(--ink2);font-weight:700}
@media (prefers-reduced-motion:no-preference){.cheer{animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}}
@media (prefers-reduced-motion:no-preference){.anim{animation:in .22s ease-out}@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}}

<script>
/* Generic SVG helpers that course diagram functions can use */
const PAL={ink:'#1E2B47',ink2:'#4A5878',line:'#9AB0C8',u0:'#D7263D',u1:'#F46036',u2:'#F2C14E',u3:'#6BBF59',u4:'#2E86AB',u5:'#5B3E96'};
const SVG=(w,h,inner,label='')=>`<svg viewBox="0 0 ${w} ${h}" width="${w}" style="max-width:100%" role="img" aria-label="${label}" font-family="inherit" font-size="13" fill="${PAL.ink}">${inner}</svg>`;
const TX=(x,y,t,a='')=>`<text x="${x}" y="${y}" ${a}>${t}</text>`;
const BOX=(x,y,w,h,lines,fill='#fff',fs=12)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="${fill}" stroke="${PAL.ink}" stroke-width="2"/>`;const L=[].concat(lines),y0=y+h/2-(L.length-1)*fs*0.6+fs*0.35;L.forEach((l,i)=>s+=TX(x+w/2,y0+i*fs*1.2,l,`text-anchor="middle" font-size="${fs}" font-weight="700"`));return s;};
const MOTION=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const AN=x=>MOTION?x:'';
const SPIN=(cx,cy,dur,rev)=>AN(`<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="${rev?-360:360} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/>`);
const ARROW=(x1,y1,x2,y2,col=PAL.ink,dash='')=>{const a=Math.atan2(y2-y1,x2-x1),h=8;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="2" ${dash?`stroke-dasharray="${dash}"`:''}/><path d="M${x2} ${y2} L${x2-h*Math.cos(a-0.45)} ${y2-h*Math.sin(a-0.45)} L${x2-h*Math.cos(a+0.45)} ${y2-h*Math.sin(a+0.45)} Z" fill="${col}"/>`;};
</script>

<script>
/* ===== N5 Economics: diagram library ===== */
const EC={L:58,B:196,R:322,T:22};const R_LAB=318;
EC.frame=(yl,xl,W,H)=>{const {L,B,R,T}=EC;return `<path d="M${L} ${T-6} V${B} H${R+8}" fill="none" stroke="${PAL.ink}" stroke-width="2"/>`+`<text transform="translate(18 ${(T+B)/2}) rotate(-90)" text-anchor="middle" font-weight="700">${yl||'Price (£)'}</text>`+TX((L+R)/2,B+24,xl||'Quantity','text-anchor="middle" font-weight="700"');};
EC.dLine=(dx=0,dy=0)=>{const {L,B,R,T}=EC;return [L+24+dx,T+16+dy,R-24+dx,B-16+dy];};
EC.sLine=(dx=0,dy=0)=>{const {L,B,R,T}=EC;return [L+24+dx,B-16+dy,R-24+dx,T+16+dy];};
EC.meet=(a,b)=>{const [x1,y1,x2,y2]=a,[x3,y3,x4,y4]=b,d=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4),t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/d;return [x1+t*(x2-x1),y1+t*(y2-y1)];};
EC.clip=l=>{const {L,B,R,T}=EC;let [x1,y1,x2,y2]=l,t0=0,t1=1;const dx=x2-x1,dy=y2-y1;[[-dx,x1-L-2],[dx,R+6-x1],[-dy,y1-T],[dy,B-2-y1]].forEach(([p,q])=>{if(p===0)return;const r=q/p;if(p<0)t0=Math.max(t0,r);else t1=Math.min(t1,r);});return [x1+t0*dx,y1+t0*dy,x1+t1*dx,y1+t1*dy];};
EC.line=(l0,c,lab,dash,anim)=>{const l=EC.clip(l0);return `<g>${anim||''}<line x1="${l[0]}" y1="${l[1]}" x2="${l[2]}" y2="${l[3]}" stroke="${c}" stroke-width="3" ${dash?'stroke-dasharray="6 5"':''}/>${lab?TX(Math.min(l[2]+4,R_LAB),l[3]+(l[3]>l[1]?4:10),lab,`font-weight="800" fill="${c}"`):''}</g>`;};
EC.guide=(x,y,lp,lq,c)=>{const {L,B}=EC;return `<path d="M${L} ${y} H${x} V${B}" fill="none" stroke="${c||PAL.ink2}" stroke-dasharray="4 3"/><circle cx="${x}" cy="${y}" r="4.5" fill="${c||PAL.ink}"/>`+TX(L-5,y+4,lp,`text-anchor="end" font-size="11" font-weight="800" fill="${c||PAL.ink}"`)+TX(x,EC.B+13,lq,`text-anchor="middle" font-size="11" font-weight="800" fill="${c||PAL.ink}"`);};
EC.slide=(dx,dy)=>AN(`<animateTransform attributeName="transform" type="translate" values="0 0;${dx} ${dy};${dx} ${dy};0 0" keyTimes="0;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>`);
EC.coin=(path,dur,n,c)=>{let s='';for(let i=0;i<n;i++)s+=AN(`<g><animateMotion dur="${dur}s" begin="-${(i*dur/n).toFixed(2)}s" repeatCount="indefinite" path="${path}"/><circle r="7" fill="${c||'#F2C14E'}" stroke="#B8901E"/><text y="4" text-anchor="middle" font-size="9" font-weight="800">£</text></g>`);return s;};

const DIAGRAMS={
demand:(mode)=>{let s=EC.frame();const D=EC.dLine();
  if(mode==='move'){s+=EC.line(D,PAL.u4,'D');const p1=[D[0]+(D[2]-D[0])*0.35,D[1]+(D[3]-D[1])*0.35],p2=[D[0]+(D[2]-D[0])*0.7,D[1]+(D[3]-D[1])*0.7];
    s+=EC.guide(...p1,'P1','Q1',PAL.u0)+EC.guide(...p2,'P2','Q2',PAL.u3);
    s+=AN(`<circle r="7" fill="${PAL.u5}" stroke="#fff" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.4;0.6;1" calcMode="linear" path="M${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]}"/></circle>`);
    s+=TX(150,30,'Price falls: extension','font-size="12" font-weight="800" fill="'+PAL.u3+'"')+TX(150,46,'Price rises: contraction','font-size="12" font-weight="800" fill="'+PAL.u0+'"');}
  else{const dx=mode==='left'?-60:60;s+=EC.line(D,PAL.u4,'D')+EC.line(EC.dLine(dx),PAL.u0,'D1',true,EC.slide(0,0));
    s+=ARROW(170,108,170+dx*0.7,108,PAL.u0)+TX(170+dx*0.35,98,mode==='left'?'decrease':'increase','text-anchor="middle" font-size="12" font-weight="800" fill="'+PAL.u0+'"');}
  return SVG(340,232,s,'Demand diagram');},
supply:(mode)=>{let s=EC.frame();const S=EC.sLine();
  if(mode==='move'){s+=EC.line(S,PAL.u1,'S');const p1=[S[0]+(S[2]-S[0])*0.3,S[1]+(S[3]-S[1])*0.3],p2=[S[0]+(S[2]-S[0])*0.7,S[1]+(S[3]-S[1])*0.7];
    s+=EC.guide(...p1,'P1','Q1')+EC.guide(...p2,'P2','Q2',PAL.u3)+AN(`<circle r="7" fill="${PAL.u5}" stroke="#fff" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.4;0.6;1" calcMode="linear" path="M${p1[0]} ${p1[1]} L${p2[0]} ${p2[1]}"/></circle>`)+TX(76,40,'Higher price: extension of supply','font-size="12" font-weight="800" fill="'+PAL.u3+'"');}
  else{const dx=mode==='left'?-60:60;s+=EC.line(S,PAL.u1,'S')+EC.line(EC.sLine(dx),PAL.u0,'S1',true);s+=ARROW(190,120,190+dx*0.7,120,PAL.u0)+TX(190+dx*0.35,140,mode==='left'?'decrease':'increase','text-anchor="middle" font-size="12" font-weight="800" fill="'+PAL.u0+'"');}
  return SVG(340,232,s,'Supply diagram');},
market:(dShift,sShift)=>{let s=EC.frame();const D=EC.dLine(),S=EC.sLine(),E=EC.meet(D,S);s+=EC.line(D,PAL.u4,'D')+EC.line(S,PAL.u1,'S');
  let D1=D,S1=S;if(dShift){D1=EC.dLine(dShift);s+=EC.line(D1,PAL.u4,'D1',true);}if(sShift){S1=EC.sLine(sShift);s+=EC.line(S1,PAL.u1,'S1',true);}
  s+=EC.guide(E[0],E[1],dShift||sShift?'P':'Pe',dShift||sShift?'Q':'Qe');
  if(dShift||sShift){const E1=EC.meet(D1,S1);s+=EC.guide(E1[0],E1[1],'P1','Q1',PAL.u0)+AN(`<circle r="7" fill="${PAL.u5}" stroke="#fff" stroke-width="2"><animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1;1;0" keyTimes="0;0.4;0.75;1" calcMode="linear" path="M${E[0]} ${E[1]} L${E1[0]} ${E1[1]}"/></circle>`);}
  else s+=TX(E[0]+10,E[1]-8,'equilibrium','font-size="12" font-weight="800" fill="'+PAL.u5+'"');
  return SVG(340,232,s,'Market diagram');},
gap:(above)=>{let s=EC.frame();const D=EC.dLine(),S=EC.sLine(),E=EC.meet(D,S),y=above?E[1]-45:E[1]+45,xD=D[0]+(y-D[1])*(D[2]-D[0])/(D[3]-D[1]),xS=S[0]+(y-S[1])*(S[2]-S[0])/(S[3]-S[1]);
  s+=EC.line(D,PAL.u4,'D')+EC.line(S,PAL.u1,'S')+`<line x1="${EC.L}" x2="${Math.max(xD,xS)+10}" y1="${y}" y2="${y}" stroke="${PAL.u0}" stroke-width="2.5"/>`+TX(EC.L-5,y+4,above?'P1':'P2','text-anchor="end" font-size="11" font-weight="800" fill="'+PAL.u0+'"');
  const a=Math.min(xD,xS),b=Math.max(xD,xS);s+=`<path d="M${a} ${y-14} h0 M${a} ${y-10} V${y-18} H${b} V${y-10}" fill="none" stroke="${PAL.u5}" stroke-width="2"/>`+TX((a+b)/2,y-24,above?'surplus (excess supply)':'shortage (excess demand)','text-anchor="middle" font-size="12" font-weight="800" fill="'+PAL.u5+'"');
  s+=AN(`<circle r="6" fill="${PAL.u5}"><animateMotion dur="3s" repeatCount="indefinite" path="M${(a+b)/2} ${y} L${E[0]} ${E[1]}"/></circle>`)+`<circle cx="${E[0]}" cy="${E[1]}" r="4" fill="${PAL.ink}"/>`+TX(E[0]+8,E[1]+14,'E','font-weight="800"');
  return SVG(340,232,s,above?'Surplus diagram':'Shortage diagram');},
costs:()=>{let s=EC.frame('Cost (£)','Output');const {L,B,R,T}=EC,fc=150;s+=`<line x1="${L}" x2="${R}" y1="${fc}" y2="${fc}" stroke="${PAL.u3}" stroke-width="3"/>`+TX(R-4,fc-6,'FC','text-anchor="end" font-weight="800" fill="#3E8E31"');
  s+=`<path d="M${L} ${B} L${R} ${B-120}" stroke="${PAL.u1}" stroke-width="3"/>`+TX(R-4,B-128,'VC','text-anchor="end" font-weight="800" fill="'+PAL.u1+'"')+`<path d="M${L} ${fc} L${R} ${fc-120}" stroke="${PAL.u0}" stroke-width="3"/>`+TX(R-4,fc-128,'TC','text-anchor="end" font-weight="800" fill="'+PAL.u0+'"');
  s+=ARROW(250,B-90,250,fc-90+4,PAL.ink2)+TX(256,(B+fc)/2-88,'gap = FC','font-size="11" font-weight="700"');return SVG(340,232,s,'Short-run cost curves');},
utility:()=>{const mu=[10,7,4,2,0];let s=EC.frame('Utility','Number of slices eaten');let tu=0;const pts=[];
  mu.forEach((m,i)=>{tu+=m;const x=EC.L+28+i*52,h=m*12;s+=`<rect x="${x-14}" y="${EC.B-h}" width="28" height="${h}" fill="${PAL.u1}">${AN(`<animate attributeName="height" from="0" to="${h}" dur="0.8s" begin="${i*0.3}s" fill="freeze"/><animate attributeName="y" from="${EC.B}" to="${EC.B-h}" dur="0.8s" begin="${i*0.3}s" fill="freeze"/>`)}</rect>`+TX(x,EC.B+13,i+1,'text-anchor="middle" font-size="11"');pts.push([x,EC.B-tu*5.5]);});
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${PAL.u4}" stroke-width="3"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${PAL.u4}"/>`).join('')+TX(150,30,'total utility (line)','font-weight="800" fill="'+PAL.u4+'"')+TX(150,48,'marginal utility (bars)','font-weight="800" fill="'+PAL.u1+'"');
  return SVG(340,232,s,'Total and marginal utility');},
circular:()=>{let s=BOX(10,90,110,56,['Households'],'#EAF4FB',14)+BOX(220,90,110,56,['Firms'],'#FFF6D9',14);
  s+=`<path d="M65 90 C65 30, 275 30, 275 90" fill="none" stroke="${PAL.u4}" stroke-width="3"/><path d="M275 146 C275 206, 65 206, 65 146" fill="none" stroke="${PAL.u4}" stroke-width="3"/>`;
  s+=`<path d="M95 90 C110 58, 230 58, 245 90" fill="none" stroke="#2F8F3A" stroke-width="3" stroke-dasharray="6 4"/><path d="M245 146 C230 178, 110 178, 95 146" fill="none" stroke="#2F8F3A" stroke-width="3" stroke-dasharray="6 4"/>`;
  s+=TX(170,24,'factors of production (labour…)','text-anchor="middle" font-size="11" font-weight="800" fill="'+PAL.u4+'"');
  s+=TX(170,246,'Gold £ (inner loop) = money flows:','text-anchor="middle" font-size="11" font-weight="800" fill="#2F8F3A"')+TX(170,262,'top: wages, rent, interest, profit → households','text-anchor="middle" font-size="11" fill="#2F8F3A"')+TX(170,278,'bottom: consumer spending → firms','text-anchor="middle" font-size="11" fill="#2F8F3A"')+TX(170,222,'goods and services','text-anchor="middle" font-size="11" font-weight="800" fill="'+PAL.u4+'"');
  s+=EC.coin('M245 90 C230 58, 110 58, 95 90',3,3)+EC.coin('M95 146 C110 178, 230 178, 245 146',3,3);
  s+=AN(`<circle r="5" fill="${PAL.u4}"><animateMotion dur="4s" repeatCount="indefinite" path="M65 90 C65 30, 275 30, 275 90"/></circle><circle r="5" fill="${PAL.u4}"><animateMotion dur="4s" repeatCount="indefinite" path="M275 146 C275 206, 65 206, 65 146"/></circle>`);
  return SVG(340,286,s,'Circular flow of income');},
basket:()=>{let s=`<path d="M80 110 L260 110 L240 200 L100 200 Z" fill="#E8C690" stroke="${PAL.ink}" stroke-width="2.5"/><path d="M110 110 Q170 30 230 110" fill="none" stroke="${PAL.ink}" stroke-width="5"/>`;
  [['🍞',92,96],['🥛',131,92],['⛽',170,94],['📱',209,96],['🎬',248,98]].forEach(([e,x,y],i)=>{s+=TX(x,y,e,'text-anchor="middle" font-size="26"');s+=`<g>${AN(`<animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="2s" begin="${i*0.3}s" repeatCount="indefinite"/>`)}<rect x="${x-15}" y="${y-58}" width="30" height="18" rx="4" fill="#fff" stroke="${PAL.u0}"/>${TX(x,y-45,'↑ £','text-anchor="middle" font-size="11" font-weight="800" fill="'+PAL.u0+'"')}</g>`;});
  s+=TX(170,222,'About 700 items, weighted by spending','text-anchor="middle" font-size="12" font-weight="700"');return SVG(340,230,s,'Basket of goods');},
labour:()=>{let s=`<rect x="20" y="40" width="300" height="46" fill="${PAL.u3}"/><rect x="290" y="40" width="30" height="46" fill="${PAL.u0}"/>`+TX(150,68,'Employed','text-anchor="middle" font-weight="800" fill="#fff"')+TX(320,30,'Unemployed','text-anchor="end" font-size="11" font-weight="800" fill="'+PAL.u0+'"');
  s+=`<path d="M20 96 v8 H320 v-8" fill="none" stroke="${PAL.ink}" stroke-width="2"/>`+TX(170,124,'Working population (labour force)','text-anchor="middle" font-weight="800"');
  s+=TX(170,156,'Rate = unemployed ÷ working population × 100','text-anchor="middle" font-size="12" font-weight="800" fill="'+PAL.u4+'"')+TX(170,176,'Level = the number of people unemployed','text-anchor="middle" font-size="12" font-weight="800" fill="'+PAL.u5+'"');
  return SVG(340,186,s,'Working population and unemployment');},
sectors:()=>{let s='';[['Primary','extracts raw materials','🎣 🌾 🛢️','fishing, farming, North Sea oil',PAL.u3],['Secondary','manufactures goods','🏭 🥃 🚢','whisky distilling, shipbuilding',PAL.u1],['Tertiary','provides services','🏦 🏨 💻','finance, tourism, software',PAL.u4]].forEach(([n,d,e,x,c],i)=>{const y=10+i*72;
  s+=`<rect x="8" y="${y}" width="324" height="64" rx="10" fill="#fff" stroke="${c}" stroke-width="3"/>`+TX(20,y+24,n,`font-weight="800" fill="${c}" font-size="15"`)+TX(20,y+44,d,'font-size="12"')+TX(250,y+30,e,'text-anchor="middle" font-size="22"')+TX(250,y+54,x,'text-anchor="middle" font-size="10"');});
  return SVG(340,226,s,'Sectors of industry');},
trade:()=>{let s='';

SIMS.market=el=>{let dd=0,ds=0,log=[];const EV=[['Incomes rise','d',40,'Demand increases: more people can afford it.'],['Goes out of fashion','d',-40,'Demand decreases: fewer people want it.'],['Price of a substitute falls','d',-40,'Demand decreases: buyers switch to the cheaper substitute.'],['Costs of production rise','s',-40,'Supply decreases: it is dearer to make.'],['New technology','s',40,'Supply increases: cheaper and faster to make.'],['Bad weather (crops)','s',-40,'Supply decreases: less is harvested.']];

    <p class="simout">${log.length?`<b>${log[log.length-1]}</b><br>`:'Tap an event to shift demand or supply. '}Equilibrium price <b>${w(dp)}</b>, quantity traded <b>${w(dq)}</b>. Faint lines show where you started.</p>`;};
  el.addEventListener('click',ev=>{const b=ev.target.closest('[data-mk]');if(!b)return;if(b.dataset.mk==='r'){dd=0;ds=0;log=[];}else{const e=EV[+b.dataset.mk];if(e[1]==='d')dd=Math.max(-80,Math.min(80,dd+e[2]));else ds=Math.max(-80,Math.min(80,ds+e[2]));log.push(e[3]);}draw();});draw();};

const C2={id:'c2',num:2,area:0,sym:'Bp',name:'The basic economic problem',blurb:`Unlimited wants, limited resources. Why every choice has a cost, and what we use to make things.`,
topics:[
{id:'t2a',name:'Needs, wants, scarcity and choice',vid:'basic economic problem scarcity choice opportunity cost',slides:[
 {t:'Needs and wants',h:`<ul><li><b>Needs</b> are things required for survival: food, water, shelter, clothing.</li><li><b>Wants</b> are things that make life more pleasant but aren't needed to survive: a games console, holidays, takeaways.</li></ul>`,
  w:{type:'sort',cats:['Need','Want'],items:[['Water',0],['PlayStation',1],['A warm coat',0],['Designer trainers',1],['Shelter',0],['Netflix',1]]},
  tip:`Don't just flip the definition. A want isn't "not needed for survival": it's something that makes life <b>more pleasant</b>. That was a common mistake in 2025.`},
 {t:'The basic economic problem',h:`<p>People's wants are <b>unlimited</b>, but the <b>resources</b> to satisfy them are <b>limited (scarce)</b>. So we must make <b>choices</b>.</p>`,
  ex:`Your school has £10 000. The PE department wants new kit, the library wants books, the science department wants microscopes. It can't have everything: that's scarcity forcing a choice.`},
 {t:'Opportunity cost',d:['ppf'],h:`<p><b>Opportunity cost</b> is the <b>next best alternative given up</b> when you make a choice.</p>`,
  w:{type:'steps',title:'A full opportunity cost answer has three parts',steps:['<b>The reason for the choice:</b> Kieran has £60 and can only afford one thing,','<b>the choice:</b> so he buys football boots,','<b>the opportunity cost:</b> giving up the video game he also wanted.']},
  fun:`Governments face this on a huge scale: money spent on a new railway is money not spent on hospitals or schools.`}],
 quiz:[{q:'What is the basic economic problem?',o:['Prices are too high','Unlimited wants but scarce resources','Too much money','Not enough workers'],a:1},
  {q:'Opportunity cost is:',o:['the price paid','the next best alternative given up','total cost of production','the cost of borrowing'],a:1},
  {m:2,q:'Explain the difference between a need and a want.',ans:'A need is something required for survival, e.g. food [1]. A want is something that makes life more pleasant but isn\'t needed to survive, e.g. a phone [1].'},
  {m:2,q:'A council spends £5m on a new leisure centre instead of repairing roads. Describe the opportunity cost.',ans:'The road repairs [1], the next best alternative given up because the money can only be spent once [1].'}]},
{id:'t2b',name:'Factors of production',vid:'factors of production land labour capital enterprise',slides:[
 {t:'Four factors',w:{type:'cards',items:[['Land','Natural resources: fields, oil, fish, water. Reward: rent'],['Labour','Human effort, mental and physical. Reward: wages'],['Capital','Man-made goods used to make other goods: machines, tools, factories. Reward: interest'],['Enterprise','The entrepreneur who organises the others and takes the risk. Reward: profit']]},
  h:`<p>Resources used to produce goods and services are called the <b>factors of production</b>.</p>`},
 {t:'Spot the factor',w:{type:'sort',cats:['Land','Labour','Capital','Enterprise'],items:[['North Sea oil',0],['A delivery driver',1],['A pizza oven',2],['Starting a new business',3],['Farmland',0],['A tractor',2],['A nurse',1]]},
  ex:`In a chip shop: the potatoes (land), the staff (labour), the fryer (capital) and the owner who started it (enterprise).`},
 {t:'Mobility of factors',h:`<ul><li><b>Geographical mobility:</b> how easily a factor can move place. A worker may not move from Glasgow to London because of family or housing costs.</li><li><b>Occupational mobility:</b> how easily a factor can change job. A miner may lack the skills to become a software developer without retraining.</li></ul>`,
  w:{type:'match',title:'Match the factor to its reward',pairs:[['Land','rent'],['Labour','wages'],['Capital','interest'],['Enterprise','profit']]}}],
 quiz:[{q:'Which is an example of capital?',o:['Oil','A factory machine','A teacher','Profit'],a:1},
  {q:'The reward to enterprise is:',o:['rent','wages','interest','profit'],a:3},
  {m:2,q:'Labour gets [0]; land gets [1].',g:[[['wages','profit','rent'],0],[['rent','interest','wages'],0]]},
  {m:2,q:'Describe what is meant by occupational immobility of labour.',ans:'When workers find it difficult to move from one job to another [1] because they lack the skills or qualifications needed [1].'}]}],

const C3={id:'c3',num:3,area:0,sym:'Dd',name:'Demand',blurb:`Why we buy more when things are cheaper, why the demand curve slopes down, and what shifts it.`,
topics:[
{id:'t3a',name:'Theory of demand',vid:'demand curve effective demand diminishing marginal utility',slides:[
 {t:'Effective demand',h:`<p><b>Effective demand</b> is the willingness <b>and ability</b> to buy a good at a given price, backed by money.</p>`,
  ex:`Wanting a Ferrari isn't effective demand unless you can afford one.`,
  w:{type:'tf',items:[['Wanting something you can\'t afford counts as effective demand.',false,'It must be backed by the ability to pay.'],['Effective demand is measured at a given price.',true]]}},
 {t:'Demand schedule to demand curve',h:`<table class="t"><tr><th>Price of a cinema ticket (£)</th><th>12</th><th>10</th><th>8</th><th>6</th><th>4</th></tr><tr><td>Quantity demanded per week</td><td>100</td><td>150</td><td>200</td><td>250</td><td>300</td></tr></table><p>Plot each pair to get a <b>demand curve</b>. It slopes down from left to right: as price falls, quantity demanded rises.</p>`,
  d:['demand','move'],tip:`Label axes in full: <b>Price</b> and <b>Quantity</b>, not P and Q. The examiners now expect full words.`},
 {t:'Why it slopes down',w:{type:'cards',items:[['Income effect','Lower price = your money stretches further, so you can afford more'],['Substitution effect','Lower price = it\'s cheaper than alternatives, so people switch to it'],['More people can afford it','New buyers enter the market at lower prices'],['Diminishing marginal utility','Each extra unit gives less satisfaction, so you\'ll only buy more if it\'s cheaper']]}},
 {t:'Utility',d:['utility'],h:`<ul><li><b>Total utility:</b> the total satisfaction from consuming a good.</li><li><b>Marginal utility:</b> the extra satisfaction from one more unit.</li><li><b>Diminishing marginal utility:</b> each extra unit gives less extra satisfaction than the last.</li></ul>`},
 {t:'The doughnut test',sim:['utility'],h:`<p>Eat doughnuts one at a time and watch marginal utility fall.</p>`,fun:`This is why "all you can eat" buffets make money: by the fourth plate, your marginal utility is near zero.`},
 {t:'Movement along the curve',d:['demand','move'],h:`<p>A change in the good's <b>own price</b> causes a <b>movement along</b> the demand curve:</p><ul><li>Price falls → <b>extension</b> of demand</li><li>Price rises → <b>contraction</b> of demand</li></ul>`,
  tip:`If the question says the price of the good itself changes, don't shift the curve. In 2025 many pupils drew a shift for a price rise of water bottles: it should be a contraction along the curve.`}],

  {q:'A rise in the price of the good itself causes:',o:['a shift right','a shift left','a contraction along the curve','an extension along the curve'],a:2},
  {m:2,q:'Total satisfaction is [0] utility; extra satisfaction from one more unit is [1] utility.',g:[[['total','marginal'],0],[['marginal','total'],0]]},
  {m:2,q:'Explain two reasons why the demand curve slopes downwards.',ans:'Any two [1 each]: income effect; substitution effect; more people can afford it; diminishing marginal utility (each explained).'}]},
{id:'t3b',name:'Determinants of demand',vid:'determinants of demand shifts in demand curve substitutes complements',slides:[

 {t:'Substitutes and complements',h:`<ul><li><b>Substitutes:</b> goods used instead of each other: Coke and Pepsi, bus and train.</li><li><b>Complements:</b> goods used together: games console and games, cars and petrol.</li></ul>`,
  w:{type:'sort',cats:['Substitutes','Complements'],items:[['Tea and coffee',0],['Printer and ink',1],['Apple and Samsung phones',0],['Fish and chips',1],['Netflix and Disney+',0],['Phone and phone case',1]]}},

  tip:`"Explain using a diagram": draw D and D1, label the new price/quantity, then explain in words. "Draw" alone needs only the diagram.`},

const C4={id:'c4',num:4,area:0,sym:'Cr',name:'Costs, revenue and profit',blurb:`What it costs to run a business, what comes in, and how profit is calculated.`,
topics:[
{id:'t4a',name:'Costs of production',vid:'fixed costs variable costs total costs average costs',slides:[
 {t:'Fixed and variable costs',h:`<ul><li><b>Fixed costs</b> don't change with output: rent, insurance, managers' salaries, loan repayments.</li><li><b>Variable costs</b> change directly with output: raw materials, packaging, hourly wages for production staff.</li></ul>`,
  w:{type:'sort',title:'A pizza takeaway: fixed or variable?',cats:['Fixed','Variable'],items:[['Shop rent',0],['Cheese',1],['Business insurance',0],['Pizza boxes',1],['Manager\'s salary',0],['Flour',1]]},
  tip:`Use examples that are clearly fixed or clearly variable. The examiners say not to use electricity or heating: they are partly both.`},
 {t:'Total and average costs',d:['costs'],h:`<ul><li><b>Total cost</b> = fixed costs + variable costs</li><li><b>Average cost</b> = total cost ÷ output (the cost of making one unit)</li></ul>`,
  ex:`A bakery: fixed costs £300 a week; ingredients £0.50 per loaf; makes 400 loaves.<br>Variable costs = 400 × £0.50 = £200<br>Total cost = £300 + £200 = £500<br>Average cost = £500 ÷ 400 = £1.25 per loaf`},
 {t:'Why average cost falls',h:`<p>Fixed costs get <b>spread</b> over more units as output rises, so average cost falls.</p>`,
  w:{type:'steps',title:'Fixed costs £1000, variable cost £2 each',steps:['100 units: TC = 1000 + 200 = £1200 → AC = £12','500 units: TC = 1000 + 1000 = £2000 → AC = £4','1000 units: TC = 1000 + 2000 = £3000 → AC = £3','Bigger output, lower cost per unit.']}}],
 quiz:[{q:'Which is a fixed cost for a café?',o:['Coffee beans','Milk','Rent','Takeaway cups'],a:2},
  {m:2,q:'Fixed costs £400, variable costs £600. Calculate total cost.',n:1000,u:'£'},
  {m:2,q:'Total cost £2400 for 800 units. Calculate average cost.',n:3,u:'£'},
  {m:2,q:'Describe two measures a firm could take to reduce its costs of production.',ans:'Any two [1 each]: buy raw materials in bulk/cheaper supplier; use more efficient machinery/technology; move to cheaper premises; reduce waste; train staff to be more productive.'}]},
{id:'t4b',name:'Revenue and profit',vid:'total revenue average revenue profit',slides:[
 {t:'Revenue',h:`<ul><li><b>Total sales revenue</b> = price × quantity sold</li><li><b>Average sales revenue</b> = total revenue ÷ quantity sold (equal to the price)</li></ul>`,
  ex:`A food van sells 250 burgers at £6: total revenue = £1500; average revenue = £1500 ÷ 250 = £6.`},
 {t:'Profit',h:`<p style="font-weight:800">Profit = total sales revenue − total costs</p><p>If costs are bigger than revenue, the result is a <b>loss</b>.</p>`,
  w:{type:'steps',title:'Fixed costs £300, variable cost £2.50 per burger, price £6, 250 sold',steps:['Total cost = 300 + (250 × 2.50) = 300 + 625 = £925','Total revenue = 250 × 6 = £1500','Profit = 1500 − 925 = <b>£575</b>']},
  tip:`Price is what the customer pays; cost is what the firm pays to make it. Don't say "cost to the consumer" when you mean price.`},
 {t:'Run a burger van',sim:['costs'],h:`<p>Find the number of burgers you need to sell to stop making a loss.</p>`,
  fun:`Supermarkets often make only 2–4p profit on every £1 you spend. They rely on selling huge volumes.`}],

  {q:'Average sales revenue is the same as:',o:['profit','price','fixed cost','total cost'],a:1}]}],

 {t:'t5b',m:3,q:'Describe three determinants of supply.',ans:'Technology, weather, cost of factors of production, each with an effect [1 each].'},

const C6={id:'c6',num:6,area:0,sym:'Mk',name:'Markets',blurb:`Where buyers meet sellers, how prices are set, and what happens when demand or supply change.`,
topics:[
{id:'t6a',name:'Markets and equilibrium',vid:'market equilibrium demand and supply diagram',slides:[
 {t:'What a market is',h:`<p>A <b>market</b> is anywhere buyers and sellers meet to exchange goods and services. It can be a physical place or online.</p>`,
  w:{type:'cards',items:[['Physical','Farmers\' markets, shopping centres, car showrooms'],['Online','eBay, Amazon, Vinted, ticket websites'],['Labour market','Workers sell their labour to employers'],['Commodity market','Raw materials like oil, coffee and gold']]},
  tip:`"Define the market for chocolate": where buyers and sellers of chocolate come together to exchange it. Give the definition first, then the context.`},
 {t:'Equilibrium',d:['market'],h:`<p>Where demand meets supply, the quantity buyers want equals the quantity sellers offer. This sets the <b>equilibrium price</b> and <b>quantity traded</b>. The market <b>clears</b>: nothing is left over and nobody is left wanting.</p>`,
  tip:`A "market diagram" must start with both a demand curve and a supply curve. Label axes Price and Quantity in full.`},
 {t:'Surplus and shortage',d:['gap',true],h:`<ul><li>Price <b>above</b> equilibrium → <b>surplus</b> (excess supply). Sellers cut prices to sell the extra, until equilibrium is reached.</li><li>Price <b>below</b> equilibrium → <b>shortage</b> (excess demand). Sellers raise prices; buyers compete, until equilibrium.</li></ul>`,
  ex:`Concert tickets priced too low sell out in minutes (shortage) and appear on resale sites for much more. Unsold winter coats in March go on sale (surplus).`},
 {t:'Shortage in pictures',d:['gap',false],w:{type:'gap',text:'When price is below equilibrium there is a [0], so price will [1].',g:[[['shortage','surplus'],0],[['rise','fall'],0]]}}],
 quiz:[{q:'At equilibrium:',o:['demand is greater than supply','quantity demanded equals quantity supplied','there is a surplus','price is zero'],a:1},
  {q:'If price is set above equilibrium there will be:',o:['a shortage','a surplus','equilibrium','a shift in demand'],a:1},
  {m:2,q:'Describe what is meant by a market.',ans:'Where buyers and sellers come together [1] to exchange goods and services (physically or online) [1].'},
  {m:2,q:'Explain how a surplus is removed.',ans:'Sellers reduce price to get rid of unsold stock [1]; quantity demanded extends and quantity supplied contracts until equilibrium is reached [1].'}]},
{id:'t6b',name:'Changes in demand and supply',vid:'shifts in demand and supply effect on equilibrium price',slides:[
 {t:'Demand shifts',d:['market',50,0],h:`<p>Demand increases → price <b>rises</b>, quantity traded <b>rises</b>.<br>Demand decreases → price falls, quantity falls.</p>`,
  ex:`Christmas: demand for turkeys shifts right, so price and quantity rise.`},
 {t:'Supply shifts',d:['market',0,-50],h:`<p>Supply decreases → price <b>rises</b>, quantity traded <b>falls</b>.<br>Supply increases → price falls, quantity rises.</p>`,
  ex:`A frost destroys orange crops: supply shifts left, orange juice prices rise.`},
 {t:'Market lab',sim:['market'],h:`<p>Combine a demand event and a supply event. Can you make the price go up but the quantity stay the same?</p>`},
 {t:'Predict the outcome',w:{type:'match',pairs:[['Demand ↑','price ↑, quantity ↑'],['Demand ↓','price ↓, quantity ↓'],['Supply ↑','price ↓, quantity ↑'],['Supply ↓','price ↑, quantity ↓']]},
  tip:`In "explain using a diagram" questions, mark the old and new equilibrium (P, Q and P1, Q1) and say in words what happened to both price and quantity.`}],
 quiz:[{q:'Demand for umbrellas increases in a wet summer. Equilibrium price:',o:['rises','falls','stays the same','becomes zero'],a:0},
  {q:'New technology lowers production costs of TVs. The price of TVs will:',o:['rise','fall','stay the same','double'],a:1},
  {d:['market',0,-50],q:'This diagram shows:',o:['an increase in demand','a decrease in supply','an increase in supply','a decrease in demand'],a:1},
  {m:3,q:'Explain, using a market diagram, the effect of a rise in the popularity of electric bikes.',ans:`Market diagram with D and S, D shifting right to D1 [1]; new equilibrium shows higher price P1 and quantity Q1 [1]; explanation: more people want them at every price, so price and quantity traded rise [1].${DIAGRAMS.market(50,0)}`}]}],
exam:{id:'x6',name:'Chapter 6 test',questions:[

 {t:'t6a',q:'Below the equilibrium price there is:',o:['excess supply','excess demand','equilibrium','no market'],a:1},

 {t:'t6b',m:3,q:'Explain, using a market diagram, the effect of bad weather on the market for coffee.',ans:`Supply shifts left [1]; new equilibrium at higher price and lower quantity, labelled [1]; explanation that less coffee is harvested so it is scarcer [1].${DIAGRAMS.market(0,-50)}`},

const C7={id:'c7',num:7,area:1,sym:'Gf',name:'Government finance',blurb:`Where the government's money comes from, what it spends it on, and how money flows round the economy.`,
topics:[
{id:'t7a',name:'Taxation',vid:'direct and indirect taxes UK',slides:[
 {t:'Direct and indirect taxes',h:`<ul><li><b>Direct taxes</b> are taken directly from income or wealth: Income Tax, National Insurance, Corporation Tax (on company profits), Council Tax.</li><li><b>Indirect taxes</b> are added to the price of goods and services: VAT, excise duties on fuel, alcohol and tobacco.</li></ul>`,
  w:{type:'sort',cats:['Direct','Indirect'],items:[['Income Tax',0],['VAT',1],['Corporation Tax',0],['Fuel duty',1],['National Insurance',0],['Tax on cigarettes',1]]},
  tip:`"Distinguish between" questions need both sides with an example: "A direct tax is taken from income, e.g. Income Tax, whereas an indirect tax is added to spending, e.g. VAT."`},
 {t:'Why tax?',h:`<ul><li>To <b>raise income</b> to pay for public services.</li><li>To <b>redistribute income</b> from richer to poorer people.</li><li>To <b>discourage</b> harmful goods (taxes on tobacco, sugary drinks).</li></ul>`,
  fun:`Income Tax in Scotland has different rates and bands from the rest of the UK, because the Scottish Parliament sets them.`,
  ex:`A higher earner pays a bigger share of their income in Income Tax: that's redistribution. But VAT takes a bigger share of a poorer person's income, because they spend more of it.`},
 {t:'Who is affected?',w:{type:'match',pairs:[['Income Tax rises','individuals have less disposable income'],['Corporation Tax rises','firms keep less profit to invest'],['VAT rises','prices rise for consumers'],['Fuel duty rises','transport costs rise for firms and drivers']]}}],
 quiz:[{q:'Which is an indirect tax?',o:['Income Tax','VAT','National Insurance','Corporation Tax'],a:1},
  {q:'Corporation Tax is paid on:',o:['wages','company profits','petrol','houses'],a:1},
  {m:2,q:'Distinguish, with examples, between a direct tax and an indirect tax.',ans:'Direct tax is taken from income/wealth, e.g. Income Tax [1]; indirect tax is added to the price of spending, e.g. VAT [1].'},
  {m:2,q:'Explain one effect of a rise in Income Tax on individuals.',ans:'Disposable income falls [1], so they have less to spend or save [1].'}]},
{id:'t7b',name:'Government spending',vid:'UK government spending public goods merit goods',slides:[
 {t:'Three types of spending',w:{type:'cards',items:[['Current spending','Day-to-day running costs: teachers\' and nurses\' wages, medicines'],['Capital spending','Long-term investment: new hospitals, roads, schools'],['Transfer payments','Money paid to people with nothing produced in return: pensions, Universal Credit']]},
  h:`<p>The biggest areas of spending are welfare (including pensions), health, education and defence.</p>`,
  tip:`Use up-to-date terms: the unemployment element of Universal Credit, not Jobseeker's Allowance. Old terms no longer get marks.`},
 {t:'Sort the spending',w:{type:'sort',cats:['Current','Capital','Transfer'],items:[['Building a new bridge',1],['Paying police officers',0],['State pension',2],['New hospital',1],['School textbooks',0],['Universal Credit',2]]}},
 {t:'Public and merit goods',h:`<ul><li><b>Public goods:</b> everyone can use them and you can't stop people using them without paying, so firms won't provide them for profit. The government does. Examples: street lighting, defence, flood defences.</li><li><b>Merit goods:</b> good for people and society, but would be under-consumed if left to the market. Examples: education, healthcare, vaccinations.</li></ul>`,
  tip:`Describe the term first, then give an example. In 2025 many answers relied on examples alone and lost marks.`,
  ex:`Why spend? Health and education create a healthier, better-skilled workforce; defence protects the country; welfare supports those on low incomes and redistributes income.`}],
 quiz:[{q:'Building a new motorway is:',o:['current spending','capital spending','a transfer payment','a tax'],a:1},
  {q:'The state pension is a:',o:['transfer payment','capital expenditure','merit good','public good'],a:0},
  {m:2,q:'Describe what is meant by a merit good.',ans:'A good that benefits individuals and society [1] but would be under-consumed if left to the market, so the government provides it, e.g. education [1].'},
  {m:2,q:'Give two reasons why the government spends money on health.',ans:'Any two [1 each]: healthier workforce/productivity; care for people who can\'t afford private treatment; prevent spread of disease; fairness/merit good.'}]},
{id:'t7c',name:'The circular flow of income',vid:'circular flow of income closed economy',slides:[
 {t:'Money goes round',d:['circular'],h:`<p>In a simple <b>closed economy</b> there are only households and firms:</p><ul><li><b>Real flows</b> (blue): households supply factors of production; firms supply goods and services.</li><li><b>Money flows</b> (green £): firms pay factor incomes (wages, rent, interest, profit); households pay for goods and services (consumer spending).</li></ul>`,
  tip:`If the question asks for money flows, write about wages and spending, not goods and labour. In 2025 some pupils described the real flows instead.`},

  fun:`Every pound you spend is someone else's income. That's why one shop closing can affect the whole high street.`}],
 quiz:[{q:'In the circular flow, wages are paid by:',o:['households to firms','firms to households','government to firms','banks to firms'],a:1},
  {q:'Which is a real flow?',o:['Wages','Consumer spending','Goods and services','Profit'],a:2},
  {m:2,q:'Outline the money flows in the circular flow of income.',ans:'Firms pay households income for factors of production (wages, rent, interest, profit) [1]; households pay firms for goods and services (consumer spending) [1].'},
  {m:2,q:'Draw a diagram of the circular flow of income in a closed economy.',ans:`Households and firms with factor services and goods/services (real), wages and spending (money) labelled [2].${DIAGRAMS.circular()}`}]}],

const C8={id:'c8',num:8,area:1,sym:'If',name:'Inflation',blurb:`Why prices rise, how it's measured, and who wins and loses.`,
topics:[
{id:'t8a',name:'What inflation is and how it\'s measured',vid:'inflation CPI basket of goods',slides:[
 {t:'Inflation',h:`<p><b>Inflation</b> is a sustained rise in the <b>general level of prices</b> over a period of time. Each pound buys less.</p>`,
  ex:`If inflation is 4%, a basket of shopping that cost £100 last year costs £104 now.`,fun:`The Bank of England's target for inflation is 2% a year. Above that, prices are rising faster than the government wants.`},
 {t:'Measuring it: CPI',d:['basket'],w:{type:'steps',title:'How the Office for National Statistics measures inflation',steps:['The <b>Living Costs and Food Survey</b> finds out what households spend their money on.','A "<b>basket</b>" of around 700 goods and services is chosen to represent typical spending.','Each item is given a <b>weight</b> by how much is spent on it (more on food than on matches).','<b>Price collectors</b> record prices each month across the UK.','The change in the weighted cost of the basket gives the <b>CPI</b> (Consumer Prices Index).']},
  tip:`Use "Living Costs and Food Survey", not the old "Family Expenditure Survey", which no longer gets marks.`},
 {t:'CPI and CPIH',h:`<ul><li><b>CPI:</b> the main measure, used for the government's 2% target.</li><li><b>CPIH:</b> CPI plus owner-occupiers' housing costs and Council Tax.</li></ul>`,
  fun:`The basket changes as we do: in recent years things like air fryers and gym memberships have been added, while items people no longer buy much are dropped.`},
 {t:'Real vs money income',sim:['realIncome'],h:`<ul><li><b>Money (nominal) income:</b> the amount of money you're paid.</li><li><b>Real income:</b> what that money can actually buy, after taking inflation into account.</li></ul>`,
  tip:`After calculating, say what happened: "Real income has fallen by 2%, so she can buy less." Many pupils did the sum but didn't state the result.`}],
 quiz:[{q:'Inflation is:',o:['a fall in prices','a sustained rise in the general price level','a rise in one price','a rise in wages'],a:1},
  {q:'Which survey shows what households spend their money on?',o:['Labour Force Survey','Living Costs and Food Survey','Census','Family Expenditure Survey'],a:1},
  {m:2,q:'Wages rise by 3% while inflation is 7%. By how many percent does real income change? (Use a minus sign for a fall.)',n:-4,u:'%',tol:0.01},
  {m:3,q:'Describe the steps taken to measure inflation.',ans:'Any three [1 each]: Living Costs and Food Survey finds spending patterns; a basket of goods is chosen; items are weighted; prices are collected each month; the change in the weighted basket\'s cost gives the CPI.'}]},
{id:'t8b',name:'Causes and effects of inflation',vid:'demand pull cost push imported inflation effects',slides:[
 {t:'Three causes',w:{type:'cards',items:[['Demand-pull','Too much spending chasing too few goods: demand outstrips supply'],['Cost-push','Firms\' costs (wages, energy, materials) rise and they pass them on in higher prices'],['Imported','Prices of imports rise (e.g. weaker pound or dearer world oil)']]},
  ex:`2022: energy prices soared after Russia's invasion of Ukraine. Firms passed on higher costs: cost-push and imported inflation together pushed UK inflation above 10%.`},
 {t:'Which cause?',w:{type:'sort',cats:['Demand-pull','Cost-push','Imported'],items:[['Christmas shopping surge empties shelves',0],['Wages rise faster than productivity',1],['Weak pound makes imported food dearer',2],['Oil price shock raises transport costs',1],['Low interest rates spark a spending boom',0]]}},
 {t:'Winners and losers',w:{type:'match',title:'Effects of inflation',pairs:[['Savers','savings lose value if interest is below inflation'],['People on fixed incomes','real income falls'],['Borrowers','debt worth less in real terms'],['UK exporters','goods less competitive abroad'],['Workers','may demand higher wages']]},
  h:`<p>Effects on <b>individuals</b> (cost of living, real income), <b>firms</b> (higher costs, uncertainty, less competitive) and the <b>economy</b> (fewer exports, possible unemployment).</p>`}],

  {q:'Who tends to gain from inflation?',o:['Savers','People on fixed pensions','Borrowers','Exporters'],a:2},
  {m:2,q:'Explain one effect of inflation on firms.',ans:'Costs such as wages and raw materials rise [1], reducing profits or forcing higher prices, which may reduce sales/competitiveness [1].'},
  {m:2,q:'Explain demand-pull inflation.',ans:'When total demand in the economy grows faster than supply [1], too much money chases too few goods so prices are pulled up [1].'}]}],
