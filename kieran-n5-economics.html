 {t:'t10a',m:2,q:'Define economic growth.',ans:'An increase in total output over a period of time [1] using the same or fewer resources [1].'},
 {t:'t12b',m:2,q:'Describe a quota and an embargo.',ans:'Quota: a limit on the quantity of imports [1]. Embargo: a ban on trade with a country or of a product [1].'},
 {t:'t13a',m:2,q:'Define a multinational.',ans:'HQ in one country [1], facilities in at least one other [1].'},
 {t:'t14a',m:2,q:'£1 = $1.40. A US jacket costs $210. Calculate its price in pounds.',n:150,u:'£'},
 {t:'t15a',m:2,q:'Distinguish between bilateral and multilateral aid.',ans:'Bilateral: from one country directly to another [1]. Multilateral: through international organisations like the UN or World Bank [1].'}]},
{id:'f3',level:3,name:'Challenge',blurb:'Multi-step data questions, diagrams and extended explanations.',questions:[
 {t:'t1b',m:2,q:'£3000 saved at 5% compound interest for 2 years. Final amount?',n:3307.5,u:'£',tol:0.05},
 {t:'t3b',m:3,q:'Explain, using a demand diagram, the effect of a fall in the price of a substitute for streaming service A.',ans:`Demand for A shifts left from D to D1 [1]; at every price less is demanded [1] because consumers switch to the cheaper substitute [1].${DIAGRAMS.demand('left')}`},
 {t:'t4a',m:3,q:'Output 500 units: fixed costs £2000, average variable cost £6. Calculate the average cost.',n:10,u:'£',x:'VC = 500 × 6 = 3000. TC = 5000. AC = 5000 ÷ 500 = £10.'},
 {t:'t5b',m:2,q:'Give two different reasons why farmers may be affected by poor weather.',ans:'Two distinct reasons [1 each], e.g. lower yields/crops destroyed AND higher costs of protection/drying/replanting.'},
 {t:'t6b',m:4,q:'Explain, using a market diagram, the effect of a rise in the cost of cocoa on the market for chocolate.',ans:`D and S drawn with axes Price and Quantity [1]; S shifts left to S1 [1]; new equilibrium at higher price, lower quantity, labelled [1]; explanation: higher costs mean less supplied at every price [1].${DIAGRAMS.market(0,-50)}`},
 {t:'t7a',m:3,q:'Explain how a rise in VAT affects individuals, firms and the government.',ans:'Individuals: prices rise, real income falls [1]. Firms: sales may fall [1]. Government: more tax revenue (if sales don\'t fall much) [1].'},
 {t:'t8b',m:4,q:'Describe the three causes of inflation.',ans:'Demand-pull [1+], cost-push [1+], imported [1+], with a developed description in at least one [1].'},
 {t:'t9b',m:3,q:'Describe the effects of rising unemployment on the UK Government.',ans:'Less income tax and VAT revenue [1]; more spent on Universal Credit [1]; may need to borrow or cut other spending [1].'},
 {t:'t11b',m:3,q:'Describe the impact of Scottish entrepreneurs on the Scottish and UK economy.',ans:'Any three [1 each]: jobs; taxes; exports; innovation; competition; investment in communities.'},
 {t:'t12a',m:4,q:'Explain the advantages and disadvantages of global trade for the UK.',ans:'Two advantages [2], two disadvantages [2], each explained.'},
 {t:'t13a',m:3,q:'Explain three reasons why multinationals locate in Scotland.',ans:'Three explained reasons [1 each].'},
 {t:'t14a',m:3,q:'£1 = €1.10 changes to £1 = €1.25. A UK exporter sells a £200 product in France. Calculate the euro price before and after, and say whether the exporter is better or worse off.',ans:'Before €220 [1]; after €250 [1]; worse off: the product is dearer for French buyers, so sales may fall [1].'},
 {t:'t15b',m:2,q:'Describe the characteristics of emerging economies compared with developing economies.',ans:'Faster growth, more industry [1]; more foreign investment/middle class [1].'},
 {t:'t10a',m:3,q:'Describe three ways a government could increase economic growth.',ans:'Any three [1 each]: invest in infrastructure; education/training; encourage investment in technology; support enterprise.'}]}];

const COURSE={id:'n5-economics-kieran',title:"Kieran's Economics",student:'Kieran',subtitle:'S4 National 5 Economics, the whole course',
 source:'Covers every topic in the National 5 Economics course specification (Qualifications Scotland, version 4.0, valid from session 2026–27). The exam is now 70 marks in 1 hour 30 minutes, plus an assignment. Exam tips come from the SQA 2025 course report.',
 areas:['Economics of the market','UK economic activity','Global economic activity'],
 chapters:[C1,C2,C3,C4,C5,C6,C7,C8,C9,C10,C11,C12,C13,C14,C15],finals:FIN,diagrams:DIAGRAMS,sims:SIMS,
 videoSearches:[{name:'National 5 Economics videos',prefix:'National 5 Economics'},{name:'tutor2u (UK economics basics)',prefix:'tutor2u economics'}],
 resources:[
  {label:'Qualifications Scotland: National 5 Economics',url:'https://www.sqa.org.uk/sqa/47437.html',note:'Course specification, specimen paper, course reports.'},
  {label:'SQA past papers: National 5 Economics',url:'https://www.sqa.org.uk/pastpapers/findpastpaper.htm?subject=Economics&level=N5',note:'Real exam papers with marking instructions.'},
  {label:'National 5 Economics specimen question paper',url:'https://www.sqa.org.uk/sqa/files_ccc/n5-sqp-economics.pdf',note:'Shows the new 70-mark format.'},
  {label:'Understanding Standards: National 5 Economics',url:'https://www.understandingstandards.org.uk/Subjects/Economics/national5',note:'Real candidate answers with marker comments.'},
  {label:'Economic Futures Hub (Fraser of Allander Institute)',url:'https://www.discovereconomics.co.uk',note:'Free National 4/5 and Higher slides, interactive graphs and flashcards.'},
  {label:'SCHOLAR',url:'http://scholar.hw.ac.uk/Scotland/',note:'Online course materials: ask school for the login.'},
  {label:'Save My Exams: National 5 Economics past papers',url:'https://savemyexams.com/national-5/economics/sqa/past-papers',note:'Past papers organised by year.'},
  {label:'tutor2u Economics',url:'https://www.tutor2u.net/economics',note:'UK economics explainers and videos (aimed at GCSE/A level, good for the basics).'}]};

</script>

<script>
(function(){
const C=COURSE, D=C.diagrams||{};
const app=document.getElementById('app'), nav=document.getElementById('nav');
document.title=C.title;
const KEY='progress-'+C.id;
const ICON=(document.querySelector('link[rel="apple-touch-icon"]')||{}).href||'';
const blank=()=>({seen:{},conf:{},attempts:[]});
let S=blank(), V={v:'home'}, resetArm=false;
const claudeStore=!!(window.storage&&window.storage.get&&window.storage.set);
let localOK=false;if(!claudeStore){try{const k='__t';window.localStorage.setItem(k,'1');window.localStorage.removeItem(k);localOK=true;}catch(e){localOK=false;}}
const storageOK=claudeStore||localOK;

/* ---------- lookups ---------- */
const topics=[];C.chapters.forEach(ch=>ch.topics.forEach(t=>{t.ch=ch;topics.push(t);}));
const exams=[];C.chapters.forEach(ch=>{if(ch.exam){ch.exam.ch=ch;exams.push(ch.exam);}});(C.finals||[]).forEach(f=>exams.push(f));
topics.forEach(t=>{if(t.quiz)exams.push({id:'q-'+t.id,name:t.name+': quiz',questions:t.quiz.map(q=>Object.assign({t:t.id},q)),tq:t});});
const T=id=>topics.find(t=>t.id===id), E=id=>exams.find(e=>e.id===id), CH=id=>C.chapters.find(c=>c.id===id);

/* ---------- measures ---------- */
const know=t=>Math.round(100*(S.seen[t.id]||[]).length/t.slides.length);
function und(id){for(let i=S.attempts.length-1;i>=0;i--){const b=(S.attempts[i].byTopic||{})[id];if(b&&b[1])return Math.round(100*b[0]/b[1]);}return null;}
function mast(t){const k=know(t),u=und(t.id);if(!k&&u===null)return null;return Math.round(.3*k+.7*(u||0));}
const avg=a=>a.every(x=>x===null)?null:Math.round(a.reduce((s,x)=>s+(x||0),0)/a.length);
const chM=ch=>avg(ch.topics.map(mast)), allM=()=>avg(C.chapters.map(chM));
const BANDS=[[40,'u0','Just starting'],[50,'u1','Warming up'],[60,'u2','Getting there'],[70,'u3','Solid'],[85,'u4','Strong'],[101,'u5','Mastered']];
const band=p=>p===null||p===undefined?null:BANDS.find(b=>p<b[0]);
const dark=b=>b&&(b[1]==='u2'||b[1]==='u3');
const paint=p=>{const b=band(p);return b?`background:${PAL[b[1]]};color:${dark(b)?PAL.ink:'#fff'}`:'';};
const grade=p=>{const g=C.grades||[[70,'A'],[60,'B'],[50,'C'],[40,'D']];const f=g.find(x=>p>=x[0]);return f?f[1]:'Not yet';};
const pct=a=>Math.round(100*a.score/a.max);
const tries=id=>S.attempts.filter(x=>x.id===id);
const best=id=>{const a=tries(id);return a.length?Math.max(...a.map(pct)):null;};
const last=id=>{const a=tries(id);return a.length?a[a.length-1]:null;};
const marksOf=e=>e.questions.reduce((s,q)=>s+(q.m||1),0);
const fig=d=>{if(!d)return '';if(Array.isArray(d)){const f=D[d[0]];try{return f?f(...d.slice(1)):'';}catch(e){console.error(e);return '';}}return d;};
const vids=t=>t.vid?(C.videoSearches||[{name:'YouTube',prefix:''}]).map(v=>({name:v.name,url:'https://www.youtube.com/results?search_query='+encodeURIComponent((v.prefix+' '+t.vid).trim())})):[];
const watchBox=t=>{const v=vids(t),q=t.quiz?E('q-'+t.id):null;if(!v.length&&!q&&!(C.topicLinks||[]).length)return '';const b=q?best(q.id):null;
  return `<div class="watch"><b>Watch and practise</b><ul>${v.map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">▶ ${x.name}: ${t.name}</a></li>`).join('')}${(C.topicLinks||[]).map(x=>`<li><a href="${x.url}" target="_blank" rel="noopener">${x.label}</a></li>`).join('')}</ul>${q?`<button class="btn primary sm" data-go="start" data-e="${q.id}">${b===null?'Take the topic quiz':'Retake the topic quiz'} (${q.questions.length} questions${b===null?'':`, best ${b}%`})</button>`:''}</div>`;};
const FACES=['Lost','Shaky','Okay','Good','Could teach it'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- storage ---------- */
async function load(){
  try{
    if(claudeStore){const r=await window.storage.get(KEY,false);if(r&&r.value)S=Object.assign(blank(),JSON.parse(r.value));}
    else if(localOK){const v=window.localStorage.getItem(KEY);if(v)S=Object.assign(blank(),JSON.parse(v));}
  }catch(e){/* nothing saved yet */}
  render();
}
let st;function save(){if(!storageOK)return;clearTimeout(st);st=setTimeout(async()=>{try{
  if(claudeStore)await window.storage.set(KEY,JSON.stringify(S),false);else window.localStorage.setItem(KEY,JSON.stringify(S));
}catch(e){console.error('Could not save progress',e);}},250);}

/* ---------- views ---------- */
function go(v){V=v;resetArm=false;render();window.scrollTo(0,0);}

function nextUp(){
  for(const t of topics){const n=(S.seen[t.id]||[]).length;if(n<t.slides.length)return {label:n?`Carry on: ${t.name}`:`Start: ${t.name}`,attrs:`data-go="slides" data-t="${t.id}" data-i="${firstUnseen(t)}"`};}
  for(const ch of C.chapters)if(ch.exam&&best(ch.exam.id)===null)return {label:`Take the ${ch.name} test`,attrs:`data-go="start" data-e="${ch.exam.id}"`};
  for(const f of (C.finals||[]))if((best(f.id)||0)<70)return {label:`Exam ladder level ${f.level}`,attrs:`data-go="start" data-e="${f.id}"`};
  return null;
}
function firstUnseen(t){const s=S.seen[t.id]||[];for(let i=0;i<t.slides.length;i++)if(!s.includes(i))return i;return 0;}

function indicator(p){return `<div class="ind" role="img" aria-label="Overall mastery ${p===null?'not started':p+' percent'}"><div class="scale"></div>${p!==null?`<div class="mk" style="left:${Math.max(3,Math.min(97,p))}%"><b>${p}%</b></div>`:''}<div class="ends"><span>Just starting</span><span>Mastered</span></div></div>`;}

function tile(ch){const m=chM(ch);return `<button class="tile ${m===null?'new':''}" style="${paint(m)}" data-go="chapter" data-ch="${ch.id}" aria-label="Chapter ${ch.num}, ${ch.name}, ${m===null?'not started':m+' percent mastered'}"><span class="n">${ch.num}</span>${m!==null?`<span class="pc">${m}%</span>`:''}<span class="sym">${ch.sym}</span><span class="nm">${ch.name}</span></button>`;}

function vHome(){
  const o=allM(),b=band(o),n=nextUp();
  return `<header class="hero"><div class="hero-top">${ICON?`<img class="avatar" src="${ICON}" alt="">`:''}<div><p class="sub">${C.subtitle||''}</p><h1>${C.title}</h1></div></div>${indicator(o)}
  <p>${o===null?`Hi ${C.student}. Pick a chapter to begin. Your colour moves along the indicator from red to purple as you learn.`:`${b[2]}, ${C.student}. Each chapter's colour shows how well you know it.`}</p>
  ${n?`<div class="row"><button class="btn primary" ${n.attrs}>${n.label}</button></div>`:''}</header>
  ${C.areas?C.areas.map((a,i)=>{const chs=C.chapters.filter(c=>c.area===i),m=avg(chs.map(chM));return `<div class="areah"><h2>${a}</h2>${m!==null?`<span>${m}%</span>`:''}</div><div class="table">${chs.map(tile).join('')}</div>`;}).join(''):`<h2>Chapters</h2><div class="table">${C.chapters.map(tile).join('')}</div>`}
  ${(C.resources||[]).length?`<h2>More help</h2><ul class="res">${C.resources.map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>${r.note?`<br><span class="sub">${r.note}</span>`:''}</li>`).join('')}</ul>`:''}
  ${C.source?`<p class="foot sub">${C.source}</p>`:''}`;
}

function vChapter(){
  const ch=CH(V.ch);
  let h=`<button class="back" data-go="home">All chapters</button><div class="chhead"><span class="mini" style="${paint(chM(ch))}">${ch.sym}</span><div><p class="sub">Chapter ${ch.num}</p><h1>${ch.name}</h1></div></div>${ch.blurb?`<p>${ch.blurb}</p>`:''}<h2>Topics</h2><ol class="topics">`;
  ch.topics.forEach(t=>{const k=know(t),u=und(t.id),c=S.conf[t.id];
    h+=`<li><button class="trow" data-go="slides" data-t="${t.id}" data-i="${k===100?0:firstUnseen(t)}"><span class="tn">${t.name}</span><span class="meta">${t.slides.length} slides, ${k}% read${u!==null?`, ${u}% in tests`:''}${c?`, feels ${FACES[c-1].toLowerCase()}`:''}</span><span class="pbar"><i style="width:${k}%"></i></span></button>${(()=>{const q=t.quiz?E('q-'+t.id):null,b=q?best(q.id):null,v=vids(t)[0];return (q||v)?`<div class="tact">${q?`<button class="btn sm" data-go="start" data-e="${q.id}">Quiz${b===null?'':` ${b}%`}</button>`:''}${v?`<a class="btn sm" href="${v.url}" target="_blank" rel="noopener">▶ Videos</a>`:''}</div>`:'';})()}</li>`;});
  h+='</ol>';
  if(ch.exam){const l=last(ch.exam.id);h+=`<div class="testcard"><h3>${ch.exam.name}</h3><p class="sub">${ch.exam.questions.length} questions, ${marksOf(ch.exam)} marks. ${l?`Last score ${pct(l)}%, grade ${grade(pct(l))}.`:'Not taken yet.'}</p><div class="row"><button class="btn primary" data-go="start" data-e="${ch.exam.id}">${l?'Retake test':'Start test'}</button></div></div>`;}
  return h;
}

function vSlides(){
  const t=T(V.t),n=t.slides.length,i=V.i;
  let h=`<button class="back" data-go="chapter" data-ch="${t.ch.id}">${t.ch.name}</button><p class="sub">${t.name}, slide ${Math.min(i+1,n)} of ${n}</p>`;
  if(i<n){
    const s=t.slides[i],seen=S.seen[t.id]||(S.seen[t.id]=[]);if(!seen.includes(i)){seen.push(i);save();}
    h+=`<article class="slide anim" id="slide"><h2>${s.t}</h2>${s.d?`<figure class="fig">${fig(s.d)}</figure>`:''}${s.h?`<div class="body">${s.h}</div>`:''}${s.sim?`<div class="sim" id="sim"></div>`:''}${s.ex?`<div class="ex"><b>Example</b>${s.ex}</div>`:''}${s.w?widget(s.w):''}${s.k?`<p class="key"><b>Remember:</b> ${s.k}</p>`:''}${s.tip?`<p class="tip"><b>Exam tip:</b> ${s.tip}</p>`:''}${s.fun?`<p class="fun"><b>Did you know?</b> ${s.fun}</p>`:''}</article>`;
  }else{
    const c=S.conf[t.id],idx=t.ch.topics.indexOf(t),nx=t.ch.topics[idx+1];
    h+=`<article class="slide"><h2>How well do you understand this now?</h2><p>Be honest. Your rating is compared with your test scores so you can spot topics that feel fine but need another look.</p><div class="faces">${FACES.map((f,k)=>`<button class="face ${c===k+1?'on':''}" data-act="conf" data-v="${k+1}" aria-pressed="${c===k+1}"><b>${k+1}</b>${f}</button>`).join('')}</div>
    ${watchBox(t)}<div class="row">${nx?`<button class="btn primary" data-go="slides" data-t="${nx.id}" data-i="0">Next topic: ${nx.name}</button>`:t.ch.exam?`<button class="btn primary" data-go="start" data-e="${t.ch.exam.id}">Take the chapter test</button>`:''}<button class="btn" data-go="chapter" data-ch="${t.ch.id}">Chapter overview</button></div></article>`;
  }
  h+=`<div class="pager"><button class="btn" data-act="prev" ${i===0?'disabled':''}>Previous</button><span class="dots" aria-hidden="true">${Array.from({length:n+1},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</span><button class="btn primary" data-act="next" ${i>=n?'disabled':''}>Next</button></div>`;
  return h;
}

function widget(w){
  if(w.type==='steps')return `<div class="wg steps"><b class="wt">${w.title||'Work it out step by step'}</b><ol>${w.steps.map((x,i)=>`<li ${i?'hidden':''}>${x}</li>`).join('')}</ol>${w.steps.length>1?'<button class="btn sm" data-act="step">Show next step</button>':''}</div>`;
  if(w.type==='quiz')return `<div class="wg quiz"><b class="wt">Quick check</b><p>${w.q}</p><div class="opts">${w.o.map((o,k)=>`<button class="opt" data-act="wq" data-o="${k}" data-a="${w.a}"><span class="l">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div><p class="wx" hidden>${w.x||''}</p></div>`;
  if(w.type==='cards')return `<div class="wg"><b class="wt">${w.title||'Tap each card to flip it'}</b><div class="cards">${w.items.map(([f,b])=>`<button class="card2" data-act="flip"><span class="f">${f}</span><span class="b">${b}</span></button>`).join('')}</div></div>`;
  if(w.type==='sort')return `<div class="wg sort"><b class="wt">${w.title||'Sort them'}</b>${w.items.map(([it,c])=>`<div class="srow"><span>${it}</span><span class="sb">${w.cats.map((cat,k)=>`<button class="btn sm" data-act="sort" data-k="${k}" data-c="${c}">${cat}</button>`).join('')}</span></div>`).join('')}<p class="sscore" aria-live="polite"></p></div>`;
  if(w.type==='tf')return `<div class="wg tf"><b class="wt">${w.title||'True or false?'}</b>${w.items.map(([st,ans,why])=>`<div class="srow"><span>${st}</span><span class="sb"><button class="btn sm" data-act="tf" data-v="1" data-c="${ans?1:0}">True</button><button class="btn sm" data-act="tf" data-v="0" data-c="${ans?1:0}">False</button></span>${why?`<small class="why" hidden>${why}</small>`:''}</div>`).join('')}<p class="sscore" aria-live="polite"></p></div>`;
  if(w.type==='gap'){let k=0;const txt=w.text.replace(/\[(\d+)\]/g,(_,i)=>{const [opts]=w.g[+i];return `<select class="gsel" data-gi="${i}" aria-label="Choose a word"><option value="">…</option>${opts.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select>`;});
    return `<div class="wg gap" data-ans="${w.g.map(x=>x[1]).join(',')}"><b class="wt">${w.title||'Choose the right words'}</b><p>${txt}</p><button class="btn sm" data-act="gapw">Check</button><p class="sscore" aria-live="polite"></p></div>`;}
  if(w.type==='order'){const n=w.items.length,idx=[...Array(n).keys()].sort((a,b)=>((a*7+3)%n)-((b*7+3)%n));return `<div class="wg order" data-n="${n}" data-next="0"><b class="wt">${w.title||'Tap them in the right order'}</b><div class="ord">${idx.map(i=>`<button class="btn sm" data-act="ord" data-i="${i}">${w.items[i]}</button>`).join('')}</div><p class="sscore" aria-live="polite"></p></div>`;}
  if(w.type==='match'){const R=w.pairs.map((p,i)=>i).sort((a,b)=>((a*5+2)%w.pairs.length)-((b*5+2)%w.pairs.length));return `<div class="wg match"><b class="wt">${w.title||'Match them up'}</b>${w.pairs.map(([l],i)=>`<div class="mrow"><span><b>${l}</b></span><select class="gsel" data-mi="${i}" aria-label="Match for ${l}"><option value="">…</option>${R.map(j=>`<option value="${j}">${w.pairs[j][1]}</option>`).join('')}</select></div>`).join('')}<button class="btn sm" data-act="matchw" style="margin-top:8px">Check</button><p class="sscore" aria-live="polite"></p></div>`;}
  return '';
}

function vExam(){
  const e=E(V.id),q=e.questions[V.i],m=q.m||1,s=V.st,N=e.questions.length;
  let h=`<div class="examtop"><button class="back" data-act="quit">Leave test</button><span class="sub">Question ${V.i+1} of ${N}</span></div><div class="qbar"><i style="width:${100*V.i/N}%"></i></div>
  <article class="slide ${s?'':'anim'}"><p class="sub">${e.name}, ${m} mark${m>1?'s':''}</p>${q.d?`<figure class="fig">${fig(q.d)}</figure>`:''}<div class="qtext">${q.q}</div>`;
  if(q.o){
    h+=`<div class="opts">${q.o.map((o,k)=>{let c='';if(s){if(k===q.a)c='right';else if(k===s.pick)c='wrong';}return `<button class="opt ${c}" data-act="pick" data-o="${k}" ${s?'disabled':''}><span class="l">${'ABCDE'[k]}</span><span>${o}</span></button>`;}).join('')}</div>`;
  }else if(q.g){
    let i=0;const html=q.q.replace(/\[(\d+)\]/g,(_,k)=>{const [opts,ans]=q.g[+k];if(!s)return `<select class="gsel" data-qg="${k}" aria-label="Choose"><option value="">…</option>${opts.map((o,j)=>`<option value="${j}">${o}</option>`).join('')}</select>`;
      const pick=s.picks[+k];return `<b class="gsel ${pick===ans?'right':'wrong'}">${pick>=0?opts[pick]:'…'}</b>${pick!==ans?` <span class="sub">(${opts[ans]})</span>`:''}`;});
    h=h.replace(`<div class="qtext">${q.q}</div>`,`<div class="qtext">${html}</div>`);
    if(!s)h+=`<div class="row"><button class="btn primary" data-act="checkgap">Check</button></div>`;
  }else if(q.n!==undefined){
    h+=`<div class="numrow"><input id="num" inputmode="decimal" autocomplete="off" aria-label="Your answer" placeholder="Your answer" ${s?`value="${s.val}" disabled`:''}>${q.u?`<span>${q.u}</span>`:''}${s?'':'<button class="btn primary" data-act="checknum">Check</button>'}${V.err?'<span class="err">Type a number, for example 0.25</span>':''}</div>`;
  }else{
    if(!s)h+=`<textarea id="wa" rows="4" aria-label="Your answer" placeholder="Write your answer here or on paper, then check it against the model answer."></textarea><button class="btn primary" data-act="reveal">Show model answer</button>`;
    else if(s.got===undefined){const part=Math.max(1,Math.floor(m/2));h+=`<div class="ex"><b>Model answer</b>${q.ans}</div><p>Mark yourself honestly against the model answer.</p><div class="row"><button class="btn" data-act="self" data-v="${m}">Got it all (${m})</button>${m>1?`<button class="btn" data-act="self" data-v="${part}">Got part (${part})</button>`:''}<button class="btn" data-act="self" data-v="0">Not yet (0)</button></div>`;}
  }
  if(s&&s.got!==undefined){
    const ok=s.got===m,cls=ok?'good':s.got>0?'mid':'bad';
    h+=`<div class="fb ${cls}"><b>${ok?'Correct':s.got>0?'Partly right':'Not quite'}</b>${q.n!==undefined&&!ok?`<p>The answer is ${q.n}${q.u?' '+q.u:''}.</p>`:''}${q.ans&&!q.o&&q.n===undefined?`<div class="ex"><b>Model answer</b>${q.ans}</div>`:''}${q.x?`<p>${q.x}</p>`:''}</div><button class="btn primary next" data-act="nextq">${V.i+1<N?'Next question':'See my results'}</button>`;
  }
  return h+'</article>';
}

function finish(){
  const e=E(V.id),byTopic={};let score=0,max=0;
  e.questions.forEach((q,k)=>{const m=q.m||1,g=V.marks[k]||0;score+=g;max+=m;const b=byTopic[q.t]||(byTopic[q.t]=[0,0]);b[0]+=g;b[1]+=m;});
  S.attempts.push({id:e.id,name:e.name,date:Date.now(),score,max,byTopic});save();
  go({v:'result',k:S.attempts.length-1});
}

function vResult(){
  const a=S.attempts[V.k],p=pct(a);
  let h=`<div class="result" style="${paint(p)}"><p><b>${a.name}</b></p><p class="big">${p}%</p><p>${a.score} out of ${a.max} marks. Grade ${grade(p)}.</p>${p>=70?'<p class="cheer">🎉 Brilliant work!</p>':p>=50?'<p class="cheer">👍 Good progress</p>':''}</div><h2>By topic</h2><ul class="bt">`;
  Object.entries(a.byTopic).forEach(([tid,[g,m]])=>{const t=T(tid),tp=Math.round(100*g/m);h+=`<li><span>${t?t.name:tid}</span><span class="pbar"><i style="width:${tp}%;background:${PAL[band(tp)[1]]}"></i></span><b>${tp}%</b>${tp<60&&t?`<button class="btn sm" data-go="slides" data-t="${tid}" data-i="0">Review</button>`:'<span></span>'}</li>`;});
  return h+`</ul><div class="row"><button class="btn primary" data-go="start" data-e="${a.id}">Try again</button><button class="btn" data-go="exams">All exams</button></div>`;
}

function ecard(e,label){const b=best(e.id),l=last(e.id);return `<li class="ecard"><div><h3>${label||e.name}</h3><p class="sub">${e.blurb?e.blurb+' ':''}${e.questions.length} questions, ${marksOf(e)} marks.</p><p class="sub">${b===null?'Not taken yet.':`Best ${b}%, last ${pct(l)}%, ${tries(e.id).length} attempt${tries(e.id).length>1?'s':''}.`}</p></div><button class="btn ${b===null?'primary':''}" data-go="start" data-e="${e.id}">${b===null?'Start':'Retake'}</button></li>`;}
function vExams(){
  return `<h1>Exams</h1><p class="sub">Chapter tests check one chapter at a time. The exam ladder mixes every chapter and gets harder at each level. Aim for 70% before moving up.</p>
  ${(C.finals||[]).length?`<h2>Exam ladder</h2><ol class="ladder">${C.finals.map(f=>ecard(f,`Level ${f.level}: ${f.name}`)).join('')}</ol>`:''}
  <h2>Chapter tests</h2><ul class="elist">${C.chapters.filter(c=>c.exam).map(c=>ecard(c.exam)).join('')}</ul>`;
}

function chart(){
  const a=S.attempts;if(!a.length)return '<p class="sub">Take a test to start your score chart.</p>';
  const W=340,H=200,L=40,R=10,Tp=14,B=20,n=a.length,xs=k=>L+(n===1?(W-L-R)/2:k*(W-L-R)/(n-1)),ys=p=>Tp+(100-p)*(H-Tp-B)/100;
  let s='';[0,50,70,100].forEach(p=>{s+=`<line x1="${L}" x2="${W-R}" y1="${ys(p)}" y2="${ys(p)}" stroke="#C9D6E5" ${p===70?'stroke-dasharray="4 4"':''}/>`+TX(L-6,ys(p)+4,p+'%',`text-anchor="end" font-size="11" fill="${PAL.ink2}"`);});
  s+=TX(W-R,ys(70)-5,'Grade A line',`text-anchor="end" font-size="11" fill="${PAL.ink2}"`);
  if(n>1)s+=`<polyline fill="none" stroke="${PAL.ink}" stroke-width="2" points="${a.map((x,k)=>xs(k)+','+ys(pct(x))).join(' ')}"/>`;
  a.forEach((x,k)=>{const p=pct(x);s+=`<circle cx="${xs(k)}" cy="${ys(p)}" r="6" fill="${PAL[band(p)[1]]}" stroke="${PAL.ink}" stroke-width="1.5"><title>${x.name}: ${p}%</title></circle>`;});
  return SVG(W,H,s,'Test scores over time');
}

function vProgress(){
  let h=`<h1>Progress</h1><p class="sub">Read is the share of slides opened. Score is the latest test result for that topic. Feel is your own rating. When they disagree, a note tells you what to do next.</p><h2>Scores over time</h2><div class="card">${chart()}</div><h2>Topic by topic</h2>`;
  C.chapters.forEach(ch=>{
    h+=`<h3 class="chh">${ch.num}. ${ch.name}</h3><table class="pt"><thead><tr><th>Topic</th><th>Read</th><th>Score</th><th>Feel</th></tr></thead><tbody>`;
    ch.topics.forEach(t=>{const k=know(t),u=und(t.id),c=S.conf[t.id];let note='';
      if(c>=4&&u!==null&&u<60)note='Feels easy, but scores say revisit the slides and retest.';
      else if(c&&c<=2&&u!==null&&u>=70)note='You know more than you think.';
      else if(k===100&&u===null)note='All read. Test yourself next.';
      else if(u!==null&&u<50)note='Worth another look.';
      h+=`<tr><td>${t.name}${note?`<small>${note}</small>`:''}</td><td>${k}%</td><td>${u===null?'–':`<span class="chip" style="${paint(u)}">${u}%</span>`}</td><td>${c?FACES[c-1]:'–'}</td></tr>`;});
    h+='</tbody></table>';
  });
  h+=`<h2>Test history</h2>${S.attempts.length?`<ul class="hist">${S.attempts.slice().reverse().map(a=>`<li><span>${new Date(a.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span><span>${a.name}</span><b>${pct(a)}%</b></li>`).join('')}</ul>`:'<p class="sub">No tests yet.</p>'}`;
  h+=`<h2>Settings</h2><p class="sub">${claudeStore?'Progress saves automatically to your Claude account.':localOK?'Progress saves automatically on this device and browser. Clearing browser data or switching device starts fresh.':'This browser is blocking storage (private browsing?), so progress will not be kept after you close the page.'}</p><button class="btn danger" data-act="reset">${resetArm?'Tap again to erase all progress':'Reset progress'}</button>`;
  return h;
}

function render(){
  const map={home:vHome,chapter:vChapter,slides:vSlides,exams:vExams,exam:vExam,result:vResult,progress:vProgress};
  app.innerHTML=(map[V.v]||vHome)();
  const tab=['home','chapter','slides'].includes(V.v)?'home':['exams','exam','result'].includes(V.v)?'exams':'progress';
  nav.innerHTML=[['home','Learn'],['exams','Exams'],['progress','Progress']].map(([k,l])=>`<button data-go="${k}" class="${tab===k?'on':''}" ${tab===k?'aria-current="page"':''}>${l}</button>`).join('');
  nav.style.display=V.v==='exam'?'none':'';
  if(V.v==='slides'){const t=T(V.t),sl=t&&t.slides[V.i],el=document.getElementById('sim');
    if(sl&&sl.sim&&el){const f=(C.sims||{})[sl.sim[0]];if(f){try{f(el,...sl.sim.slice(1));}catch(e){console.error(e);}}}}
}

/* ---------- actions ---------- */
function checkNum(){
  const e=E(V.id),q=e.questions[V.i],m=q.m||1,raw=(document.getElementById('num').value||'').trim().replace(',','.'),x=parseFloat(raw);
  if(isNaN(x)){V.err=true;render();document.getElementById('num').focus();return;}
  const tol=q.tol!==undefined?q.tol:Math.max(0.01,Math.abs(q.n)*0.02);
  V.err=false;V.st={val:esc(raw),got:Math.abs(x-q.n)<=tol?m:0};V.marks[V.i]=V.st.got;render();
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-go],[data-act]');if(!el||el.disabled)return;
  const g=el.dataset.go,a=el.dataset.act;
  if(g){
    if(g==='start')return go({v:'exam',id:el.dataset.e,i:0,marks:[],st:null});
    const v={v:g};if(el.dataset.ch)v.ch=el.dataset.ch;if(el.dataset.t){v.t=el.dataset.t;v.i=+el.dataset.i||0;}return go(v);
  }
  const e=V.id&&E(V.id),q=e&&e.questions[V.i];
  switch(a){
    case 'prev':V.i=Math.max(0,V.i-1);render();window.scrollTo(0,0);break;
    case 'next':V.i++;render();window.scrollTo(0,0);break;
    case 'conf':S.conf[V.t]=+el.dataset.v;save();render();break;
    case 'pick':if(V.st)return;{const o=+el.dataset.o;V.st={pick:o,got:o===q.a?(q.m||1):0};V.marks[V.i]=V.st.got;render();}break;
    case 'checknum':checkNum();break;
    case 'checkgap':{const picks=q.g.map((_,k)=>{const el2=app.querySelector(`[data-qg="${k}"]`);return el2&&el2.value!==''?+el2.value:-1;});const got=picks.filter((p,k)=>p===q.g[k][1]).length;
      V.st={picks,got:Math.round(got*(q.m||q.g.length)/q.g.length)};V.marks[V.i]=V.st.got;render();break;}
    case 'tf':{const row=el.closest('.srow');if(row.dataset.ok!==undefined)return;const ok=el.dataset.v===el.dataset.c;row.dataset.ok=ok?1:0;el.classList.add(ok?'right':'wrong');if(!ok)row.querySelector(`[data-v="${el.dataset.c}"]`).classList.add('right');row.querySelectorAll('button').forEach(b=>b.disabled=true);const w=row.querySelector('.why');if(w)w.hidden=false;
      const box=el.closest('.tf'),rows=box.querySelectorAll('.srow'),d=box.querySelectorAll('.srow[data-ok]').length,g=box.querySelectorAll('.srow[data-ok="1"]').length;box.querySelector('.sscore').textContent=d===rows.length?`${g} out of ${rows.length} right${g===rows.length?' 🎉':''}`:'';break;}
    case 'gapw':{const box=el.closest('.gap'),ans=box.dataset.ans.split(',').map(Number);let g=0;box.querySelectorAll('[data-gi]').forEach(sel=>{const ok=sel.value!==''&&+sel.value===ans[+sel.dataset.gi];if(ok)g++;sel.classList.remove('right','wrong');sel.classList.add(ok?'right':'wrong');});box.querySelector('.sscore').textContent=g===ans.length?'All correct 🎉':`${g} out of ${ans.length} right. Change the red ones and check again.`;break;}
    case 'ord':{const box=el.closest('.order'),nx=+box.dataset.next;if(el.classList.contains('right'))return;if(+el.dataset.i===nx){el.classList.add('right');el.innerHTML=`<b>${nx+1}.</b> `+el.innerHTML;box.dataset.next=nx+1;if(nx+1===+box.dataset.n)box.querySelector('.sscore').textContent='Perfect order 🎉';}else{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');box.querySelector('.sscore').textContent='Not that one yet. Try again.';}break;}
    case 'matchw':{const box=el.closest('.match');let g=0,n=0;box.querySelectorAll('[data-mi]').forEach(sel=>{n++;const ok=sel.value!==''&&+sel.value===+sel.dataset.mi;if(ok)g++;sel.classList.remove('right','wrong');sel.classList.add(ok?'right':'wrong');});box.querySelector('.sscore').textContent=g===n?'All matched 🎉':`${g} out of ${n} right.`;break;}
    case 'reveal':V.st={revealed:true};render();break;
    case 'self':V.st.got=+el.dataset.v;V.marks[V.i]=V.st.got;render();break;
    case 'nextq':if(V.i+1<e.questions.length){V.i++;V.st=null;V.err=false;render();window.scrollTo(0,0);}else finish();break;
    case 'quit':go({v:'exams'});break;
    case 'step':{const box=el.closest('.steps'),h=box.querySelector('li[hidden]');if(h)h.hidden=false;if(!box.querySelector('li[hidden]'))el.remove();break;}
    case 'wq':{const box=el.closest('.quiz');if(box.dataset.done)return;box.dataset.done=1;const ans=+el.dataset.a,ok=+el.dataset.o===ans;
      box.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===ans)b.classList.add('right');else if(b===el)b.classList.add('wrong');});
      const x=box.querySelector('.wx');x.innerHTML=`<b>${ok?'Correct!':'Not quite.'}</b> `+x.innerHTML;x.hidden=false;break;}
    case 'flip':el.classList.toggle('on');break;
    case 'sort':{const row=el.closest('.srow');if(row.dataset.ok!==undefined)return;const ok=el.dataset.k===el.dataset.c;row.dataset.ok=ok?1:0;
      el.classList.add(ok?'right':'wrong');if(!ok)row.querySelector(`[data-k="${el.dataset.c}"]`).classList.add('right');row.querySelectorAll('button').forEach(b=>b.disabled=true);
      const box=el.closest('.sort'),rows=box.querySelectorAll('.srow'),doneN=box.querySelectorAll('.srow[data-ok]').length,good=box.querySelectorAll('.srow[data-ok="1"]').length;
      box.querySelector('.sscore').textContent=doneN===rows.length?`${good} out of ${rows.length} right${good===rows.length?' 🎉':''}`:`${good} right so far`;break;}
    case 'reset':if(!resetArm){resetArm=true;render();}else{S=blank();save();resetArm=false;render();}break;
  }
});
document.addEventListener('keydown',ev=>{
  if(V.v==='exam'&&ev.key==='Enter'&&ev.target.id==='num'){ev.preventDefault();checkNum();}
  if(V.v==='slides'&&ev.target===document.body){if(ev.key==='ArrowRight'&&V.i<T(V.t).slides.length){V.i++;render();}if(ev.key==='ArrowLeft'&&V.i>0){V.i--;render();}}
});
let tx=null,ty=null;
app.addEventListener('touchstart',ev=>{tx=ev.touches[0].clientX;ty=ev.touches[0].clientY;},{passive:true});
app.addEventListener('touchend',ev=>{if(tx===null||V.v!=='slides')return;const dx=ev.changedTouches[0].clientX-tx,dy=ev.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const n=T(V.t).slides.length;if(dx<0&&V.i<n){V.i++;render();window.scrollTo(0,0);}else if(dx>0&&V.i>0){V.i--;render();window.scrollTo(0,0);}}},{passive:true});

load();
})();
</script>
</body>
</html>
