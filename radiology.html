<style>
:root{--navy:#3B2A5C;--ink:#1D2433;--muted:#5C6375;--line:#E2E5EC;--paper:#FFFFFF;--bg:#F4F5F8;--gold:#EFC76A;--red:#A33A3A;--accent:#6B55A3}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #A890E0;outline-offset:2px}
header{background:linear-gradient(180deg,#3B2A5C 0%,#4A3672 100%);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.hin{max-width:760px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.newc{font-size:14px;color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:#B9C1D6;padding:10px 2px 11px;font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;font-weight:600;border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.search{width:100%;font-size:16px;padding:11px 12px;border:1px solid #D3D8E4;border-radius:10px;background:#fff}
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:15px;padding:7px 12px;border-radius:18px;border:1px solid #CDD3E1;background:#fff;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.chip.cat{border-color:#D3D7E2;color:var(--ink);font-weight:500}
.chip.cat::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px;vertical-align:1px}
.chip.cat.on::before{background:#fff}
.chip.cat.on{color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meta{font-size:14px;color:var(--muted);margin:12px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.art{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--jc);box-shadow:0 1px 3px rgba(20,30,60,.05);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.art .jn{font-size:13px;font-weight:600;color:var(--jc);display:flex;justify-content:space-between;gap:8px}
.art .jn .dt{color:var(--muted);font-weight:400}

  for(let n=h.nextSibling;n;n=n.nextSibling){
   if(n.nodeType===1){const hm=/^H([2-4])$/.exec(n.tagName);if(hm&&+hm[1]<=lvl&&!re.test(n.textContent))break;if(hm)done.add(n);if(n.querySelectorAll)n.querySelectorAll("h2,h3,h4").forEach(x=>done.add(x))}

  // summary
  text("Summary",13,{bold:true,col:NAVY,after:2});
  const byK={},byD={};for(const c of L){const k=cpdKind(c);byK[k]=(byK[k]||{n:0,h:0});byK[k].n++;byK[k].h+=cHours(c);for(const d of (c.ref&&c.ref.domains)||[]){byD[d]=(byD[d]||{n:0,h:0});byD[d].n++;byD[d].h+=cHours(c)}}
  const row=(l,r,bold)=>{need(6);doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(10.5);doc.setTextColor(34,34,34);doc.text(l,M,y+4);doc.text(r,W-M,y+4,{align:"right"});y+=6};
  for(const k of ["event","online","reading","podcast"])if(byK[k])row(`${KINDNAME[k]} (${byK[k].n})`,`${byK[k].h.toFixed(1)} hours`);
  doc.setDrawColor(200,204,214);doc.line(M,y+1,W-M,y+1);y+=2;row(`Total (${L.length} activities)`,`${tot.toFixed(1)} hours`,true);y+=3;
  if(Object.keys(byD).length){text("By Good Medical Practice domain",11,{bold:true,col:NAVY,after:1.5});for(const d of GMP)if(byD[d])row(`${d} (${byD[d].n})`,`${byD[d].h.toFixed(1)} hours`);y+=3}
  // entries by type
  for(const k of ["event","online","reading","podcast"]){
   const E=L.filter(c=>cpdKind(c)===k);if(!E.length)continue;
   need(16);y+=2;doc.setFillColor(241,243,249);doc.rect(M-2,y,CW+4,8,"F");text(KINDNAME[k],12,{bold:true,col:NAVY,after:3,x:M});
   for(const c of E){

    doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(...GREY);doc.text(`${ukDate(c.date)}${c.end&&c.end!==c.date?` – ${ukDate(c.end)}`:""}`,M,y+3.5);
    doc.text(`${cHours(c)} ${c.credits!=null?"credits":"hours"}`,W-M,y+3.5,{align:"right"});y+=5;
    text(c.title,11,{bold:true,after:0.8});
    const meta=[c.src,c.venue].filter(Boolean).join(" · ");if(meta)text(meta,9.5,{col:GREY,after:1});

    y+=1.5;doc.setDrawColor(226,228,236);doc.line(M,y,W-M,y);y+=3;
   }
  }
  let nC=0;if(attach){S.readyMsg="Adding certificates";renderModal();try{nC=await addCerts(doc,L,W,M,NAVY,GREY)}catch(x){}}
  const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8.5);doc.setTextColor(...GREY);doc.text(`Page ${i} of ${pages}`,W-M,292,{align:"right"});doc.text("CPD log for appraisal and revalidation (supporting information)",M,292)}
  const name=`CPD-log-${S.cpdP==="all"?"all":a+"-to-"+b}.pdf`;

// spoken punctuation and commonly misheard medical words
const DICTFIX=[[/\b(full stop|period)\b/gi,"."],[/\bcomma\b/gi,","],[/\bquestion mark\b/gi,"?"],[/\bcolon\b/gi,":"],[/\bsemi-?colon\b/gi,";"],[/\b(new paragraph|new line|next line)\b/gi,"\n"],
 [/\bc ?t ?p ?a\b/gi,"CTPA"],[/\bc ?t ?c ?a\b/gi,"CTCA"],[/\bh ?r ?c ?t\b/gi,"HRCT"],[/\bpet ?(c ?t|scan)\b/gi,"PET-CT"],[/\bm ?r ?c ?p\b/gi,"MRCP"],[/\bm ?r ?i\b/gi,"MRI"],[/\bc ?t\b(?= (scan|head|chest|abdomen|guided|colonography))/gi,"CT"],
 [/\b(bi|by|bye) ?rads\b/gi,"BI-RADS"],[/\b(li|lie|lye) ?rads\b/gi,"LI-RADS"],[/\b(pi|pie) ?rads\b/gi,"PI-RADS"],[/\b(ti|tie|tai) ?rads\b/gi,"TI-RADS"],[/\bo ?rads\b/gi,"O-RADS"],
 [/\bflash? ?ner\b|\bflyshner\b|\bfleishner\b/gi,"Fleischner"],[/\bboz? ?nee ?ack\b|\bbosnyak\b/gi,"Bosniak"],[/\bhounds ?field\b/gi,"Hounsfield"],[/\bgad(o|a)lin(e|i)um\b/gi,"gadolinium"],
 [/\bi ?r ?mer\b|\birma\b/gi,"IR(ME)R"],[/\bi ?refer\b/gi,"iRefer"],[/\bt ?a ?c ?e\b|\btace\b/gi,"TACE"],[/\btips procedure\b/gi,"TIPSS procedure"],[/\bpicc? line\b|\bpick line\b/gi,"PICC line"],
 [/\be ?v ?a ?r\b|\bee ?var\b/gi,"EVAR"],[/\bd ?w ?i\b/gi,"DWI"],[/\ba ?d ?c\b(?= (map|value))/gi,"ADC"],[/\bd ?l ?p\b/gi,"DLP"],[/\bs ?u ?v max\b/gi,"SUVmax"],[/\bp ?s ?m ?a\b/gi,"PSMA"],[/\bf ?d ?g\b/gi,"FDG"],
 [/\bc\.? ?o\.? ?p\.? ?d\b|\bco pd\b|\bcopd\b/gi,"COPD"],[/\bi ?l ?d\b/gi,"ILD"],[/\bh ?c ?c\b/gi,"HCC"],[/\be ?c ?g\b/gi,"ECG"],
 [/\br ?c ?r\b(?= guid)/gi,"RCR"],[/\ba ?c ?r\b(?= (appropriateness|guid))/gi,"ACR"],[/\bnice\b(?= guideline)/gi,"NICE"],[/\bgp\b/gi,"GP"],[/\bnhs\b/gi,"NHS"],[/\bmdt\b/gi,"MDT"]];
function fixDictation(t){
 let x=String(t);for(const[re,v]of DICTFIX)x=x.replace(re,v);
 x=x.replace(/[ \t]+([.,;:?!])/g,"$1").replace(/([.,;:?!])(?=[A-Za-z])/g,"$1 ").replace(/[ \t]*\n[ \t]*/g,"\n").replace(/[ \t]{2,}/g," ");
 x=x.replace(/(^|[.?!]\s+|\n)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
 return x.replace(/\bi\b/g,"I");
}

const CERTDB=KEY+"-certs";
function cDB(){return new Promise((res,rej)=>{const r=indexedDB.open(CERTDB,1);r.onupgradeneeded=()=>r.result.createObjectStore("c",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function cAll(){const db=await cDB();return new Promise((res,rej)=>{const q=db.transaction("c").objectStore("c").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function certFromBeta(){if(!fromBeta)return;try{const old=await new Promise((res,rej)=>{const q=indexedDB.open("radiology-cpd-beta-certs",1);q.onupgradeneeded=()=>q.result.createObjectStore("c",{keyPath:"id"});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
 const recs=await new Promise((res,rej)=>{const q=old.transaction("c").objectStore("c").getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)});old.close();
 const have=new Set((await cAll()).map(c=>c.id));for(const c of recs)if(!have.has(c.id))await cPut(c);if(recs.length){certMeta=null;render()}}catch(e){}}
async function cPut(o){const db=await cDB();return new Promise((res,rej)=>{const tx=db.transaction("c","readwrite");tx.objectStore("c").put(o);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function cDel(id){const db=await cDB();return new Promise((res,rej)=>{const tx=db.transaction("c","readwrite");tx.objectStore("c").delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
let certMeta=null;

  if(S.modal.edit){const c=st.cpd.find(x=>x.id===S.modal.edit);if(c){c.minutes=mins;c.date=S.cpdDate||c.date;c.ref={learn:(S.cpdRef.learn||"").trim(),change:(S.cpdRef.change||"").trim(),further:(S.cpdRef.further||"").trim(),domains:(S.cpdRef.domains||[]).slice()};c.note="";save()}S.modal=null;render();toast("CPD entry updated");return}const it=findItem(S.modal.pmid)||(S.modal.title?{title:"Podcast: "+S.modal.title,src:"Podcast"}:{});

  save();S.modal=null;render();toast(`Logged ${mins} minutes of CPD`)}

function cvSet(el){
 const k=el.dataset.cv;S.cv[S.calc][k]=el.type==="checkbox"?el.checked:el.value;
 if(el.tagName==="SELECT"&&(RERENDER[S.calc]||[]).includes(k)){render();return}
 const r=document.getElementById("cres");if(r)r.innerHTML=calcResult(S.calc);
}
document.addEventListener("input",e=>{
 if(e.target.dataset&&e.target.dataset.cv){cvSet(e.target);return}
 if(e.target.id==="q"){S.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>load(),700)}
 else if(e.target.id==="myname"||e.target.id==="cpdname"){st.myName=e.target.value;save()}
 else if(e.target.id==="cpdgmc"){st.myGMC=e.target.value.trim();save()}
 else if(e.target.id==="mygmc"){st.myGMC=e.target.value.trim();save()}
 else if(e.target.id==="pronq"){S.pronq=e.target.value;const q=S.pronq.toLowerCase();document.querySelectorAll(".prow").forEach(r=>{const v=[...r.querySelectorAll("input")].map(i=>i.value).join(" ").toLowerCase();r.style.display=!q||v.includes(q)?"":"none"})}
 else if(e.target.dataset&&e.target.dataset.pf!=null){pronEdit(+e.target.dataset.pf,0,e.target.value)}
 else if(e.target.dataset&&e.target.dataset.pt!=null){pronEdit(+e.target.dataset.pt,1,e.target.value)}
 else if(e.target.id==="aiurl"){st.aiUrl=e.target.value.trim();save()}
 else if(["ftezp","ftoa","ftemail"].includes(e.target.id)){st.ft={...(st.ft||{}),[e.target.id.slice(2)]:e.target.value.trim()};save()}
 else if(e.target.id==="cpdmins"){S.cpdMin=e.target.value}
 else if(S.ev&&/^ev(n|org|s|e|v|cr|ses)$/.test(e.target.id)){const k={evn:"n",evorg:"org",evs:"s",eve:"e",evv:"v",evcr:"cr",evses:"sessions"}[e.target.id];S.ev[k]=e.target.value;if(k==="s"&&(!S.ev.e||S.ev.e<S.ev.s)){S.ev.e=S.ev.s;const x=document.getElementById("eve");if(x)x.value=S.ev.s}}
 else if(["cpdlearn","cpdchange","cpdfurther"].includes(e.target.id)){S.cpdRef[e.target.id.slice(3)]=e.target.value}
 else if(e.target.id==="tname"&&S.tEdit){S.tEdit.name=e.target.value}
 else if(e.target.id==="twords"&&S.tEdit){S.tEdit.words=e.target.value}
 else if(e.target.id==="jq"){S.jq=e.target.value}
 else if(S.chartDraft&&/^ch(title|s1|s2|unit|data)$/.test(e.target.id)){S.chartDraft[e.target.id.slice(2)]=e.target.value}
 else if(e.target.id==="cpdnote"){S.cpdNote=e.target.value}
 else if(e.target.id==="cpddate"){S.cpdDate=e.target.value}
 else if(e.target.id==="dq"){S.dq=e.target.value;clearTimeout(dTimer);dTimer=setTimeout(render,250)}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.cv){cvSet(el);return}
 if(el.id==="slidecount"){S.slideN=+el.value;return}
 if(el.id==="evt"&&S.ev){S.ev.t=el.value;return}
 if((el.id==="evs"||el.id==="eve")&&S.ev){S.ev[el.id==="evs"?"s":"e"]=el.value;return}
 if(el.id==="slidefigs"){S.slideFigs=el.checked;return}
 if(el.id==="slideai"){S.slideAI=el.checked;return}
 if(el.id==="chtype"&&S.chartDraft){S.chartDraft.type=el.value;renderModal();return}
 if(el.id==="restorefile"&&el.files[0]){const f=el.files[0];el.value="";restoreFrom(f);return}
 if(el.id==="cpdfrom"){S.cpdFrom=el.value;render();return}
 if(el.id==="cpdto"){S.cpdTo=el.value;render();return}
 if(el.id==="cpddate"){S.cpdDate=el.value;return}
 if(el.dataset&&el.dataset.th){st.topicEdits=st.topicEdits||{};const id=el.dataset.th;if(id.startsWith("ct")){const x=(st.customTopics||[]).find(y=>y.id===id);if(x)x.hidden=!el.checked}else st.topicEdits[id]={...(st.topicEdits[id]||{}),hidden:!el.checked};save();applyTopics();render();return}
 if(el.id==="jgen"){S.jgen=el.checked;return}
 if(el.id==="enginesel"){st.engine=el.value;NV.failed=false;save();if(el.value==="natural"&&S.nvHave)nvLoad(st.nvVoice||"jenny").catch(()=>{NV.failed=true});if(el.value==="google")GG.off=false;render();return}
 if(el.id==="nvvoice"){st.nvVoice=el.value;save();NV.sess=null;NV.key="";nvIsDownloaded(el.value).then(h=>{S.nvHave=h;if(h&&st.engine==="natural")nvLoad(el.value).catch(()=>{});render()});return}
 if(el.dataset&&el.dataset.cert&&el.files&&el.files[0]){const f=el.files[0];el.value="";certAdd(el.dataset.cert,f);return}
 if(el.id==="soarattach"&&S.soar){S.soar.attach=el.checked;return}
 if(el.dataset&&el.dataset.mypdf&&el.files&&el.files[0]){const f=el.files[0];el.value="";myPdfLoad(el.dataset.mypdf,f);return}
 if(el.id==="newson"){st.newsOff=!el.checked;save();return}
 if(el.id==="ggvoice"){st.ggVoice=el.value;GG.off=false;save();return}
 if(el.id==="voicesel"){st.voice=el.value;save();return}
 if(el.id==="ratesel"){st.rate=el.value;save();return}
 if(el.id==="ftmode"){st.ft={...(st.ft||{}),mode:el.value};save();render();return}
 if(el.id==="ftunpay"){st.ft={...(st.ft||{}),unpay:el.checked};save();render();return}
 if(el.id==="days"){st.days=+el.value;save();load()}
 else if(el.id==="research"){st.research=el.checked;save();load()}
 else if(el.dataset.jt){if(el.checked)delete st.off[el.dataset.jt];else st.off[el.dataset.jt]=true;if(st.off[S.j])S.j="all";save();load()}
});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter"){clearTimeout(qTimer);e.target.blur();load()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&st.last&&Date.now()-st.last>3*3600e3&&S.tab==="latest")load()});
render();load();

</script>
