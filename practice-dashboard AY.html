<style>
:root{--ink:#262A3F;--muted:#636A80;--line:#E4E7F0;--soft:#F8F9FC;--owed:#B4434A;--good:#2F7A55;--btn:#3B4270}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);min-height:100vh;background:linear-gradient(180deg,#F4F5FB 0%,#FBF8FA 60%,#F7FAF8 100%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FA7E0;outline-offset:2px}
header{background:linear-gradient(120deg,#E3E8F8 0%,#F2E6F0 55%,#E6F3EC 100%);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);border-bottom:1px solid #DDE1EE}
.hin{max-width:960px;margin:0 auto;padding:12px 16px 0}
.hin h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.hin h1 svg{width:34px;height:16px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto;padding-bottom:8px}

.bar .in{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}

p.help{font-size:14px;color:var(--muted);margin-bottom:8px}
</style>

<body>
<header><div class="hin"><h1><svg viewBox="0 0 34 16" aria-hidden="true"><path d="M0 10h9l2-3 2 3h3l3-9 3 14 2-5h10" fill="none" stroke="#C9566A" stroke-width="2" stroke-linejoin="round"/></svg>Private practice activity</h1>
<nav aria-label="Sections"><button data-tab="overview">Overview</button><button data-tab="log">Log week</button><button data-tab="payments">Payments</button><button data-tab="tariffs">Tariffs</button></nav></div></header>
<main id="main"></main>
<div id="toast" role="status"></div>
<script>
"use strict";
const KEY="practice-dashboard-v1";
const PAL={kp:{c:"#8A3A5C",m:"#E3A3BC",bg:"#F8E3EB"},spire:{c:"#2E6A9A",m:"#8DB6DD",bg:"#E1EDF8"},nuffield:{c:"#2F7A55",m:"#94CFAE",bg:"#DFF2E7"},medserv:{c:"#9A6118",m:"#F0C38A",bg:"#FCEBD6"},reporting:{c:"#5E4FA0",m:"#B5A9E3",bg:"#ECE8F8"}};
const pv=k=>`--c:${PAL[k].c};--m:${PAL[k].m};--bg:${PAL[k].bg}`;
const PAYERS=[{id:"spire",name:"Spire"},{id:"medserv",name:"Medserv"},{id:"kp",name:"Kings Park"},{id:"nuffield",name:"Nuffield"}].map(p=>({...p,color:PAL[p.id].m}));
const PNAME=Object.fromEntries(PAYERS.map(p=>[p.id,p.name]));
const INS=[{id:"self",name:"Self-pay"},{id:"aviva",name:"Aviva"},{id:"axa",name:"AXA"},{id:"bupa",name:"Bupa"},{id:"vitality",name:"Vitality"},{id:"healix",name:"Healix"}];
const INAME=Object.fromEntries(INS.map(i=>[i.id,i.name]));
const HOSP={
 kp:{name:"Kings Park",inv:[["ecg","ECG"],["echo","Echocardiogram"],["zio","ZIO patch"]]},
 spire:{name:"Spire",inv:[["echo","Echocardiogram"],["synexus","Synexus echo"],["ecg","ECG"],["h24","24h ECG monitor"],["h48","48h ECG monitor"],["h72","72h ECG monitor"],["bp24","24h BP monitor"],["ett","Exercise treadmill test"]]},
 nuffield:{name:"Nuffield",inv:[["ecg","ECG"],["echo","Echocardiogram"],["zio","ZIO patch"]]}
};
const ITEMNAME={ecg:"ECG",echo:"echo",zio:"ZIO patch",synexus:"Synexus echo",h24:"24h ECG monitor",h48:"48h ECG monitor",h72:"72h ECG monitor",bp24:"24h BP monitor",ett:"treadmill test",toe:"TOE",dccv:"DC cardioversion",ct:"CT",mri:"MRI"};
const SESS=[
 {id:"kp",hosp:"kp",off:0,title:"Kings Park",when:"evening",pal:"kp"},
 {id:"spire",hosp:"spire",off:3,title:"Spire Shawfair Park",when:"morning",pal:"spire",procs:true},
 {id:"reporting",hosp:"spire",off:3,title:"CT and MRI reporting",when:"afternoon",pal:"reporting",scans:true},
 {id:"nuffield",hosp:"nuffield",off:3,title:"Nuffield",when:"evening",pal:"nuffield"},
 {id:"spireFri",hosp:"spire",off:4,title:"Spire follow-up clinic",when:"evening",pal:"spire"},
 {id:"nuffieldFri",hosp:"nuffield",off:4,title:"Nuffield follow-up clinic",when:"evening",pal:"nuffield"}
];
const SMAP=Object.fromEntries(SESS.map(s=>[s.id,s]));
const CLINICS=SESS.filter(s=>!s.scans);
const SCHED={
 spire:"Consultations weekly, about 2 weeks after clinic. Investigations, procedures and scan reports monthly, a month in arrears.",
 nuffield:"Self-pay consultations and investigations monthly, a month in arrears.",
 kp:"All consultations and investigations. Pays at irregular intervals.",
 medserv:"Bupa consultations, TOE and cardioversion at Spire, and insured consultations at Nuffield. Pays at irregular intervals."
};
const DEFAULT={
 tariffs:{
  consult:{self:{new:225,fu:150},aviva:{new:204,fu:144},axa:{new:195,fu:132},bupa:{new:190,fu:115},vitality:{new:160,fu:100},healix:{new:200,fu:150}},
  inv:{spire:{echo:200,synexus:550,ecg:30,h24:50,h48:70,h72:90,bp24:50,ett:150},nuffield:{ecg:45,echo:214,zio:75},kp:{ecg:70,echo:223,zio:180}},
  procs:{toe:{self:300,insured:280},dccv:{self:150,insured:150}},
  scans:{self:200,insured:150}
 },
 settings:{keywords:{spire:"spire",nuffield:"nuffield",kp:"kings park, kingspark, circle",medserv:"medserv"},opening:{spire:0,nuffield:0,kp:0,medserv:0}},
 weeks:{},txns:[]
};

// helpers
const n=v=>Number(v)||0;
const clone=o=>JSON.parse(JSON.stringify(o));
const fmt=v=>(v< -0.5?"−":"")+"£"+Math.abs(Math.round(v)).toLocaleString("en-GB");
const pad=x=>String(x).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,k)=>{const x=new Date(d);x.setDate(x.getDate()+k);return x};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const monthKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const monthLabel=(k,s)=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",s?{month:"short"}:{month:"long",year:"numeric"})};
const prevMonth=(k,i)=>{const[y,m]=k.split("-").map(Number);return monthKey(new Date(y,m-1-i,1))};
const dayLabel=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const longDate=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
const endNextMonth=d=>new Date(d.getFullYear(),d.getMonth()+2,0);
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function deepMerge(def,val){
 if(typeof def!=="object"||def===null||Array.isArray(def))return val===undefined?def:val;
 const out={...def};
 if(val&&typeof val==="object")for(const k of Object.keys(val))out[k]=k in def?deepMerge(def[k],val[k]):val[k];
 return out;
}
const getPath=(o,p)=>p.reduce((a,k)=>a==null?a:a[k],o);
function setPath(o,p,v){let x=o;for(const k of p.slice(0,-1)){if(typeof x[k]!=="object"||x[k]===null)x[k]={};x=x[k]}x[p[p.length-1]]=v}
const emptyConsult=()=>Object.fromEntries(INS.map(i=>[i.id,{new:0,fu:0}]));
function emptyWeek(start){
 const w={start};
 for(const s of CLINICS)w[s.id]={consult:emptyConsult(),inv:{}};
 w.spire.procs={toe:{self:0,bupa:0,ins:0},dccv:{self:0,bupa:0,ins:0}};
 w.reporting={ct:{ins:0,self:0},mri:{ins:0,self:0}};
 return w;
}

// storage
let data;
try{const s=localStorage.getItem(KEY);data=s?deepMerge(clone(DEFAULT),JSON.parse(s)):clone(DEFAULT)}catch(e){data=clone(DEFAULT)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast("Couldn't save on this phone. Free up some storage and try again.");return false}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

// income routing
function computeLines(w){
 const T=data.tariffs,L=[],mon=parseISO(w.start);
 const push=(site,off,payer,stream,amt)=>{if(amt>0)L.push({date:addDays(mon,off),site,payer,stream,amount:amt})};
 for(const s of CLINICS){
  const site=w[s.id];if(!site)continue;const h=s.hosp;
  for(const i of INS){
   const c=(site.consult||{})[i.id]||{},t=T.consult[i.id];
   const amt=n(c.new)*n(t.new)+n(c.fu)*n(t.fu);
   if(h==="kp")push(s.id,s.off,"kp","kp",amt);
   else if(h==="spire")push(s.id,s.off,i.id==="bupa"?"medserv":"spire",i.id==="bupa"?"medserv":"spireWeekly",amt);
   else push(s.id,s.off,i.id==="self"?"nuffield":"medserv",i.id==="self"?"nuffieldMonthly":"medserv",amt);
  }
  const stream=h==="kp"?"kp":h==="spire"?"spireMonthly":"nuffieldMonthly";
  for(const[k]of HOSP[h].inv)push(s.id,s.off,h,stream,n((site.inv||{})[k])*n(T.inv[h][k]));
  if(s.procs)for(const k of ["toe","dccv"]){
   const p=(site.procs||{})[k]||{},t=T.procs[k];
   push(s.id,s.off,"spire","spireMonthly",n(p.self)*n(t.self)+n(p.ins)*n(t.insured));
   push(s.id,s.off,"medserv","medserv",n(p.bupa)*n(t.insured));
  }
 }
 const r=w.reporting||{};
 push("reporting",3,"spire","spireMonthly",["ct","mri"].reduce((a,k)=>a+n((r[k]||{}).self)*n(T.scans.self)+n((r[k]||{}).ins)*n(T.scans.insured),0));
 return L;
}
const dueOf=l=>l.stream==="spireWeekly"?addDays(l.date,14):(l.stream==="spireMonthly"||l.stream==="nuffieldMonthly")?endNextMonth(l.date):null;
function activity(w){
 const mon=parseISO(w.start),out={};
 for(const s of CLINICS){
  const site=w[s.id]||{};let nw=0,fu=0,inv=0;
  for(const i of INS){const c=(site.consult||{})[i.id]||{};nw+=n(c.new);fu+=n(c.fu)}
  for(const[k]of HOSP[s.hosp].inv)inv+=n((site.inv||{})[k]);
  if(s.procs)for(const k of ["toe","dccv"]){const p=(site.procs||{})[k]||{};inv+=n(p.self)+n(p.bupa)+n(p.ins)}
  out[s.id]={date:addDays(mon,s.off),newc:nw,fu,inv,scans:0};
 }
 const r=w.reporting||{};
 out.reporting={date:addDays(mon,3),newc:0,fu:0,inv:0,scans:["ct","mri"].reduce((a,k)=>a+n((r[k]||{}).self)+n((r[k]||{}).ins),0)};
 return out;
}
const getWeek=s=>deepMerge(emptyWeek(s),data.weeks[s]||{});
const weekTotal=s=>computeLines(getWeek(s)).reduce((a,l)=>a+l.amount,0);
const allLines=()=>Object.values(data.weeks).flatMap(w=>computeLines(deepMerge(emptyWeek(w.start),w)));

// ---------- quick entry parser ----------
const NUMW={a:1,an:1,one:1,single:1,two:2,couple:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20};
const HRS={"24":"24","twentyfour":"24","48":"48","fortyeight":"48","72":"72","seventytwo":"72"};
const PHR=[
 [/\b(?:24|twenty[\s-]?four)[\s-]*(?:h|hr|hrs|hour|hours)?[\s-]*(?:ambulatory\s+)?(?:bp|blood\s+pressure)(?:\s+monitors?)?\b|\babpms?\b|\b(?:ambulatory\s+)?(?:bp|blood\s+pressure)\s+monitors?\b/g,()=>"item:bp24"],
 [/\b(24|48|72|twenty[\s-]?four|forty[\s-]?eight|seventy[\s-]?two)[\s-]*(?:h|hr|hrs|hour|hours)\b(?:[\s-]*(?:ecg|ekg|holter|cardiac|heart|tape|monitor|recording)s?)*/g,(m,d)=>"item:h"+(HRS[d.replace(/[\s-]/g,"")]||"24")],
 [/\bholters?\b/g,()=>"item:h24"],
 [/\btrans[\s-]?o?esophageal(?:\s+echo(?:cardiograms?|s|es)?)?\b|\btoes?\b|\btees?\b/g,()=>"item:toe"],
 [/\bsynexus(?:\s+echo(?:cardiograms?|s|es)?)?\b/g,()=>"item:synexus"],
 [/\becho(?:cardiograms?|cardiography|s|es)?\b/g,()=>"item:echo"],
 [/\b(?:12[\s-]?lead\s+)?(?:ecg|ekg)s?\b/g,()=>"item:ecg"],
 [/\bzio(?:s|\s+patch(?:es)?)?\b/g,()=>"item:zio"],
 [/\bexercise\s+(?:treadmill\s+)?(?:tolerance\s+)?tests?\b|\btreadmills?(?:\s+tests?)?\b|\betts?\b|\bstress\s+tests?\b/g,()=>"item:ett"],
 [/\b(?:dc\s+)?cardioversions?\b|\bdccvs?\b/g,()=>"item:dccv"],
 [/\bctcas?\b|\bct\s+coronar(?:y|ies)(?:\s+angiograms?)?\b|\bct\s+scans?\b|\bcts?\b/g,()=>"item:ct"],
 [/\bcmrs?\b|\bcardiac\s+mris?\b|\bmri\s+scans?\b|\bmris?\b/g,()=>"item:mri"],
 [/\bself[\s-]?(?:pay(?:ing|s|ers?)?|funded)\b|\bprivate\b/g,()=>"payer:self"],
 [/\baxa(?:\s+ppp)?\b|\bppp\b/g,()=>"payer:axa"],
 [/\bbupa\b/g,()=>"payer:bupa"],[/\baviva\b/g,()=>"payer:aviva"],[/\bvitality\b/g,()=>"payer:vitality"],[/\bhealix\b/g,()=>"payer:healix"],
 [/\binsur(?:ed|ance)\b/g,()=>"payer:ins"],
 [/\bfollow[\s-]?ups?\b|\bf\/u\b|\bfus?\b|\breviews?\b/g,()=>"kind:fu"],
 [/\bnew(?:\s+patients?)?\b|\bnews\b|\bnps?\b/g,()=>"kind:new"]
];
function tokenize(text){
 let s=" "+text.toLowerCase().replace(/[’']/g,"").replace(/[,;:.!?&+()]/g," ")+" ";
 const T=[];
 for(const[re,fn]of PHR)s=s.replace(re,(...a)=>{T.push(fn(...a));return ` §${T.length-1}§ `});
 const toks=[];
 for(const w of s.split(/\s+/)){
  if(!w)continue;
  let m=w.match(/^§(\d+)§$/);
  if(m){const[t,v]=T[+m[1]].split(":");toks.push({t,v});continue}
  m=w.match(/^x?(\d{1,3})x?$/);
  if(m){toks.push({t:"num",v:+m[1]});continue}
  if(NUMW[w]!==undefined)toks.push({t:"num",v:NUMW[w]});
 }
 return toks;
}
function clauses(toks){
 const out=[];let c={};
 const flush=()=>{if(c.item||c.payer||c.kind||c.num!=null)out.push(c);c={}};
 const special=it=>["toe","dccv","ct","mri"].includes(it);
 toks.forEach((t,i)=>{
  const nx=toks[i+1];
  if(t.t==="num"){
   if(c.num!=null)flush();
   else if(!c.item&&(c.payer||c.kind)&&nx&&nx.t==="item")flush();
   c.num=t.v;
  }else if(t.t==="item"){if(c.item||c.kind)flush();c.item=t.v}
  else if(t.t==="payer"){if(c.payer||(c.item&&!special(c.item)))flush();c.payer=t.v}
  else if(t.t==="kind"){if(c.kind||c.item)flush();c.kind=t.v}
 });
 flush();
 return out;
}
function interpret(text,sid){
 const sess=SMAP[sid],ok=[],bad=[];
 for(const c of clauses(tokenize(text))){
  const k=c.num==null?1:c.num;
  if(k<=0)continue;
  if(c.item==="ct"||c.item==="mri"){
   const col=c.payer==="self"?"self":"ins";
   ok.push({path:["reporting",c.item,col],n:k,label:`${k} ${ITEMNAME[c.item]} reported, ${col==="self"?"self-pay":"insured"}${c.payer?"":" (assumed insured)"}`});
  }else if(c.item==="toe"||c.item==="dccv"){
   const col=!c.payer||c.payer==="self"?"self":c.payer==="bupa"?"bupa":"ins";
   ok.push({path:["spire","procs",c.item,col],n:k,label:`${k} ${ITEMNAME[c.item]} at Spire, ${col==="self"?"self-pay":col==="bupa"?"Bupa":"insured"}${c.payer?"":" (assumed self-pay)"}`});
  }else if(c.item){
   const target=sess.scans?"spire":sid,h=SMAP[target].hosp;
   if(!HOSP[h].inv.some(([x])=>x===c.item)){bad.push(`${ITEMNAME[c.item]} isn't set up at ${HOSP[h].name}, so it was left out`);continue}
   ok.push({path:[target,"inv",c.item],n:k,label:`${k} ${ITEMNAME[c.item]}${k>1&&!/patch|test|monitor/.test(ITEMNAME[c.item])?"s":""}`});
  }else if(c.payer||c.kind){
   if(sess.scans){bad.push("Consultations need a clinic. Choose the clinic above first");continue}
   if(!c.payer||c.payer==="ins"){bad.push(`"${k} ${c.kind==="fu"?"follow-up":"new"}" left out: say which payer, such as Bupa or self-pay`);continue}
   const kind=c.kind||(sid.endsWith("Fri")?"fu":"new");
   ok.push({path:[sid,"consult",c.payer,kind],n:k,label:`${k} ${INAME[c.payer]} ${kind==="new"?"new":"follow-up"}${c.kind?"":" (assumed "+(kind==="new"?"new":"follow-up")+")"}`});
  }else bad.push(`The number ${k} was left out because it wasn't clear what it was for`);
 }
 return{ok,bad};
}
function guessSession(){
 const d=new Date(),day=d.getDay(),h=d.getHours();
 if(day===1)return"kp";
 if(day===4)return h<12?"spire":h<17?"reporting":"nuffield";
 if(day===5)return"spireFri";
 return"kp";
}

const parseAmt=v=>{if(v==null||String(v).trim()==="")return NaN;const s=String(v).replace(/[£,\s]/g,"");const neg=/^\(.*\)$/.test(s)||/^-/.test(s);const x=parseFloat(s.replace(/[()+-]/g,""));return neg?-x:x};
function parseDateFlex(s){
 if(!s)return null;s=String(s).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
 if(m)return iso(new Date(+m[1],+m[2]-1,+m[3]));
 m=s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/);
 if(m){let y=+m[3];if(y<100)y+=2000;return iso(new Date(y,+m[2]-1,+m[1]))}
 m=s.match(/^(\d{1,2})[\s-]+([A-Za-z]{3})[A-Za-z]*[\s-]+(\d{2,4})/);
 if(m){const mi="janfebmaraprmayjunjulaugsepoctnovdec".indexOf(m[2].toLowerCase());let y=+m[3];if(y<100)y+=2000;if(mi>=0&&mi%3===0)return iso(new Date(y,mi/3,+m[1]))}
 return null;
}
function parseCSV(text){
 const rows=[];let row=[],f="",q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!=="\r")f+=c;
 }
 if(f||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()));
}
function matchPayer(desc){
 const d=desc.toLowerCase();
 for(const p of PAYERS){const ws=(data.settings.keywords[p.id]||"").split(",").map(w=>w.trim().toLowerCase()).filter(Boolean);if(ws.some(w=>d.includes(w)))return p.id}
 return "";
}
function ingest(items){
 const ids=new Set(data.txns.map(x=>x.id));let added=0,matched=0,dup=0;
 for(const it of items){
  if(!it.date||!(it.amount>0))continue;
  const description=String(it.description||"").trim().slice(0,80);
  const id=`${it.date}|${it.amount.toFixed(2)}|${description.toLowerCase()}`;
  if(ids.has(id)){dup++;continue}ids.add(id);
  const payer=matchPayer(description);if(payer)matched++;
  data.txns.push({id,date:it.date,description,amount:Math.round(it.amount*100)/100,payer});added++;
 }
 persist();render();
 toast(added?`Added ${added} payments: ${matched} matched, ${added-matched} to check${dup?`, ${dup} already imported`:""}.`:dup?"These payments were already imported.":"No incoming payments found in that file.");
}
async function importCSV(file){
 const rows=parseCSV(await file.text());
 const hi=rows.findIndex((r,i)=>i<25&&r.some(c=>/date/i.test(c)));
 if(hi<0){toast("Couldn't find a date column. Export the statement as CSV from your bank and try again.");return}
 const head=rows[hi].map(h=>h.toLowerCase().trim());
 const col=(exact,partial,skip=[])=>{let i=head.findIndex((h,j)=>!skip.includes(j)&&exact.includes(h));if(i<0)i=head.findIndex((h,j)=>!skip.includes(j)&&partial.some(p=>h.includes(p)));return i};
 const di=col(["date","transaction date","posting date","posted date"],["date"]);
 const ci=col(["paid in","money in","credit","credits","credit amount","paid in (£)","money in (£)"],["paid in","money in","credit"]);
 const ai=col(["amount","value","amount (£)"],["amount"],[ci]);
 const de=col(["description","details","narrative","memo","payee","name","reference","transaction description","counter party"],["descr","detail","narrative","payee","memo","reference","name","counter"],[di,ci,ai]);
 if(ci<0&&ai<0){toast("Couldn't find an amount or paid-in column in that CSV.");return}
 ingest(rows.slice(hi+1).map(r=>({date:parseDateFlex(r[di]),amount:parseAmt(ci>=0?r[ci]:r[ai]),description:de>=0?r[de]:r.filter((_,j)=>j!==di&&j!==ci&&j!==ai).join(" ")})));
}
function vPayments(){
 const todo=data.txns.filter(x=>!x.payer);
 const list=(S.filter==="todo"?todo:S.filter==="all"?data.txns.filter(x=>x.payer&&x.payer!=="ignore"):data.txns.filter(x=>x.payer==="ignore")).slice().sort((a,b)=>b.date.localeCompare(a.date));
 const opts=sel=>`<option value="">Choose payer</option>${PAYERS.map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${p.name}</option>`).join("")}<option value="ignore" ${sel==="ignore"?"selected":""}>Not practice income</option>`;
 return `<div class="pad">
  <div class="card pcard" style="${pv("nuffield")}">
   <div class="qt" style="font-size:19px;font-weight:600">Upload a bank statement</div>
   <p class="help" style="margin-top:6px">Use a CSV export from your bank's app or website. The file is read on this phone only. Only incoming payments are kept, and payments already imported are skipped.</p>
   <label class="btn filebtn">Choose CSV file<input type="file" accept=".csv,text/csv,text/comma-separated-values" id="csv"></label>
  </div>
  <h2>Add a payment by hand</h2>
  <div class="card form">
   <label>Date<input class="t" type="date" id="mdate" value="${iso(today())}"></label>
   <label>Amount (£)<input class="t" type="number" inputmode="decimal" id="mamt"></label>
   <label>Paid by<select class="t" id="mpayer">${PAYERS.map(p=>`<option value="${p.id}">${p.name}</option>`).join("")}</select></label>
   <label>Note<input class="t" id="mnote"></label>
   <button class="btn alt" style="grid-column:1/-1" data-act="addpay">Add payment</button>
  </div>
  <div class="chips">${[["todo",`To match (${todo.length})`],["all","Practice income"],["ignore","Not practice income"]].map(([id,l])=>`<button class="chip ${S.filter===id?"on":""}" data-act="filter" data-f="${id}">${l}</button>`).join("")}</div>
  ${S.filter==="todo"&&todo.length?`<button class="link" data-act="ignoreall" style="margin-bottom:8px">Mark all of these as not practice income</button>`:""}
  <div class="card" style="padding:0">
   ${list.length?list.map(x=>`<div class="tx" ${PNAME[x.payer]?`style="border-left:6px solid ${PAYERS.find(p=>p.id===x.payer).color}"`:""}><div class="d">${esc(x.description)}</div><div class="a">${fmt(x.amount)}</div>
    <div class="muted" style="font-size:14px;align-self:center">${dayLabel(parseISO(x.date))} ${x.date.slice(0,4)}</div>
    <div style="display:flex;gap:4px;align-items:center"><select data-txn="${esc(x.id)}" aria-label="Payer">${opts(x.payer)}</select><button class="x" data-act="deltx" data-id="${esc(x.id)}" aria-label="Delete payment">×</button></div></div>`).join("")
   :`<div style="padding:16px" class="muted">${S.filter==="todo"?"Everything is matched. Upload a new statement when it arrives.":"No payments here yet."}</div>`}
  </div>
 </div>`;
}

// ---------- tariffs ----------
function vTariffs(){
 const inp=(path,label)=>`<input class="n" style="width:86px" type="number" inputmode="decimal" min="0" step="any" aria-label="${esc(label)}" data-tpath="${path}" data-num="1" value="${getPath(data,path.split("."))}">`;
 const trow=(label,path,note)=>`<label class="trow"><span>${label}${note?`<em>${note}</em>`:""}</span>${inp(path,label)}</label>`;
 
 return `<div class="pad">
  <p class="help">Changes save straight away and apply to every logged week, past and future. When a fee changes, update it from that date rather than earlier.</p>
  <h2>Consultations</h2>
  <div class="card"><table><thead><tr><th>Payer</th><th>New (£)</th><th>Follow-up (£)</th></tr></thead><tbody>
   ${INS.map(i=>`<tr><td>${i.name}</td><td class="c">${inp(`tariffs.consult.${i.id}.new`,`${i.name} new fee`)}</td><td class="c">${inp(`tariffs.consult.${i.id}.fu`,`${i.name} follow-up fee`)}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="grid3">${["spire","nuffield","kp"].map(h=>`<div><h2 style="color:${PAL[h].c}">${HOSP[h].name}</h2><div class="card pcard" style="${pv(h)}">${HOSP[h].inv.map(([k,l])=>trow(l,`tariffs.inv.${h}.${k}`)).join("")}</div></div>`).join("")}</div>
  <h2 style="color:${PAL.spire.c}">Procedures at Spire</h2>
  <div class="card pcard" style="${pv("spire")}">${trow("TOE, self-pay","tariffs.procs.toe.self")}${trow("TOE, insured","tariffs.procs.toe.insured","Provisional average. Update when insurer rates are confirmed.")}${trow("DC cardioversion, self-pay","tariffs.procs.dccv.self")}${trow("DC cardioversion, insured","tariffs.procs.dccv.insured")}</div>
  <h2 style="color:${PAL.reporting.c}">CT and MRI reporting</h2>
  <div class="card pcard" style="${pv("reporting")}">${trow("Insured, per scan","tariffs.scans.insured")}${trow("Self-pay, per scan","tariffs.scans.self")}</div>
  <h2>Matching bank payments</h2>
  <div class="card"><p class="help">Words that appear in the bank description for each payer, separated by commas. Add the exact wording from your statements if a payer isn't being matched.</p>
   ${PAYERS.map(p=>`<label style="display:block;font-size:14px;margin-bottom:8px;color:${PAL[p.id].c};font-weight:600">${p.name}<input class="t" style="font-weight:400;color:var(--ink)" data-tpath="settings.keywords.${p.id}" value="${esc(data.settings.keywords[p.id])}"></label>`).join("")}</div>
  <h2>Owed before you started logging</h2>
  <div class="card"><p class="help">If a statement includes payments for work done before your first logged week, enter what each payer owed you at that point so the balances stay accurate.</p>
   ${PAYERS.map(p=>trow(p.name,`settings.opening.${p.id}`)).join("")}</div>
  <h2>Backup</h2>
  <div class="card"><p class="help">Your data lives only on this phone. Save a backup every few weeks, for example to Files or by emailing it to yourself.</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn alt" data-act="backup">Save backup</button><label class="btn alt filebtn">Restore backup<input type="file" accept=".json,application/json" id="restore"></label></div>
   <div style="margin-top:12px">${S.confirm==="reset"?`<p style="font-size:15px">Delete all weeks, payments and settings? <button class="btn red small" data-act="reset">Delete everything</button> <button class="link" data-act="cancel">Keep</button></p>`:`<button class="link red" data-act="askreset">Delete all data</button>`}</div>
  </div>
 </div>`;
}
async function backup(){
 const text=JSON.stringify(data),name=`practice-backup-${iso(today())}.json`;
 try{const f=new File([text],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Practice dashboard backup"});return}}
 catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

// ---------- events ----------
document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");
 if(tb){S.tab=tb.dataset.tab;S.confirm="";render();window.scrollTo(0,0);return}
 const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;
 const a=b.dataset.act,mon=parseISO(S.start);
 if(a==="prev"){S.start=iso(addDays(mon,-7));S.confirm=""}
 else if(a==="next"){S.start=iso(addDays(mon,7));S.confirm=""}
 else if(a==="thisweek")S.start=iso(mondayOf(today()));
 else if(a==="goweek"){S.start=b.dataset.week;window.scrollTo(0,0)}
 else if(a==="quickgo"){S.tab="log";S.start=iso(mondayOf(today()));S.qsess=guessSession();render();window.scrollTo(0,0);const q=document.getElementById("qtext");if(q)q.focus();return}
 else if(a==="qadd"){if(rec)rec.stop();quickAdd();return}
 else if(a==="mic"){startMic();return}
 else if(a==="qclear")S.qtext="";
 else if(a==="askclear")S.confirm="week";
 else if(a==="askreset")S.confirm="reset";
 else if(a==="cancel")S.confirm="";
 else if(a==="clearweek"){delete data.weeks[S.start];persist();S.confirm="";toast("Week cleared")}
 else if(a==="reset"){data=clone(DEFAULT);persist();S.confirm="";toast("All data deleted")}
 else if(a==="filter")S.filter=b.dataset.f;
 else if(a==="ignoreall"){data.txns.forEach(x=>{if(!x.payer)x.payer="ignore"});persist();toast("Marked as not practice income")}
 else if(a==="deltx"){data.txns=data.txns.filter(x=>x.id!==b.dataset.id);persist()}
 else if(a==="addpay"){
  const amt=parseAmt(document.getElementById("mamt").value);
  if(!(amt>0)){toast("Enter an amount above zero.");return}
  data.txns.push({id:`manual|${Date.now()}`,date:document.getElementById("mdate").value||iso(today()),amount:amt,description:document.getElementById("mnote").value||"Added by hand",payer:document.getElementById("mpayer").value});
  persist();toast("Payment added");
 }
 else if(a==="backup"){backup();return}
 else return;
 render();
});
document.addEventListener("input",e=>{
 const el=e.target;
 if(el.id==="qtext"){S.qtext=el.value;document.getElementById("qprev").innerHTML=qPreviewHTML();return}
 if(el.dataset.path){onLogInput(el);return}
 if(el.dataset.tpath){setPath(data,el.dataset.tpath.split("."),el.dataset.num?Math.max(0,parseFloat(el.value)||0):el.value);persist()}
});
document.addEventListener("change",async e=>{
 const el=e.target;
 if(el.dataset.act==="month"){S.month=el.value;render();return}
 if(el.dataset.act==="qsess"){S.qsess=el.value;document.getElementById("qprev").innerHTML=qPreviewHTML();return}
 if(el.dataset.txn!==undefined){const t=data.txns.find(x=>x.id===el.dataset.txn);if(t){t.payer=el.value;persist();render()}return}
 if(el.id==="csv"&&el.files[0]){const f=el.files[0];el.value="";try{await importCSV(f)}catch(err){toast("Couldn't read that file. Check it's a CSV export from your bank.")}return}
 if(el.id==="restore"&&el.files[0]){const f=el.files[0];el.value="";try{data=deepMerge(clone(DEFAULT),JSON.parse(await f.text()));persist();render();toast("Backup restored")}catch(err){toast("That file isn't a valid backup.")}}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.sess&&d.open)S.open=d.dataset.sess},true);
render();
</script>
