<style>
:root{--navy:#2A1B6E;--ink:#1B1838;--muted:#5D5A78;--line:#E6E3F2;--paper:#FFFFFF;--bg:#F4F1FB;--gold:#FFD23F;--red:#E0245E;--accent:#6C2BD9}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45;color:var(--ink);background:var(--bg);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FA7E0;outline-offset:2px}
header{background:linear-gradient(120deg,#22146B 0%,#5B21B6 55%,#C2185B 100%);color:#fff;position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top)}
.hin{max-width:760px;margin:0 auto;padding:12px 16px 0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:22px;font-weight:600;letter-spacing:.01em}
.newc{font-size:14px;color:var(--gold);white-space:nowrap}
.tabs{display:flex;gap:2px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:#E4DCFF;padding:10px 2px 11px;font-size:15px;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;font-weight:600;border-bottom-color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.search{width:100%;font-size:16px;padding:11px 12px;border:1px solid #D3D8E4;border-radius:10px;background:#fff}
.row{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:15px;padding:7px 12px;border-radius:18px;border:1px solid #CDD3E1;background:#fff;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.chip.cat{border-color:var(--cc);color:var(--cc);font-weight:600}
.chip.cat.on{color:#fff}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meta{font-size:14px;color:var(--muted);margin:12px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.art{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--jc);box-shadow:0 2px 8px rgba(60,30,120,.06);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.art .jn{font-size:13px;font-weight:600;color:var(--jc);display:flex;justify-content:space-between;gap:8px}
.art .jn .dt{color:var(--muted);font-weight:400}
.new{display:inline-block;font-size:12px;font-weight:700;color:#2A1B6E;background:var(--gold);border-radius:8px;padding:0 6px;margin-left:6px}
.art h2{font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:18px;line-height:1.3;font-weight:600;margin:4px 0 4px}
.au{font-size:14px;color:var(--muted)}
.pt{font-size:13px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:16px;align-items:center;margin-top:8px;flex-wrap:wrap}
.acts a,.acts button{font-size:15px;color:#5B21B6;text-decoration:none;border:0;background:none;padding:4px 0;font-weight:600}
.star{margin-left:auto;font-size:22px!important;line-height:1;color:#B8BECC!important;font-weight:400!important}
.star.on{color:var(--gold)!important}
.abs{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-family:"Iowan Old Style","Charter",Georgia,serif;font-size:16px;line-height:1.55}
.abs p+p{margin-top:8px}
.abs b{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;font-size:14px}
.more{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #CDD3E1;background:#fff;font-size:16px;font-weight:600;color:var(--navy)}
.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--muted)}
.msg.err{border-color:#F0C9CF;background:#FDF2F4;color:#8E2335}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-bottom:16px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.set+.set{border-top:1px solid var(--line)}
.set select{font-size:16px;padding:6px 8px;border:1px solid #D3D8E4;border-radius:8px;background:#fff}
.set input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy)}
h3{font-size:17px;margin:18px 2px 8px}
.help{font-size:14px;color:var(--muted);margin:0 2px 10px}
.link{border:0;background:none;color:var(--red);font-size:15px;text-decoration:underline;padding:6px 0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #CDD3E1;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;background:var(--tc,#EEE9FB);color:#fff;font-weight:600}
.arch{margin-left:auto}
.arch.on{color:#3E7D3A!important}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.gl{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.gl a.gi{display:block;padding:12px 14px;text-decoration:none;color:var(--ink)}
.gl a.gi+a.gi{border-top:1px solid var(--line)}
.gl .code{font-size:13px;color:var(--muted)}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 14px 14px}
.doc h2,.doc h3{font-family:"Iowan Old Style","Charter",Georgia,serif;margin:18px 0 6px;font-size:18px;line-height:1.3;color:#5B21B6}
.doc h3{font-size:17px}
.doc p,.doc li{font-size:14px;margin:6px 0;line-height:1.45}
.doc ul,.doc ol{padding-left:20px}
.doc .tw{margin:8px 0}
.doc table{border-collapse:collapse;font-size:13px;width:100%;table-layout:fixed}
.doc th,.doc td{border:1px solid var(--line);padding:5px 6px;vertical-align:top;text-align:left;overflow-wrap:anywhere;hyphens:auto}
.doc *{max-width:100%}
.doc{overflow-wrap:anywhere}
.doc th{background:#F3F5F9}
.doc a{color:#2D4E8A}
.sec[hidden]{display:none}
.kp{padding:12px 14px}
.kp+.kp{border-top:1px solid var(--line)}
.kp h4{font-size:16px;margin-bottom:4px}
.kp ul{padding-left:18px;font-size:15px}
.kp li{margin:3px 0}
.kp .lk{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.kp .lk a{font-size:14px;color:#2D4E8A;font-weight:600;text-decoration:none}
.note{font-size:13px;color:var(--muted);margin:8px 2px 14px}
.hl{border-radius:16px;padding:14px;margin:12px 0 6px;background:linear-gradient(135deg,#5B21B6,#C2185B);color:#fff;box-shadow:0 6px 18px rgba(91,33,182,.25)}
.hl h3{margin:0 0 8px;font-size:17px;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.hl h3 small{font-weight:400;font-size:13px;opacity:.85}
.hi{display:block;background:rgba(255,255,255,.12);border-radius:10px;padding:9px 10px;margin-top:6px;color:#fff;text-decoration:none}
.hi .k{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--gold);color:#2A1B6E;border-radius:6px;padding:1px 6px;margin-right:6px}
.hi .k.g{background:#7CF5C9}
.hi b{font-family:"Iowan Old Style","Charter",Georgia,serif;font-weight:600;font-size:15px;line-height:1.3}
.hi .s{font-size:12px;opacity:.85;margin-top:2px}
.calc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-top:5px solid var(--cc,var(--accent))}
.calc h3{margin:2px 0 4px;font-size:18px;color:var(--cc,var(--accent))}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fg label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.fg .full{grid-column:1/-1}
.fg input[type=number],.fg select{font-size:16px;padding:8px;border:1px solid #D8D3EA;border-radius:8px;background:#fff;color:var(--ink);width:100%}
.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;font-size:15px!important;color:var(--ink)!important;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#FBFAFE}
.ck input{width:22px;height:22px;accent-color:var(--cc,var(--accent));flex:0 0 auto}
.ck .pts{margin-left:auto;font-size:13px;color:var(--muted)}
.res{margin-top:14px;border-radius:12px;padding:12px 14px;background:var(--rb,#F1ECFF);color:var(--rc,#2A1B6E)}
.res .big{font-size:32px;font-weight:700;line-height:1.1}
.res p{font-size:14px;margin-top:4px}
.res.low{--rb:#DFF7EA;--rc:#0E6B3B}.res.mid{--rb:#FFF1D6;--rc:#8A5300}.res.high{--rb:#FFE0E8;--rc:#A3123F}
.pk{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.pk a{flex:1 1 140px;text-align:center;padding:12px;border-radius:12px;font-weight:700;text-decoration:none;color:#fff;background:linear-gradient(135deg,#5B21B6,#C2185B)}
.pk a.alt{background:#fff;color:#5B21B6;border:2px solid #5B21B6}
</style>
</head>

async function getJSON(url,tries=3){
 for(let i=0;i<tries;i++){
  try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),15000);
   const r=await fetch(url,{signal:ctl.signal});clearTimeout(tm);
   if(r.status===429){await new Promise(z=>setTimeout(z,900*(i+1)));continue}
   if(!r.ok)throw new Error("HTTP "+r.status);
   return await r.json();
  }catch(e){if(i===tries-1)throw e;await new Promise(z=>setTimeout(z,700))}
 }
 throw new Error("busy");
}

}
async function search(t,start,n,extra){

 const ids=(sr.esearchresult&&sr.esearchresult.idlist)||[];
 const count=+((sr.esearchresult&&sr.esearchresult.count)||0);
 if(!ids.length)return{count,items:[]};
 const sm=await getJSON(`${E}esummary.fcgi?db=pubmed&retmode=json&tool=cardioreader&id=${ids.join(",")}`);
 return{count,items:(sm.result&&sm.result.uids||[]).map(u=>toItem(sm.result[u]))};
}

}

 case "hasbled":return `<div class="fg">${ck("h","Uncontrolled hypertension (systolic over 160)",1)}${ck("ren","Abnormal renal function (dialysis, transplant, Cr over 200 µmol/L)",1)}${ck("liv","Abnormal liver function (cirrhosis, bilirubin over 2×, ALT/AST over 3×)",1)}${ck("s","Previous stroke",1)}${ck("b","Bleeding history or predisposition",1)}${ck("l","Labile INR (TTR under 60%)",1)}${ck("e","Elderly (over 65)",1)}${ck("dr","Antiplatelet or NSAID use",1)}${ck("al","Alcohol (8 or more units a week)",1)}</div>`;
 case "bmi":return `<div class="fg">${inp("ht","Height (cm)","170")}${inp("wt","Weight (kg)","75")}</div>`;
 case "bsa":return `<div class="fg">${inp("ht","Height (cm)","170")}${inp("wt","Weight (kg)","75")}</div>`;
 case "qtc":return `<div class="fg">${inp("qt","QT interval (ms)","400")}${inp("hr","Heart rate (bpm)","72")}${sel("sex","Sex",SEX,true)}</div>`;
 case "renal":return `<div class="fg">${sel("sex","Sex",SEX)}${inp("age","Age (years)","70")}${inp("wt","Weight (kg)","75")}${inp("cr","Creatinine (µmol/L)","90")}</div><p class="note">Use Cockcroft-Gault creatinine clearance (actual body weight) for DOAC dosing.</p>`;
 case "hcm":return `<p class="help">5-year sudden cardiac death risk in HCM (ESC HCM Risk-SCD), for patients aged 16 or over without previous VF or sustained VT.</p><div class="fg">
  ${inp("age","Age (years)","40")}${inp("mwt","Max wall thickness (mm)","20")}${inp("la","LA diameter (mm)","40")}${inp("lvot","Max LVOT gradient (mmHg)","10")}
  ${ck("fh","Family history of SCD")}${ck("nsvt","Non-sustained VT")}${ck("syn","Unexplained syncope")}</div>`;
 case "heart":return `<div class="fg">${sel("h","History",[["0","Slightly suspicious (0)"],["1","Moderately suspicious (1)"],["2","Highly suspicious (2)"]],true)}
  ${sel("e","ECG",[["0","Normal (0)"],["1","Non-specific repolarisation change (1)"],["2","Significant ST deviation (2)"]],true)}
  ${sel("a","Age",[["0","Under 45 (0)"],["1","45 to 64 (1)"],["2","65 or over (2)"]],true)}
  ${sel("r","Risk factors",[["0","None known (0)"],["1","1 or 2 risk factors (1)"],["2","3 or more, or known atherosclerosis (2)"]],true)}
  ${sel("t","Initial troponin",[["0","At or below normal limit (0)"],["1","1 to 3 times normal limit (1)"],["2","Over 3 times normal limit (2)"]],true)}</div>`;
 case "timi":return `<div class="fg">${ck("age","Age 65 or over",1)}${ck("rf","3 or more CAD risk factors",1)}${ck("cad","Known CAD (stenosis 50% or more)",1)}${ck("asa","Aspirin in the past 7 days",1)}${ck("ang","2 or more anginal episodes in 24 hours",1)}${ck("st","ST deviation 0.5 mm or more",1)}${ck("mk","Raised cardiac markers",1)}</div>`;
 case "ldl":return `<div class="fg">${inp("tc","Total cholesterol (mmol/L)","5.2")}${inp("hdl","HDL (mmol/L)","1.3")}${inp("tg","Triglycerides (mmol/L)","1.5",true)}</div>`;
 }
 return "";
}
function calcResult(id){
 const v=S.cv[id];
 switch(id){
 case "assign":{
  const age=num(v.age),tc=num(v.tc),hdl=num(v.hdl),sbp=num(v.sbp),cig=num(v.cig)||0,simd=num(v.simd);
  if([age,tc,hdl,sbp,simd].some(isNaN))return need("Enter age, cholesterol, HDL, systolic BP and SIMD score.");
  const warn=[];if(age<30||age>74)warn.push("ASSIGN is validated for ages 30 to 74.");if(sbp<80||sbp>250)warn.push("Systolic BP should be 80 to 250.");if(tc<2||tc>12.5)warn.push("Cholesterol should be 2 to 12.5.");if(hdl<0.3||hdl>3.5)warn.push("HDL should be 0.3 to 3.5.");
  const dm=v.dm?1:0,fh=v.fh?1:0,s10=simd/10;let r;
  if(v.sex==="m"){const as=0.05698*age+0.22286*tc-0.53684*hdl+0.01183*sbp+0.81558*dm+0.275*fh+0.02005*cig+0.06296*s10;
   const lb=0.05698*55.3999+0.2286*5.5488-0.53684*1.2944+0.01183*141.5754+0.81558*0.0481+0.275*0.5620+0.02005*2.0560+0.06296*1.4701;r=100*(1-Math.pow(0.9130,Math.exp(as-lb)))}
  else{const as=0.07203*age+0.12720*tc-0.55836*hdl+0.01064*sbp+0.97727*dm+0.492*fh+0.02724*cig+0.09386*s10;
   const lb=0.07203*55.1321+0.1272*5.8199-0.55836*1.6086+0.01064*135.2402+0.97727*0.0268+0.492*0.6129+0.02724*1.6107+0.09386*1.4740;r=100*(1-Math.pow(0.9666,Math.exp(as-lb)))}
  return R(r>=10?"high":"low",f1(r)+"%",["10-year risk of CVD (ASSIGN v2.0).",r>=10?"High risk: 10% or more.":"Below the 10% high-risk threshold.",...warn,"People with CKD (eGFR under 60), familial hypercholesterolaemia, or diabetes over 40 are high risk without scoring."]);}
 case "qrisk":{
  const age=num(v.age),ht=num(v.ht),wt=num(v.wt),tc=num(v.tc),hdl=num(v.hdl),sbp=num(v.sbp);
  if([age,ht,wt,tc,hdl,sbp].some(isNaN))return need("Enter age, height, weight, cholesterol, HDL and systolic BP.");
  if(age<25||age>84)return need("QRISK3 is valid for ages 25 to 84.");
  const fem=v.sex==="f",bmi=wt/Math.pow(ht/100,2),sd=num(v.sbpsd);
  const r=qrisk3({female:fem,age,bmi,rati:tc/hdl,sbp,sbps5:isNaN(sd)?(fem?QR_MEAN.f.sbps5:QR_MEAN.m.sbps5):sd,town:fem?QR_MEAN.f.town:QR_MEAN.m.town,ethrisk:+v.eth,smoke:+v.smoke,
   b_AF:v.af?1:0,b_atypicalantipsy:v.aap?1:0,b_corticosteroids:v.ster?1:0,b_impotence2:!fem&&v.ed?1:0,b_migraine:v.mig?1:0,b_ra:v.ra?1:0,b_renal:v.ckd?1:0,b_semi:v.smi?1:0,b_sle:v.sle?1:0,b_treatedhyp:v.bptx?1:0,b_type1:v.diab==="1"?1:0,b_type2:v.diab==="2"?1:0,fh_cvd:v.fh?1:0});
  return R(r>=10?"high":"low",f1(r)+"%",["10-year risk of heart attack or stroke (QRISK3).",`BMI ${f1(bmi)}, cholesterol/HDL ratio ${f1(tc/hdl)}.`,r>=10?"10% or more: NICE NG238 advises discussing statin treatment.":"Under 10%: focus on lifestyle and review risk factors."]);}
 case "cha":{
  const base=+v.age+(v.chf?1:0)+(v.htn?1:0)+(v.dm?1:0)+(v.stroke?2:0)+(v.vasc?1:0),vasc=base+(v.fem?1:0);
  const cls=base>=2?"high":base===1?"mid":"low";
  return R(cls,`${base}`,[`CHA₂DS₂-VA (ESC 2024): ${base}. CHA₂DS₂-VASc: ${vasc}.`,base>=2?"2 or more: oral anticoagulation is recommended.":base===1?"1: oral anticoagulation should be considered.":"0: anticoagulation is not recommended for stroke prevention.","Weigh against bleeding risk and patient preference."]);}
 case "hasbled":{
  const s=["h","ren","liv","s","b","l","e","dr","al"].reduce((a,k)=>a+(v[k]?1:0),0);
  return R(s>=3?"high":s===2?"mid":"low",`${s}`,[s>=3?"3 or more: high bleeding risk. Address modifiable factors and review more often.":"Below 3: lower bleeding risk.","A high score alone isn't a reason to withhold anticoagulation."]);}
 case "bmi":{
  const h=num(v.ht)/100,w=num(v.wt);if(isNaN(h)||isNaN(w)||!h)return need("Enter height and weight.");
  const b=w/(h*h),cat=b<18.5?"Underweight":b<25?"Healthy weight":b<30?"Overweight":b<35?"Obesity class 1":b<40?"Obesity class 2":"Obesity class 3";
  return R(b<18.5||b>=30?"high":b>=25?"mid":"low",f1(b),[`${cat}.`,"For South Asian, Chinese, Black African or Caribbean heritage, NICE uses lower thresholds: 23 (overweight) and 27.5 (obesity)."]);}
 case "bsa":{
  const h=num(v.ht),w=num(v.wt);if(isNaN(h)||isNaN(w))return need("Enter height and weight.");
  const m=Math.sqrt(h*w/3600),d=0.007184*Math.pow(w,0.425)*Math.pow(h,0.725);
  return R("",`${f2(m)} m²`,["Mosteller formula.",`Du Bois: ${f2(d)} m².`]);}
 case "qtc":{
  const qt=num(v.qt),hr=num(v.hr);if(isNaN(qt)||isNaN(hr)||!hr)return need("Enter QT interval and heart rate.");
  const rr=60/hr,baz=qt/Math.sqrt(rr),fri=qt/Math.cbrt(rr),fra=qt+154*(1-rr),hod=qt+1.75*(hr-60);
  const lim=v.sex==="f"?460:450,cls=fri>=500?"high":fri>lim?"mid":"low";
  return R(cls,`${Math.round(fri)} ms`,["Fridericia (preferred at faster or slower rates).",`Bazett ${Math.round(baz)} ms, Framingham ${Math.round(fra)} ms, Hodges ${Math.round(hod)} ms.`,fri>=500?"500 ms or more: high risk of torsades.":fri>lim?`Prolonged (over ${lim} ms).`:"Within normal limits."]);}
 case "renal":{
  const age=num(v.age),wt=num(v.wt),cr=num(v.cr);if([age,cr].some(isNaN)||!cr)return need("Enter age and creatinine (and weight for CrCl).");
  const f=v.sex==="f",k=f?0.7:0.9,al=f?-0.241:-0.302,sc=cr/88.4;
  const eg=142*Math.pow(Math.min(sc/k,1),al)*Math.pow(Math.max(sc/k,1),-1.2)*Math.pow(0.9938,age)*(f?1.012:1);
  const cg=isNaN(wt)?null:(140-age)*wt*(f?1.04:1.23)/cr;
  return R(eg<30?"high":eg<60?"mid":"low",`${Math.round(eg)}`,["eGFR (CKD-EPI 2021), mL/min/1.73 m².",cg!=null?`Creatinine clearance (Cockcroft-Gault): ${Math.round(cg)} mL/min.`:"Add weight for creatinine clearance."]);}
 case "hcm":{
  const age=num(v.age),mwt=num(v.mwt),la=num(v.la),g=num(v.lvot);if([age,mwt,la,g].some(isNaN))return need("Enter age, wall thickness, LA diameter and LVOT gradient.");
  const pi=0.15939858*mwt-0.00294271*mwt*mwt+0.0259082*la+0.00446131*g+0.4583082*(v.fh?1:0)+0.82639195*(v.nsvt?1:0)+0.71650361*(v.syn?1:0)-0.01799934*age;
  const r=100*(1-Math.pow(0.998,Math.exp(pi)));
  return R(r>=6?"high":r>=4?"mid":"low",f1(r)+"%",["5-year risk of sudden cardiac death.",r>=6?"6% or more: an ICD should be considered.":r>=4?"4 to under 6%: an ICD may be considered.":"Under 4%: an ICD is generally not indicated, unless other risk features are present.",...(age<16?["Not validated under 16."]:[]),...(mwt>35?["Wall thickness over 35 mm is outside the model's range."]:[])]);}
 case "heart":{
  const s=+v.h+ +v.e+ +v.a+ +v.r+ +v.t;
  return R(s>=7?"high":s>=4?"mid":"low",`${s}`,[s>=7?"7 to 10: high risk of 6-week MACE (about 50 to 65%). Early invasive strategy.":s>=4?"4 to 6: moderate risk (about 12 to 17%). Admit for observation and further tests.":"0 to 3: low risk (about 1 to 2%). Early discharge may be considered."]);}
 case "timi":{
  const s=["age","rf","cad","asa","ang","st","mk"].reduce((a,k)=>a+(v[k]?1:0),0),rt=[4.7,4.7,8.3,13.2,19.9,26.2,40.9,40.9][s];
  return R(s>=5?"high":s>=3?"mid":"low",`${s}`,[`14-day risk of death, MI or urgent revascularisation: ${rt}%.`]);}
 case "ldl":{
  const tc=num(v.tc),h=num(v.hdl),tg=num(v.tg);if([tc,h].some(isNaN))return need("Enter total cholesterol and HDL.");
  const nh=tc-h;if(isNaN(tg))return R("",`${f1(nh)}`,["Non-HDL cholesterol (mmol/L). Add triglycerides for LDL."]);
  if(tg>4.5)return R("mid",`${f1(nh)}`,["Non-HDL cholesterol (mmol/L).","Friedewald LDL isn't valid with triglycerides over 4.5 mmol/L. Use non-HDL or direct LDL."]);
  return R("",`${f2(tc-h-tg/2.2)}`,["LDL cholesterol (Friedewald), mmol/L.",`Non-HDL cholesterol: ${f1(nh)} mmol/L.`]);}
 }
 return "";
}
function vScores(){
 const c=CALCS.find(x=>x.id===S.calc);
 return `<div class="row" style="flex-wrap:wrap;overflow:visible">${CALCS.map(x=>`<button class="chip cat ${S.calc===x.id?"on":""}" style="--cc:${x.c}" data-act="calc" data-v="${x.id}">${x.name}</button>`).join("")}</div>
 <div class="calc" style="--cc:${c.c};margin-top:10px"><h3>${c.name}</h3>${calcForm(c.id)}<div id="cres">${calcResult(c.id)}</div>
 <button class="link" style="color:var(--muted);margin-top:8px" data-act="creset">Clear</button></div>
 <p class="note">Calculated on your phone; nothing is sent anywhere. For clinical decisions, check results against the source guideline.</p>`;
}

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
 const n=S.newIds.size;document.getElementById("newc").textContent=n?`${n} new`:"";
 const fid=document.activeElement&&["q","dq"].includes(document.activeElement.id)?document.activeElement.id:"";
 $m.innerHTML=S.tab==="latest"?vLatest():S.tab==="guide"?vGuide():S.tab==="scores"?vScores():S.tab==="saved"?vSaved():vSettings();
 if(fid){const q=document.getElementById(fid);if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}
function findItem(id){return S.items.find(x=>x.pmid===id)||Object.values(S.gl).flat().find(x=>x&&x.pmid===id)}
let qTimer,dTimer;
document.addEventListener("click",e=>{
 const tb=e.target.closest("[data-tab]");if(tb){S.tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act;
 if(a==="c"){S.cat=b.dataset.v;load()}
 else if(a==="j"){S.j=b.dataset.v;load()}
 else if(a==="refresh"){load();if(S.cat==="all")loadHL()}
 else if(a==="more"){if(!S.loading)load(true)}
 else if(a==="abs")loadAbs(b.dataset.id);
 else if(a==="star"){const id=b.dataset.id;if(st.saved[id])delete st.saved[id];else{const it=findItem(id);if(it)st.saved[id]={...it,at:Date.now()}}save();render()}
 else if(a==="g"){S.g=b.dataset.v;render()}
 else if(a==="gs"){S.gsub=b.dataset.v;render()}
 else if(a==="gretry"){S.gerr[S.gsub]="";loadGuide(S.gsub)}
 else if(a==="dvla")loadDVLA(true);
 else if(a==="jump"){const el=document.getElementById("dv"+b.dataset.v);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
 else if(a==="calc"){S.calc=b.dataset.v;render()}
 else if(a==="creset"){S.cv[S.calc]=JSON.parse(JSON.stringify(CDEF[S.calc]));render()}
 else if(a==="clearsaved"){if(confirm("Remove all archived articles?")){st.saved={};save();render()}}
});
function cvSet(el){
 const k=el.dataset.cv;S.cv[S.calc][k]=el.type==="checkbox"?el.checked:el.value;
 if(el.tagName==="SELECT"&&S.calc==="qrisk"&&k==="sex"){render();return}
 const r=document.getElementById("cres");if(r)r.innerHTML=calcResult(S.calc);
}
document.addEventListener("input",e=>{
 if(e.target.dataset&&e.target.dataset.cv){cvSet(e.target);return}
 if(e.target.id==="q"){S.q=e.target.value;clearTimeout(qTimer);qTimer=setTimeout(()=>load(),700)}
 else if(e.target.id==="dq"){S.dq=e.target.value;clearTimeout(dTimer);dTimer=setTimeout(render,250)}
});
document.addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.cv){cvSet(el);return}
 if(el.id==="days"){st.days=+el.value;save();load()}
 else if(el.id==="research"){st.research=el.checked;save();load()}
 else if(el.dataset.jt){if(el.checked)delete st.off[el.dataset.jt];else st.off[el.dataset.jt]=true;if(st.off[S.j])S.j="all";save();load()}
});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter"){clearTimeout(qTimer);e.target.blur();load()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&st.last&&Date.now()-st.last>3*3600e3&&S.tab==="latest")load()});
render();load();loadHL();

</script>
